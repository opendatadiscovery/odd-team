- id: H-010
  hypothesis: "When a producer pushes statistics for a field whose ODDRN does not exist in the platform (e.g. a typo), the platform signals the failure — a 4xx, or at minimum a logged warning — so the producer knows the data did not land."
  derivation: "Negative-space + the sibling `postDataEntityList` returns 4xx on unknown parent/reference ODDRNs (DatasetFieldIngestionTest.missingFieldDependenciesTest), so a product owner expects symmetric feedback on the stats path."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Unknown field ODDRNs are SILENTLY DROPPED. `getLastVersionDatasetFieldsByOddrns`
      returns only the existing rows; field ODDRNs with no matching row are simply
      absent from `existingFields`, and the for-loop iterates only over the resolved
      set (lines 172-181, 237). No `BadUserRequestException`, no `log.warn`. The
      `log.error("Unexpected behaviour...")` at lines 240-241 fires only in the
      inverse (impossible-by-construction) direction. The caller gets 201 Created
      having written zero rows. Contrast the sibling entity-list path, which 4xxes on
      unknown dependencies (DatasetFieldIngestionTest.missingFieldDependenciesTest,
      asserting `is4xxClientError`).
    evidence:
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: bugs_limitations_corner_cases[8]
        cite: "DatasetFieldServiceImpl.java:172-181,237-244 (silent drop + inverse-direction log)"
        note: "unknown field ODDRN -> 201, zero write, no warning"
      - sidecar: odd-platform__java__IngestionController__controller-method__postDataSetStatsList
        section: tests_coverage_semantic.uncovered_behaviours[7]
        cite: "DatasetFieldIngestionTest.java:308-332 missingFieldDependenciesTest (entity-list 4xx — the asymmetry)"
        note: "sibling path 4xxes; stats path does not"
