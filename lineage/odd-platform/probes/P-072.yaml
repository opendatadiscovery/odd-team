act:
  - kind: dom-probe
    note: Playwright (local, headless) against the running UI
    steps:
      - navigate: /management/datasources
      - wait_for_selector: "#datasources-list"
      - capture_as: header_count_before_search
        expression: "numeric value in the 'N datasources overall' header"
      - capture_as: card_count_before_search
        expression: "count of datasource cards rendered"
      # active search — 'alpha-' matches exactly 2
      - type_into: { selector: "input[placeholder='Search datasource']", text: "alpha-" }
      - wait: 800ms   # past the 500ms debounce
      - wait_for_network_idle: true
      - capture_as: header_count_during_search
        expression: "numeric value in the 'N datasources overall' header"
      - capture_as: card_count_during_search
        expression: "count of datasource cards rendered"
      # clear the search — header should resync
      - clear: "input[placeholder='Search datasource']"
      - wait: 800ms
      - wait_for_network_idle: true
      - capture_as: header_count_after_clear
        expression: "numeric value in the 'N datasources overall' header"
observe:
  - kind: rest
    method: GET
    path: /api/datasources?page=1&size=30&query=alpha-
    capture_as: api_search_response
assert:
  - "header_count_before_search == 10"
  - "card_count_before_search == 10"
  - "card_count_during_search == 2  # search correctly narrows the list"
  - "api_search_response.pageInfo.total == 2  # the slice DOES receive the correct search-scoped total"
  - "header_count_during_search == 10  # BUG: header is frozen at the pre-search total, not 2"
  - "header_count_after_clear == 10  # header resyncs once the query is cleared"
cleanup:
  - kind: docker-compose-down
