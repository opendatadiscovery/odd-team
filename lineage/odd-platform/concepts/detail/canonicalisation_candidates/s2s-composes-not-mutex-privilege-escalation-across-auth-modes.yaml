proposed_canonical: S2S composes-not-mutex (privilege escalation across auth modes)
rationale: '4-sidecar triangulated cross-cutting invariant from batch C: S2sAuthenticationFilter
  is composed ADDITIVELY into the LOGIN_FORM/OAUTH2/LDAP SecurityWebFilterChain at
  HTTP_BASIC order — and grants ADMIN role across the ENTIRE /** surface (not just
  /ingestion/**). Under DISABLED, S2S is silently ignored. Live `enable-security/authentication/s2s`
  page confirms ''they can call any endpoint that admins can call'' but the per-mode
  pages do NOT cross-link or warn. Critical for any operator considering S2S — extend
  `enable-security` with explicit cross-page warning.'
contributing_concepts:
- OAuthSecurityConfiguration@L71.implicit_adrs[1] (S2S composes-not-mutex)
- LDAPSecurityConfiguration@L51.implicit_adrs[S2S composable across modes]
- LoginFormSecurityConfiguration@L31.implicit_adrs[2] (S2S additive)
- DisabledAuthSecurityConfiguration@L10.bugs_limitations_corner_cases[2] (S2S silently
  ignored under DISABLED)
- S2sAuthenticationFilter.java:31-39 (hard-coded ADMIN role)
suggested_add_to_docs: true
