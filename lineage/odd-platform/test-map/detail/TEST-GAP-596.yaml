behaviour: |-
  **GitHub Enterprise Server (GHES) operators silently locked out — `api.github.com` hard-coded.** Line 39: `private final WebClient webClient = WebClient.create("https://api.github.com");` — no `@Value`, no operator-property, no `apiBaseUrl` field on ODDOAuth2Properties.OAuth2Provider (verified by Grep). A GHES deployment with API at `https://github.example.com/api/v3` is structurally incompatible. The handler IS selected if `provider=github` (the GithubCondition only checks the literal string `GITHUB`), so an operator configuring a GHES OAuth client with `provider: github` gets bean instantiation + login attempts that fail with DNS/cert errors to api.github.com. Live docs WebFetched 2026-05-19 status 200 silent on GHES. One entire class of GitHub operator silently locked out by hard-coding that could be a one-line addition.
