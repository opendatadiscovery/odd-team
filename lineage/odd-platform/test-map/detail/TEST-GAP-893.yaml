proposed_action: |-
  Add `TagApiSpecConformanceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Four test methods:
  1. `getPopularTagList_idsParameter_filtersByTagIdNotEntityId_pinsLSN020Drift` — seed tags with known ids; `GET /api/tags?ids={tagId}`; assert the tag with that id IS returned. Then `GET /api/tags?ids={someDataEntityIdThatIsNotAlsoATagId}`; assert an empty result. PINS the `ids`=tag-id semantics against the spec's "Entity ids" description.
  2. `updateTag_nonExistentId_returns404_specDeclaresNo404` — `PUT /api/tags/{nonexistent}`; assert 404; cross-reference that `openapi.yaml` declares no 404 for `updateTag`. Surfaces the contract gap.
  3. `deleteTag_nonExistentId_returns404_specDeclaresNo404` — sister assertion for `deleteTag`.
  4. `createTag_duplicateName_returns4xx_specDeclaresNo4xx` — seed a tag; `POST` the same name; assert a 4xx; cross-reference that `openapi.yaml` declares no 4xx for `createTag`.

  Pair with a DOC-NNN: add a dedicated `TagIdsParam` component with description "Tag ids" (or an operation-level override), and declare the `4xx` error responses on all four `tag` operations referencing the existing `ErrorResponse` component.
