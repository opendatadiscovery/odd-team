control_summary: |-
  0 of 8 cells PROBED. F-147 is graduated from F-001's PopularStrip
  inflation-loop closure facet — same backend chain, different mounting
  site (Search list instead of home-page Popular tile). The headline
  finding is the entire-row onClick that pumps view_count on routine
  search browsing — closing the F-001/F-003 inflation loop from the
  search side too.

  Status: ui-complete on the UI side. Backend chain inherits F-001's
  primary-source-resolved chain at every hop. The five drift facets are
  UI-tier observations: a11y gap + inflation-loop closure + inner-button
  double-navigate risk + route-coupling-to-Overview + back-nav-no-dedupe.

  Probe candidates: (P-shb147-1) **Search-row inflation pin** — Playwright
  + docker-compose: navigate to /search, type a query, click 5 result
  rows in sequence, assert each entity's view_count delta == +2. (P-shb147-2)
  **A11y pin** — axe-core or @testing-library/jest-dom assert role / aria
  / focus-visible on rendered S.Container. (P-shb147-3) **Inner-button
  double-navigate pin** — click the row's QuestionIcon tooltip target,
  assert NO navigate fires (just tooltip opens).
