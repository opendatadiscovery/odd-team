name: List Data Entity Alerts (per-entity alert history with soft-delete-inclusive existence)
canonical_in_docs: true
canonical_candidate: false
pillar_affinity:
  - P-07
  - P-01
description: |-
  **NEW OPERATION, batch 2026-05-19L** — primary-source confirmed at
  `DataEntityController.getDataEntityAlerts` (lines 315-321) +
  `AlertServiceImpl.getDataEntityAlerts` (lines 138-143) +
  `ReactiveAlertRepositoryImpl.getAlertsByDataEntityId` (lines 182-199).
  `GET /api/dataentities/{data_entity_id}/alerts?page={n}&size={m}` —
  return paginated `AlertList` for one data entity, ALL statuses (OPEN +
  RESOLVED + RESOLVED_AUTOMATICALLY), no owner-scope filter, soft-delete-inclusive
  existence-check on the data entity.

  **The two-DB-round-trip shape**:
    1. Existence-check via `dataEntityRepository.existsIncludingSoftDeleted(dataEntityId)`
       (`AlertServiceImpl.java:327-335` → `ReactiveDataEntityRepositoryImpl.java:150-155`)
       — `selectExists` over `DATA_ENTITY` with NO soft-delete filter
       (deliberately admits soft-deleted entities for the audit-export
       workaround use case). Emits `NotFoundException` if absent.
    2. `getAlertsByDataEntityId` → `SELECT ALERT.* FROM ALERT JOIN
       DATA_ENTITY ON DATA_ENTITY.ODDRN = ALERT.DATA_ENTITY_ODDRN WHERE
       DATA_ENTITY.ID = :id LIMIT :size OFFSET (:page-1)*:size` plus a
       COUNT(*) via `pageifyResult`. NO `OWNERSHIP` join; NO
       principal-derived predicate; NO status filter.

  Sequential `flatMap` chain (existence-check resolves first, then
  alerts list); not parallel.

  **Authorization**: NONE at any layer.
    - Controller: no `@PreAuthorize`, no `@Secured`, no programmatic
      `permissionService.hasPermission(...)`.
    - `SecurityConstants.SECURITY_RULES` (98-355 lines): NO entry for
      `GET /api/dataentities/{data_entity_id}/alerts`. The sibling
      mutation endpoint `PUT /api/dataentities/{data_entity_id}/alert_config`
      IS rule-gated (line 306 with `DATA_ENTITY_ALERT_CONFIG_UPDATE`)
      — the read endpoint is intentionally not.
    - Falls through to `pathMatchers('/**').authenticated()` at
      `AuthorizationCustomizer.java:29-30`.
    - The convention is platform-wide: every SECURITY_RULES entry is
      a MUTATION (POST/PUT/DELETE); GET endpoints are
      authenticated-only by class-wide convention.

  **Soft-delete-inclusive existence-check is INTENTIONAL** — the helper
  name `existsIncludingSoftDeleted` encodes the intent; the sibling
  helper `existsNonDeletedByDataSourceId` (line 158) DOES apply
  `addSoftDeleteFilter(...)`. The naming pair documents the convention.
  Operators passing soft-deleted entity IDs receive their pre-deletion
  alert history — useful for audit-export but un-documented in the live
  alerting page.

  **Pagination shape**: `PageParam` + `SizeParam` are `required: true`
  per `components.yaml:4213-4229` but carry NO `minimum:` / `maximum:`;
  the controller's `Integer page, Integer size` parameters are
  unannotated; the repository computes `OFFSET = (page - 1) * size`
  with no clamping. Pairs with the existing
  "pagination-parameters-declared-but-unconstrained" invariant.

  **Documentation drift** (live WebFetch 2026-05-19 status 200): the
  alerting page names this endpoint VERBATIM as the audit-export
  workaround for the housekeeping bug that hard-deletes
  manually-resolved alerts:

    > "The only operator-side workaround until the platform fix lands
    > is to **export the alert audit data before manually resolving**
    > — `GET /api/dataentities/{data_entity_id}/alerts` returns the
    > open and recently-resolved set including chunks and status
    > history."

  The page does NOT mention: (a) whether the endpoint scopes by owner
  (it doesn't), (b) the pagination shape (a complete export of a
  high-volume entity requires multiple paginated calls — operators
  following the doc literally silently truncate), (c) the
  soft-delete-inclusive existence (useful for audit), (d) the
  no-`@ActivityLog` on resolve operations (the workaround's
  motivation).

  **Audiences**:
    - ODD Platform UI — the per-entity `Alerts` tab on the data-entity
      detail page (UI surface backed by this endpoint)
    - Operators running the housekeeping audit-export workaround —
      live alerting page documents this use case
    - Third-party API consumers building compliance / audit-export
      integrations
    - Any authenticated user (LOGIN_FORM/OAUTH2/LDAP) enumerating
      data_entity_id values to read every alert ever raised — the
      cross-owner enumeration consequence
    - Anonymous callers under `auth.type=DISABLED`
