proposed_action: |-
  WebTestClient integration test, four sub-cases. (a) Sub-case (i) — no USER_OWNER_MAPPING row: authenticate user with no owner link; GET /my/upstream; assert HTTP 200 + body `[]`. (b) Sub-case (ii) — owner with zero owned entities: authenticate user linked to empty owner; GET /my/upstream; assert HTTP 200 + body `[]`. (c) Sub-case (iii) — owned entities but no upstream LINEAGE edges: pre-seed owned entities with no lineage; GET /my/upstream; assert HTTP 200 + body `[]`. (d) Sub-case (iv) — DISABLED mode anonymous: assert HTTP 200 + body `[]`. (e) Test comment 'LOCKS the silent-empty degradation as of 2026-05-19. When fail-fast handling is added — e.g. .switchIfEmpty(Mono.error(OwnerNotAssociatedException)) — sub-case (i) FLIPS to expect 401/403, sub-cases (ii)/(iii)/(iv) remain green.' This is contract-pinning + alternative-future-design documentation.
