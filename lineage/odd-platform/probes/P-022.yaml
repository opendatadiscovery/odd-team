expected_outcome: |
  STRESS PROTOCOL E1: Pin the partition-DROP-vs-concurrent-read lock-
  collision behaviour for the activity table housekeeping cycle.

  Static analysis (stress_findings.E1 in the emitting sidecar):
  - `ActivityEmptyPartitionsHousekeepingJob` (extends EmptyPartitionsHousekeepingJob)
    drops EMPTY past partitions of the activity table via
    PartitionServiceImpl.java:120-127 (`DROP TABLE <partition>`).
  - DROP TABLE takes ACCESS EXCLUSIVE on the child partition (PG lock-modes).
  - Concurrent SELECT on the parent activity table needs ACCESS SHARE on
    every routed child partition.
  - Concurrent INSERT needs ROW EXCLUSIVE.
  - ACCESS EXCLUSIVE conflicts with both → reads/writes touching the
    targeted partition BLOCK while the DROP holds the lock.
  - In STEADY STATE the housekeeping only drops EMPTY partitions, so
    there should be no traffic to BLOCK (the partition is by definition
    not being touched). BUT the SAFETY INVARIANT must hold: NON-EMPTY
    partitions must NEVER be dropped. This probe verifies the
    isPartitionEmpty check is honoured.

  HYPOTHESIS: ActivityEmptyPartitionsHousekeepingJob drops the EMPTY
  past partition but preserves the NON-EMPTY past partition (the
  only-empty contract). The row in the non-empty partition survives
  the housekeeping cycle.

  When the contract is ever broken (e.g. by a refactor introducing
  hard-retention DROPs), this probe surfaces the regression: the row
  is silently lost.
