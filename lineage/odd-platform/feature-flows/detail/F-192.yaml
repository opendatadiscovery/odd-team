feature_name: |-
  Per-Column Annotation Editor Composition — the right-rail editor surface
  at `/dataentities/{id}/structure/{versionId}` that ORCHESTRATES six
  per-column edit sub-flows (description / business-name / tags / enums /
  terms / lookup-table-column) against a SINGLE selected field driven by
  a jotai `selectedFieldIdAtom`. The OPERATOR-OBSERVABLE composition shell
  for the F-047 backend chain; one click on a row in DatasetStructureList
  switches all six sub-editors to operate on a different field id.
