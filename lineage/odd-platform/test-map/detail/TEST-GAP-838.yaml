proposed_action: |-
  **Phase 1 — Vitest UI tests** (3 unit tests + 1 integration spec):

  1. `submitQuery_containingTsqueryMetacharacters_currentlyDispatchesUnescaped_pinsREFACTOR229Bypass` — render `<Search />` + mocked Redux. Submit `foo ) | (bar` via the MainSearchInput. Assert dispatch fires with the literal unescaped string. PINS the current UI-side bypass. **After REFACTOR-229's UI-side fix lands, this test UPDATES to assert the input is rejected at the field level with a validation message.**

  2. `submitQuery_containingTsqueryMetacharacters_currentlyDoesNotSurfaceErrorToUser_pinsSilentFailure` — mock the backend to return 500 on the dispatch, render Search, submit poisoned query, assert NO error toast/notification is rendered. PINS the silent-failure UX gap.

  3. `submitQuery_validQuery_dispatchesNormally_pinsHappyPath` — submit `customer pii dataset`, assert dispatch fires with the literal text + 200 response succeeds. PINS the happy-path doesn't regress with the validation fix.

  **Phase 2 — Playwright CI-permanent regression-pin**:
  - `openSearchAndSubmitPoisonedQuery_sessionUUIDIs500dOnFacetReads_pinsBackendBypass_playwrightCIPermanent` — boot test-platform, navigate to `/search`, submit `foo ) | (bar`, capture the session UUID from the URL, then call `GET /api/search/{uuid}/facet/owners` → assert backend returns 500 with `42601 syntax error in tsquery`. PINS the cross-tier bypass (UI submits → backend 500s → session permanently broken).

  **Architectural fix dependency**: The REFACTOR-229 fix in `JooqFTSHelper.tsQuery` is the LOAD-BEARING fix. The UI-side defense-in-depth (input validation at MainSearchInput.tsx:42-48) is the natural complement. Both should ship together; the test pins both.

  Coherence note (LSN-018 Rule 6): NO contradiction with existing artefacts. STRENGTHENS the REFACTOR-229 chain across THREE invocation sites (batch H getHighlightedResult + batch M facet aggregators + batch ZA UI-side). All three sites share the same architectural fix point. The 3-site evidence is now anchored to the same REFACTOR; the next test-pillar work cycle should treat them as ONE backlog item.
