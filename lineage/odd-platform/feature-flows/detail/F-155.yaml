observed_vs_expected:
  facets:
    - facet_id: react_key_on_qe_definition_text_potential_collision
      drift_class: ui_react_key_on_free_text_field_not_id
      severity: LOW
      observed: |-
        TermQueryExamples.tsx:48-55 — the queryExamples map uses
        `key={qe.definition}` for the React key (line 51). Query Example
        definition is free-text SQL/Spark/KQL — two query examples with
        identical SQL text (a legitimate use case for SaaS multi-tenant
        examples or commonly-pasted snippets) collide. React renders
        only the first match, silently dropping the duplicate. The
        usual pattern is `key={qe.id}` — verified by the sibling
        `EntityClassItem.key={entityClass.id}` shape across the codebase.
      expected: |-
        `key={qe.id}` — every Query Example has a stable backend id.
      evidence:
        - 'TermQueryExamples.tsx:48-55 (key={qe.definition})'
      ui_unverified: false
    - facet_id: no_error_handler_on_assign_query_example_mutation_silent_failure
      drift_class: ui_mutation_lacks_catch_silent_failure
      severity: LOW
      observed: |-
        AssignTermQueryExampleForm.tsx:32-41 —
        `mutateAsync({...}).then(_ => {reset();})`. NO `.catch(err)`
        handler. On backend reject (4xx/5xx) the form silently fails
        to clear, the dialog stays open, the user has no signal. Same
        class as F-154 facet
        `no_error_handler_on_dispatch_chain_silent_failure_on_backend_reject`
        — pattern across Terms forms.
      expected: |-
        `.catch((err) => setError(...))` + render error in the dialog.
      evidence:
        - 'AssignTermQueryExampleForm.tsx:32-41 (no catch)'
      ui_unverified: false
    - facet_id: query_examples_link_query_button_visible_in_dom_inspection
      drift_class: ui_permission_gated_cta_visibility_leaks_permission_state
      severity: LOW
      observed: |-
        The "Link query" CTA at TermQueryExamples.tsx:36-43 is gated by
        `<WithPermissions permissionTo={Permission.QUERY_EXAMPLE_TERM_CREATE}>`
        — UI-only hide. Platform-wide pattern (cross-link F-024 batch U
        facet `term_create_cta_dom_inspection_leaks_permission`).
        Operators inspecting the DOM can infer QUERY_EXAMPLE_TERM_CREATE
        membership. Aligned with platform stance; recorded for
        completeness.
      expected: |-
        Aligned; no fix required. Document the UI-only-hide convention
        platform-wide.
      evidence:
        - 'TermQueryExamples.tsx:33-44 (WithPermissions gate)'
      ui_unverified: false
    - facet_id: cross_pillar_p_02_p_06_shared_component_query_examples_list_item
      drift_class: cross_pillar_component_sharing_unverified_pattern_drift
      severity: LOW
      observed: |-
        TermQueryExamples renders `QueryExamplesListItem` with
        `isTerm={true}` + `entityId={termId}` props (lines 49-54). The
        QueryExamplesListItem component is the P-02 Data Modelling
        shared list-item; the `isTerm` flag toggles between data-entity
        context and term context. The shared-component-with-context-flag
        pattern works but is fragile to future renames — if P-02 ever
        renames the prop, the Terms surface silently breaks. Component
        belongs to P-02 sidecar enrichment; flagged for cross-pillar
        coverage.
      expected: |-
        Either type the context as a union discriminator (`context:
        {kind: 'term', termId} | {kind: 'entity', entityId}`) OR document
        the dual-mode contract on QueryExamplesListItem.
      evidence:
        - 'TermQueryExamples.tsx:48-55 (isTerm + entityId props)'
      ui_unverified: true
      ui_unverified_reason: |-
        QueryExamplesListItem implementation not read in this slice
        (cross-pillar P-02 territory).
