      "something went wrong" message and no retry button. They cannot tell whether the
      glossary is empty, broken, or unauthenticated — a silent-failure (LSN-024-class)
      surface on a primary navigation tab. This is the create/restore-session
      orchestrator's unhandled rejection — a DIFFERENT code locus from the TermsForm
      authoring-dialog unhandled rejection already tracked as PLT-059 Defect 4
