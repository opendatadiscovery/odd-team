behaviour: |-
  **HIGH — `createDataSource` (POST /ingestion/datasources) throws `IllegalStateException("Collector id is null")` (IngestionController.java:54) when the WebSession attribute is missing. The exception propagates as HTTP 500 (NOT 401) via the default reactive error handler. The operator-visible diagnostic is "looks like a server crash" — but the actual cause is "missing prior auth step" — and the failure mode is untested.**

  Verified at primary source: `IngestionController.java:47-73` — `createDataSource` reads `SessionConstants.COLLECTOR_ID_SESSION_KEY` from the WebSession (lines 50-58); on absence, throws `IllegalStateException`. The default reactive error handler returns HTTP 500 with a generic error body — no auth-specific 401 framing.

  **The probe-shape for the bug**:
  ```
  POST /ingestion/datasources HTTP/1.1
  Host: odd.example.com
  Content-Type: application/json
  // INTENTIONALLY no Authorization: Bearer header

  {"items": [{...}]}
  ```
  Expected response (per HTTP semantics): 401 Unauthorized with `WWW-Authenticate: Bearer` header.
  Actual response: 500 Internal Server Error with body `{"error": "Internal Server Error"}` and stack-trace `IllegalStateException: Collector id is null` (in logs).

  **Why HIGH (not MEDIUM)**:
  - 500 vs 401 is a security finding class: a probing attacker probing the auth surface gets a different error than expected, which gates downstream tooling decisions (does the platform exist? is the bearer wrong? is the format wrong?). 500 hides the auth signal.
  - Operator-confusing failure mode: an operator first deploying a collector that hasn't been issued a token sees 500 — the natural diagnostic step is to check application logs (not to check Authorization headers).
  - The other 4 methods have NO equivalent fail-loud check — the failure shape is asymmetric.
  - LSN-001-class (silent default insecure behaviour): the diagnostic muddle is itself a class.

  **Distinguishes**:
  - TEST-GAP-583 (existing) — `NotFoundException → 5xx (NOT 401)` info-leak in IngestionDataEntitiesFilter; same class but different surface (filter vs controller).
  - TEST-GAP-958 / 969 (this batch) — broader concerns.
