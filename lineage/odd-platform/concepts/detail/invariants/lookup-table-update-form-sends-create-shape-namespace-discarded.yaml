evidence:
  - |-
    LookupTables.md:bugs_limitations_corner_cases.[2] —
    'Edit-form DTO drift: LookupTableForm.tsx:49 types form data
    as LookupTableFormData (the CREATE shape with required
    namespaceName). On edit (line 60-66), it submits the SAME
    shape to editLookupTable({lookupTableUpdateFormData: data,
    ...}), but the OpenAPI contract for UPDATE
    (LookupTableUpdateFormData, components.yaml:3853-3862)
    defines ONLY name + description.' Severity HIGH.
  - |-
    LookupTables.md:docs_link_semantic.doc_drift_findings.[0] —
    'Doc page says "Renaming a lookup table or editing its
    description" under LOOKUP_TABLE_UPDATE, implying the
    namespace is NOT updateable — and the OpenAPI schema
    confirms this. The UI form disables the namespace field on
    edit (disabled={!!lookupTable}) AND sends it anyway in the
    request body via lookupTableUpdateFormData: data — drift
    between UX intent and wire reality.' Severity MEDIUM (doc).
  - |-
    LookupTables.md:tests_coverage_semantic.uncovered_behaviours —
    'Editing an existing lookup table sends namespace_name in
    the request body even though LookupTableUpdateFormData
    schema rejects it.' test_class: integration; criticality:
    HIGH. Probe P-191.
  - |-
    LookupTables.md:stress_findings.request_inputs.lookupTableUpdateFormData —
    'TRANSLATES_SILENTLY — the parameter NAME says
    lookupTableUpdateFormData implying the UPDATE schema, but
    the SHAPE on the wire is the CREATE schema (namespace_name
    included). Spring default JSON binding (Jackson
    FAIL_ON_UNKNOWN_PROPERTIES = false) silently discards.'
