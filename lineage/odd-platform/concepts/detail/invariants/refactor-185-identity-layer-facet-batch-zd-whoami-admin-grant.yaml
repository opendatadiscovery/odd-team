name: |-
  REFACTOR-185 IDENTITY-LAYER FACET — under DISABLED, /api/identity/whoami returns admin-with-all-permissions to anonymous callers (batch ZD)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
- P-09
description: |-
  **NEW INVARIANT, batch 2026-05-25-ZD** — the IDENTITY-LAYER FACET of
  REFACTOR-185. Distinct from the existing 27-sidecar pattern (which
  covers API-mutation-surface and UI-mutation-button-hiding under
  DISABLED), this facet captures the identity-exposure surface — the
  one endpoint that tells the caller WHO THEY ARE and what they can do.

  ## The mechanism

  Under `auth.type=DISABLED`, `DisabledAuthSecurityConfiguration.java:11-19`
  wires NO `ServerSecurityContextRepository`; the SecurityContext is
  empty for every request. `IdentityController.whoami` (lines 24-28)
  delegates to `IdentityServiceImpl.whoami()` which chains
  `authIdentityProvider.getCurrentUser().flatMap(getAssociatedOwner)`
  (IdentityServiceImpl.java:30-52). The empty SecurityContext makes
  `getCurrentUser` emit empty; the outer Mono short-circuits; the
  controller fires:

      .switchIfEmpty(Mono.just(new ResponseEntity<>(
          dummyOwner(), HttpStatus.OK)))

  `dummyOwner()` (IdentityController.java:30-33) constructs an
  `AssociatedOwner` with `identity.username = "admin"` (literal,
  lowercase, line 32) AND `identity.permissions =
  Arrays.asList(Permission.values())` — i.e. ALL 70+ Permission enum
  values defined at `components.yaml:158-235`.

  ## The blast radius

  An anonymous network caller hitting `GET /api/identity/whoami`
  under default deployment receives 200 OK claiming they are the
  "admin" user with every permission. The UI's
  `WithPermissionsProvider` (PermissionProvider.tsx:17-32) consumes
  this response and unlocks EVERY Permission-gated UI control across
  the SPA. The dummy permissions list is `Permission.values()` —
  dynamically expanded as the enum grows. ANY new Permission added
  to `components.yaml` automatically enters the under-DISABLED admin
  grant without code review of IdentityController.

  ## Distinct from the master REFACTOR-185 facets

  The existing 27-sidecar pattern covers:
    (1) DISABLED facet — `.anyExchange().permitAll()` on
        mutation endpoints; UI surface
    (2) LOGIN_FORM facet — `.authenticated() + getAuthorities(true)`;
        every authenticated user is ADMIN
    (3) AUTH-MODE-ORTHOGONAL facet — `/ingestion/**` WHITELIST_PATHS
        + exact-POST-only filter matcher

  This IDENTITY-LAYER facet is a FOURTH structurally-distinct
  mechanism. Where (1) makes mutation endpoints reachable, the
  IDENTITY-LAYER facet ANSWERS to the caller's identity question
  with a positive admin-grant CLAIM. The caller doesn't have to
  guess that they have admin permissions — the platform's
  authoritative identity surface tells them so.

  An anonymous attacker probing /api/identity/whoami learns FOUR
  things in one request:
    (a) The platform's auth mode (200 vs 302 vs 401)
    (b) Under DISABLED, that they "are" the admin user
    (c) The full set of Permissions the platform defines (the
        attack surface, leaked at API enumeration cost zero)
    (d) The username collision space (literal "admin" lowercase
        may collide with a real LOGIN_FORM/LDAP "admin" user)

  ## Defence-in-depth absence

  The invariant 'switchIfEmpty fallback is UNREACHABLE under
  LOGIN_FORM / OAUTH2 / LDAP' is the load-bearing security
  boundary. NO test asserts the invariant. NO regression guard
  exists. If a future SecurityConfiguration change broke
  SecurityContext propagation under any of the three authenticated
  modes, EVERY user would silently downgrade to receiving
  dummyOwner admin-with-all-permissions — with NO 401/403
  surfacing the failure. Under LOGIN_FORM, the regression is
  doubly invisible because LoginFormSecurityConfiguration ALREADY
  hard-codes every user as ADMIN with every authority; the dummy
  is also admin; the response shape is identical.

  ## Observability absence

  - No `@PreAuthorize` on the controller (line 23; no annotation)
  - No `Cache-Control: no-store` header on the identity-bearing
    response (line 26 uses bare `ResponseEntity::ok`)
  - `@Slf4j` is DECLARED at line 19 but the body emits ZERO log
    statements. Under DISABLED + default deployment, every
    anonymous probe of the identity-exposure surface is invisible
    in application logs.
  - The `ServerWebExchange exchange` parameter is RECEIVED at line
    24 but UNUSED — `exchange.getRequest().getRemoteAddress()` /
    `getHeaders()` / `getCookies()` are all available for audit
    instrumentation; the body discards them.

  ## Documentation drift

  The live `authentication` / `authentication/disabled-authentication`
  / `authorization` doc pages (WebFetched 2026-05-25, status 200,
  all three) are SILENT on:
    - The whoami endpoint's existence
    - The under-DISABLED admin-fallback identity claim
    - The UI's permission-gate model collapse under DISABLED
    - The fact that an anonymous caller can probe a documented
      endpoint to determine auth mode + receive an admin identity

  The disabled-authentication page's warning 'DO NOT use this
  method in your production environment!' is the only generic
  indicator; the specific identity-surface consequence is absent.

  ## Severity

  HIGH — the IDENTITY-LAYER FACET combines with the existing 27
  facets to produce the WORST-CASE attack chain: anonymous caller
  confirms DISABLED + receives admin identity + walks the API
  surface as admin + walks the SPA as admin (every UI control
  unlocked by the all-permissions claim). The blast radius
  compounds; the existing facets are the channels; this facet is
  the AUTHORITATIVE SAY-SO that makes the channels usable.
