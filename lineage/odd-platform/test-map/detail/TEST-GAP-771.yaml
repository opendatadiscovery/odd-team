behaviour: |-
  **MEDIUM — `GET /api/datasets/{id}/structure/diff` with `first_version_id == second_version_id` returns HTTP 400 with the canonical message "Couldn't show diff for identical versions". The guard exists at the service tier; the error message is a user-facing contract.** Primary-source confirmed in batch-W DatasetController sidecar:

  - `DatasetVersionServiceImpl.getDatasetVersionDiff` lines 59-61:
    ```
    if (firstVersionId == secondVersionId) {
        return Mono.error(new BadUserRequestException("Couldn't show diff for identical versions"));
    }
    ```
  - The exception is mapped to HTTP 400 via `ControllerAdvice.java:24-28`.

  **Behaviour to pin** (the test gap):
  - Same version_id passed twice → HTTP 400 with body containing the canonical message.
  - The literal English string IS the user-facing contract; any UI client may surface this message verbatim to operators.

  **Why MEDIUM not LOW**:
  - The guard implements an explicit user-error class (operator submits an identical-versions diff request — typically by clicking the same version twice in the UI's version-picker).
  - The error message is a user-facing contract string; a refactor changing the message would alter the UI surface.
  - The test ensures the contract is pinned against accidental drift.

  **Test gap shape**: regression-pin asserting: (a) `GET /api/datasets/{id}/structure/diff?first_version_id=42&second_version_id=42` returns HTTP 400; (b) the response body contains the literal string "Couldn't show diff for identical versions"; (c) the response does NOT reach the SQL layer (the guard fires before the repository call). The current state is PINNED — failures land if a future maintainer changes the message string OR removes the guard.
