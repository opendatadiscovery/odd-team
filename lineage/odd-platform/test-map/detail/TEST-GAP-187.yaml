proposed_action: Add a regression test asserting `new OAuth2Provider().setClientSecret("secret-xyz").toString().contains("secret-xyz")
  == false`. The test fails today; the maintainer adds `@ToString.Exclude` on the
  field to make it pass. Same pattern reusable for ODDLDAPProperties (TEST-GAP-195)
  and EmailSenderProperties.
