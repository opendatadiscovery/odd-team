mitigations_unimplemented:
  - |-
    Component-A fix — require an explicit auth.direct_owner_sync.allow_self_create
    config flag (default false) before the DIRECT_OWNER_SYNC auto-approve
    branch fires for a request whose ownerName resolves to a NEWLY-CREATED
    Owner (vs an existing Owner). The auto-approve for binding to an
    EXISTING Owner remains permitted; only the mint-new-then-bind chain
    requires the explicit opt-in.
  - |-
    Component-B fix — add an explicit OWNER_CREATE permission check at
    OwnerAssociationRequestServiceImpl.java:57. The getOrCreate call should
    fail-fast if the Owner is novel AND the caller does not hold OWNER_CREATE.
    Same fix applies to every getOrCreate call-site project-wide (TagService,
    NamespaceService, TermService, TitleService).
  - |-
    Composition fix — at the createOwnerAssociationRequest entry-point, add
    an explicit branch:
      if (ownerService.exists(ownerName)) then proceed normally
      else if (caller has OWNER_CREATE) then proceed via getOrCreate
      else throw 403 'Cannot self-request association with a non-existent
        Owner without OWNER_CREATE permission'
    Eliminates the composition by forcing the caller to either bind to an
    existing Owner OR explicitly hold OWNER_CREATE.
  - |-
    Audit-trail enhancement — when DIRECT_OWNER_SYNC fires AND a new Owner
    was created in the same transaction, emit BOTH a REQUEST_MANUALLY_APPROVED
    event AND a (new) OWNER_AUTO_CREATED event. The new event documents
    the side-door in the audit trail. Pair with operator-facing docs
    explaining the chain.
  - |-
    Live docs — disclose DIRECT_OWNER_SYNC + the MANUAL flow + the side-door
    on the live user-owner-association page. Four DOC-NNN candidates flow
    from this finding alone:
      (a) Document DIRECT_OWNER_SYNC and its escalation behaviour
      (b) Document the MANUAL flow (POST /api/owners/mapping)
      (c) Document the getOrCreate side-door for Owner creation
      (d) Document the composition + the recommended mitigation
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20V from the
  OwnerAssociationRequestController class-level sidecar. The finding composes
  two previously-known MEDIUM-severity observations into a HIGH-severity
  privilege-escalation chain visible only at the call-site composition.

  Cross-cutting connections:
    - Component A: implicit_adrs in this controller's sidecar
    - Component B: canonicalisation candidate permission-bypass-via-owner-auto-create-side-door-write-path
    - Project-wide pattern: every getOrCreate (TagService, NamespaceService,
      TermService, TitleService) is a Component-B candidate; the audit
      reaches one fix-point if a uniform OWNER_CREATE-class check is
      applied to all getOrCreate call-sites
    - Doc-drift: the live user-owner-association page does not name either
      component (separate batch-V finding in the sidecar's coherence_notes)
    - Tier 3 audit (this batch's other finding) — the chain IS audited
      via REQUEST_MANUALLY_APPROVED but the audit trail does NOT name the
      Owner-creation as a separate event
    - F-019 owner-lifecycle-management: REFACTOR-427 orphan rows on Owner
      delete pair with this finding — the side-door creates Owners; the
      cascade-block omits the request rows; together they form the
      complete data-integrity story for the Owner directory

  Five DOC-NNN candidates flow:
    (a) Code fix — Component-A config flag + Component-B permission check
    (b) Code fix — composition fail-fast branch at createOwnerAssociationRequest
    (c) Audit enhancement — new event type for Owner auto-create
    (d) Live docs — disclose all four user-observable surfaces (SELF,
        DIRECT_OWNER_SYNC, MANUAL, getOrCreate side-door)
    (e) Default Policy audit — identify which shipped Policies grant
        DIRECT_OWNER_SYNC; document the composition risk for operators
