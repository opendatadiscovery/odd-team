name: |-
  Tag TOCTOU race — listByNames then bulkCreate auto-create-on-miss (STRENGTHENED
  batch R — MetadataField sibling primary source; STRENGTHENED batch VAL-LSN-019
  — TagServiceImpl primary source for service-tier read-then-write pattern)
canonical_in_docs: false
