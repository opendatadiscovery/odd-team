  - "odd-platform ts components/Management/DataSourcesList/DataSourceItem/DataSourceItemToken/DataSourceItemToken.tsx react-component:DataSourceItemToken"
  - "odd-platform ts components/Management/CollectorsList/CollectorItem/CollectorItemToken/CollectorItemToken.tsx react-component:CollectorItemToken"
