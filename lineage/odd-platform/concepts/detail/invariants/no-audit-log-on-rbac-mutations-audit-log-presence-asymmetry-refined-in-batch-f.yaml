name: No-audit-log on RBAC mutations (audit-log presence asymmetry — REFINED in batch
  F + further confirmed batch H + batch L extension + batch N Role-repo PRIMARY SOURCE
  + batch P deleteOwner FIFTH RBAC-primary-surface sidecar + batch Q UI-tier 7th
  corroborating sidecar pattern + batch R SCHEMA-ROOTED root cause + DatasetField
  Tier-1c sibling)
canonical_in_docs: false
canonical_candidate: true
description: |-
  **REFINED INVARIANT, batch 2026-05-12F** (originally surfaced in batch
  E as 'codebase-wide hygiene gap' — REFINEMENT: the gap is NOT codebase-wide; the
  platform has a 2-tier audit story). **Tier 2 (RBAC mutations) — UNAUDITED**: no
  Role / Policy / Owner mutation emits an audit signal. 3-sidecar primary source from
  batch E: (a) `RoleServiceImpl.create/.update/.delete` (lines 39-92) emit NO `@Slf4j`
  log calls, publish NO events, and INSERT into NO audit table; (b) `PolicyServiceImpl.create/.update/.delete`
  (lines 62-95) have the same absence; (c) `OwnerServiceImpl.create` is missing `@ActivityLog`
  annotation. The platform's activity feed (`/api/activity` per batch A getActivity)
  covers DataEntity-side activity but does NOT extend to Role / Policy / Permission
  / Owner-directory mutations. **Tier 1 (DataEntity mutations) — AUDITED (REFINED
  in batch F)**: batch F's primary-source updateStatus + createOwnership sidecars
  CONFIRM that DataEntity mutations DO emit audit signals: (i) `DataEntityInternalStateServiceImpl.changeStatusForDataEntities`
  (lines 73-98) PROGRAMMATICALLY constructs and emits `DATA_ENTITY_STATUS_UPDATED`
  activity events with `oldState`/`newState` JSON payloads (not via AOP `@ActivityLog`
  because the mutation is bulk and oldState must be captured per-pojo before the in-place
  mutation — explicit per implicit_adrs.[4]); (ii) `OwnershipServiceImpl.create` is
  annotated `@ActivityLog(event = OWNERSHIP_CREATED)` and `OwnershipCreatedActivityHandler`
  captures BEFORE/AFTER ownership state for the data-entity. **The 2-tier audit asymmetry**:
  DataEntity-scoped writes (status / ownership / description / business-name / tags
  / terms / metadata / alert-config / DataEntityGroup membership) are TIER-1 AUDITED
  — these are the data-content changes operators expect to see in the activity feed.
  RBAC-scoped writes (Policy / Role / Owner-directory) are TIER-2 UNAUDITED — these
  are the authorization-model changes that should be MORE audited, not less. The asymmetry
  is the INVERSE of what a security-conscious operator would expect. **Consequence**:
  a hijacked admin account or any S2S API-key holder (which gets ADMIN by default
  per S2sAuthenticationFilter — REFACTOR-108) can rewrite the authorization model,
  create new high-privilege Roles, attach them to existing Owners through other endpoints,
  or replace Policy bindings — and leave no trail in the platform's logs. Highest-leverage
  audit gap in the RBAC surface. **Batch H — SQL PRIMARY-SOURCE CONFIRMATION at the
  persistence layer**: ReactivePolicyRepositoryImpl batch-H sidecar confirms the persistence-layer
  silence on the RBAC mutation path. ZERO log lines on any of {create, update, delete}.
  ExceptionUtils.translateDatabaseException emits one `log.error` ONLY on non-uniqueness
  DB errors (ExceptionUtils.java:34). The repository carries no `@Slf4j` import beyond
  the inherited base class. The 3-sidecar batch-E pattern is now 4-sidecar (3 service-layer
  + 1 repository-layer) at the SQL primary source. By contrast, batch H's ReactiveAlertRepositoryImpl
  + ReactiveDataEntityRepositoryImpl sidecars confirm that DataEntity-side and Alert-side
  activity emission lives at the SERVICE layer (by composition, not by inheritance);
  the repositories emit nothing but the service layer takes care of activity events
  via @ActivityLog AOP and programmatic ActivityCreateEvent construction. The 2-tier
  asymmetry is uniform across HTTP / service / persistence layers.

  **BATCH L EXTENSION — TIER-1 EXCEPTIONS DISCOVERED**: the
  refinement-claim that Tier-1 (DataEntity-scoped writes) is uniformly
  audited is contradicted at three specific sub-surfaces uncovered by
  batch L primary sources. These TIER-1 EXCEPTIONS are entity-side
  writes that ALSO lack audit:

    - **DEG membership writes** (addDataEntityToDEG +
      deleteDataEntityFromDEG; `DataEntityServiceImpl.java:387-438`) carry
      NO `@ActivityLog` despite the `DATA_ENTITY_RELATION_UPDATED` enum
      value existing at `ActivityEventTypeDto.java:12` (reserved but
      never fired). An operator auditing "who placed entity X into the
      Finance Domain on date Z" via `ActivityController.getActivity`
      sees NOTHING. Pairs with the
      write-collaborative-DEG-no-deg-side-authorization invariant.

    - **Custom-metadata writes** (upsertMetadataFieldValue + create/delete;
      `DataEntityServiceImpl.java:287-305, 245-283, 307-326`) carry NO
      `@ActivityLog` despite the `CUSTOM_METADATA_CREATED / UPDATED /
      DELETED` enum values existing at `ActivityEventTypeDto.java:17-19`
      (all three reserved but never fired). Pairs with the
      external-metadata-overwrite-silent-no-origin-check invariant —
      the no-audit gap compounds the no-origin-check gap: EXTERNAL
      values can be silently overwritten with no audit record of who
      did it or when.

    - **Term-unlink no-op DELETE emits an activity event with BEFORE=AFTER
      state** — the existing observation from `deleteTermFromDataEntity`
      (`TermAssignmentActivityHandler` re-queries state regardless of
      whether the row was deleted) is a DIFFERENT-shaped audit defect:
      activity events ARE emitted, but they cannot distinguish real
      removals from no-op DELETEs. Audit-trail-NOISE rather than
      audit-trail-ABSENCE.

  **BATCH N EXTENSION — ROLE-REPO SQL PRIMARY SOURCE CONFIRMS THE PATTERN
  IS SYMMETRIC ACROSS THE RBAC MUTATION SURFACE**: ReactiveRoleRepositoryImpl
  batch-N sidecar confirms the persistence-layer silence on Role
  mutations — the 94-line repository class emits ZERO security-relevant
  log lines on any of {create, update, delete}. Symmetric to Policy-repo
  batch H. The downstream_side_effects.[8] note explicitly states:
  "the cross-batch concept catalog entry
  `no-audit-log-on-rbac-mutations-audit-log-presence-asymmetry-refined-in-batch-f`
  is REFINED by this batch with a SECOND repository confirmation
  (Role symmetric to Policy)."

  The 4-sidecar pattern (batch E + H + L + N) is now 5-sidecar at the
  RBAC primary surface:
    - createRole (batch E controller) — RoleServiceImpl no audit
    - createPolicy (batch E controller) — PolicyServiceImpl no audit
    - createOwner (batch E controller) — OwnerServiceImpl.create no
      @ActivityLog
    - ReactivePolicyRepositoryImpl (batch H repository) — persistence
      layer no log
    - **ReactiveRoleRepositoryImpl (batch N repository) — persistence
      layer no log; SYMMETRIC MIRROR**

  **The pair (Role-repo + Policy-repo)** now anchors the persistence-layer
  silence at BOTH halves of the RBAC mutation surface. ANY future
  service-bypass path that invokes the repository directly (test code
  today; hypothetical future direct-injection) would similarly leave
  no trail. The cross-batch concept is now end-to-end:
  HTTP (controller) → service → SQL (repository) — all three layers
  are forensically dark on RBAC mutations.

  The Tier-1 partial-audit story (batch L) is now: **Tier 1a (audited)**
  — status, ownership, description, business-name, tags, term-link,
  alert-status changes; **Tier 1b (unaudited despite reserved enum
  values)** — DEG membership writes, custom-metadata writes; **Tier 1c
  (audit-noisy)** — term-unlink (events fire on no-op). The original
  "DataEntity mutations are AUDITED" claim is partly false; a future
  refinement should rename this invariant from a 2-tier story to a
  4-tier story (1a / 1b / 1c / 2).

  **NEW BATCH N additional Tag + Term + UserOwnerMapping persistence-layer
  audit absence observations**:
    - **ReactiveTagRepositoryImpl** (batch N): repository emits NO
      audit log on writes — ingestData / bulkCreate / delete / every
      create/delete*Relations method writes to a relation or directory
      table with NO repository-side activity event. The
      TAG_ASSIGNMENT_UPDATED activity event is emitted by the UPSTREAM
      service layer (DataEntityServiceImpl.upsertTags with
      @ActivityLog). The ingestion-side path
      (ExternalTagIngestionRequestProcessor) writes via this repository
      DIRECTLY and produces NO activity-feed entry. Tier-1c equivalent
      (the ingestion-side path is silent; the UI side is audited).
    - **ReactiveTermRepositoryImpl** (batch N): the repository emits
      ZERO security-relevant log lines on Term reads or mutations.
      Activity-feed emission is the SERVICE LAYER's responsibility
      (TermServiceImpl) via @ActivityLog AOP; the repository tier is
      silent. Same Tier-1 pattern.
    - **ReactiveUserOwnerMappingRepositoryImpl** (batch N): INSERT and
      both UPDATE statements (lines 44-46, 56-62, 65-74) emit NO audit
      log; NO trigger, NO activity-feed entry. The write is invisible
      to the global Activity feed — per the audit-log-presence-asymmetry
      pattern. User-owner binding changes are a TIER-2-EQUIVALENT
      RBAC-adjacent mutation: even though they're not strictly
      Policy/Role/Owner-directory mutations, they bind a user to an
      Owner identity (changing the user's effective Owner-scoped read
      set + RBAC role bundle). The TIER-2 audit-silence applies
      end-to-end.

  **BATCH P EXTENSION — DELETEOWNER FIFTH RBAC-primary-surface
  CORROBORATING SIDECAR (5-sidecar at controller-tier + 2-sidecar at
  repository-tier = 7 sidecars in pattern, end-to-end)**: the
  deleteOwner sidecar (batch P, session-2026-05-20-P) confirms that
  `OwnerServiceImpl.delete` (lines 87-100) carries NO `@ActivityLog`
  annotation. `grep '@ActivityLog' OwnerServiceImpl.java` returns
  zero matches across the entire class (create + update + delete all
  unaudited). Combined with the role-binding HARD-delete
  (irreversible) and the soft-delete-on-owner-row (name freed for
  re-creation), the audit story is silent — an operator can delete
  an owner and re-create another owner with the same name, with NO
  trace anywhere except (a) the DB row's `deleted_at` timestamp (no
  operator-readable surface) and (b) the absence of OWNER_TO_ROLE
  rows (no historical record). The 5-sidecar pattern at the
  RBAC-primary surface is now:
    - createRole (batch E controller) — RoleServiceImpl no audit
    - createPolicy (batch E controller) — PolicyServiceImpl no audit
    - createOwner (batch E controller) — OwnerServiceImpl.create no
      @ActivityLog
    - **deleteOwner (batch P controller) — OwnerServiceImpl.delete
      no @ActivityLog; the FIFTH corroborating sidecar; the FIRST
      destructive verb in the pattern; HIGH severity because the
      operation hard-deletes OWNER_TO_ROLE rows (irreversible) and
      soft-deletes the owner row (silently re-namespace-able)**
    - updateOwner (batch P controller) — OwnerServiceImpl.update no
      @ActivityLog (sibling write on the same controller; 6th
      corroborating sidecar)

  And the repository-tier pair (Role-repo batch N + Policy-repo
  batch H) remains the 2-sidecar SYMMETRIC SQL-layer confirmation.

  The deleteOwner-side severity is HIGHEST in the pattern: the role
  bindings are HARD-DELETED (irreversible), the owner row is
  soft-deleted (name re-usable), and the operation is invisible to
  audit. A privileged caller (or any S2S API-key holder per
  REFACTOR-108) who deletes Owners leaves NO trail; the operation
  is the WORST-CASE composition of the no-audit-log gap with the
  role-binding hard-delete pattern.

  **BATCH Q EXTENSION — UI-TIER 7TH CORROBORATING SIDECAR PATTERN
  (now end-to-end across UI → HTTP → service → SQL)**: the 5 batch-Q
  UI sidecars (AppToolbar + PolicyList + RolesList + OwnersList +
  CollectorsList) ALL confirm the audit-silence pattern at the UI
  layer:
    - **AppToolbar** (ui_shell): no audit affordance for logout
      events; no SPA-side audit-history panel
    - **PolicyList** (Management → Policies): no audit affordance for
      create/update/delete; toast vanishes within ~5 seconds; no
      console.log on dispatch
    - **RolesList** (Management → Roles): same — no audit affordance,
      vanishing toast, no SPA-side log
    - **OwnersList** (Management → Owners): same; no "recent changes"
      panel, no operator's-own-mutation history
    - **CollectorsList** (Management → Collectors): same; no audit
      affordance for token regeneration despite the destructive
      semantic (in-place UPDATE invalidates ingestion immediately)

  The forensic darkness extends to the **UI tier** — no console.log,
  no analytics event (Grep across odd-platform-ui/src for
  `mixpanel|amplitude|segment|gtag|posthog|track\(` returns ZERO
  matches per the RolesList sidecar's implicit_adrs[3]), no
  audit-mode toast, no persistent audit panel. The 5 UI sidecars
  share the convention "the toast + the Redux action log are the
  operator's only feedback" — and the toast vanishes within seconds
  and the Redux action log is dev-tools-only.

  **The 7-sidecar pattern is now end-to-end across all four tiers**:
    - UI tier (batch Q — 5 sidecars: AppToolbar + 4 Management list
      components)
    - HTTP / controller tier (batch E + P — 5 sidecars: createRole,
      createPolicy, createOwner, updateOwner, deleteOwner)
    - Service tier (implicit in the controller sidecars; service-layer
      pattern confirmed at RoleServiceImpl + PolicyServiceImpl +
      OwnerServiceImpl)
    - SQL tier (batch H + N — 2 sidecars: ReactivePolicyRepositoryImpl
      + ReactiveRoleRepositoryImpl)

  An operator interacting with the UI cannot SEE audit events
  (because none are emitted at the UI tier — no analytics, no
  persistent panel, no audit-mode toast). An operator interacting
  with the API cannot RETRIEVE audit events (because none are
  emitted at the HTTP/service/SQL tiers). The platform's RBAC
  mutation surface is forensically dark at every layer the operator
  can reach.

  **BATCH R EXTENSION — SCHEMA-LAYER ROOT CAUSE + DatasetField
  TIER-1c SIBLING SIDECAR (now 8-tier end-to-end with the schema
  layer included)**: the ReactiveActivityRepositoryImpl batch-R
  sidecar surfaces the SCHEMA-LAYER ROOT CAUSE underlying the
  7-sidecar pattern. The audit silence on RBAC / Owner /
  Datasource / Collector mutations is NOT a missing-annotation gap
  — it is a SCHEMA-LEVEL IMPOSSIBILITY:
  `activity.data_entity_id` is `bigint NOT NULL` with FK constraint
  `activity_data_entity_id_fk FOREIGN KEY (data_entity_id)
  REFERENCES data_entity (id)` per V0_0_48__add_activity.sql:4,12.
  Combined with the INNER JOIN to DATA_ENTITY at
  ReactiveActivityRepositoryImpl.java:219 (every read path requires
  the FK target to exist), the audit table STRUCTURALLY CANNOT
  store an event that does not reference a data entity.

  **The remediation scope is therefore LARGER than the prior
  per-sidecar recommendations suggested**. Adding `@ActivityLog`
  annotations to OwnerServiceImpl.create / RoleServiceImpl.create
  / PolicyServiceImpl.create is INSUFFICIENT — the annotation
  would fire and the activity-event INSERT would fail at the FK
  constraint at write time. The right scope is a SCHEMA
  MIGRATION + AUDIT SERVICE REFACTOR jointly, not an annotation
  sprinkle. See the dedicated invariant
  `f-006-audit-silence-schema-rooted-data-entity-id-not-null-fk`
  (batch R PRIMARY SOURCE) for the root-cause analysis and the
  three remediation options (A: in-place audit-table extension
  with NULLable data_entity_id + event_scope discriminator;
  B: separate audit surface; C: operator-facing documentation).

  **Companion finding (Tier 1c on DatasetField surface — NEW batch
  R)**: the ReactiveDatasetFieldRepositoryImpl batch-R sidecar
  surfaces a NEW Tier-1c-like asymmetry on the dataset_field
  surface. `DatasetFieldServiceImpl.updateInternalName` (line
  98-99) carries `@ActivityLog(event = ActivityEventTypeDto.
  DATASET_FIELD_INTERNAL_NAME_UPDATED)`. `DatasetFieldServiceImpl.
  updateDescription` (line 87-95) has NO `@ActivityLog` annotation
  — description edits on a dataset_field are NOT recorded in the
  activity feed, while internal-name edits ARE. The asymmetry is
  invisible at the doc surface and INSIDE THE SAME SERVICE CLASS.
  Operators auditing a description change on a column find no
  activity-feed evidence. Tier 1c-like: ENTITY-SCOPED WRITE
  WHERE one verb on the surface is audited but a SIBLING verb
  on the SAME surface is NOT. The asymmetry within a single class
  is more confusing than the prior cross-class Tier-1b cases —
  a maintainer scanning the service file sees `@ActivityLog` on
  one method and reasonably assumes the others ALSO emit events.

  **The 7-sidecar pattern is now 8-sidecar end-to-end (with
  schema layer included)**:
    - UI tier (batch Q — 5 sidecars)
    - HTTP / controller tier (batch E + P — 5 sidecars)
    - Service tier (implicit + DatasetField asymmetric — NEW batch R)
    - SQL tier (batch H + N + R Activity repo — 3 sidecars now)
    - **Schema tier (batch R — V0_0_48 NOT NULL FK constraint —
      the root-cause anchor)**

  **The platform's RBAC + adjacent audit surface is forensically
  dark at every layer including the SCHEMA itself.** The schema
  decision at V0_0_48 (the activity-table migration) committed
  the platform to data-entity-scoped audit only; this commitment
  has propagated through every subsequent layer, and is the
  load-bearing constraint that future remediation work must
  resolve FIRST.
