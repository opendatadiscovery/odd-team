observed_vs_expected:
  facets:
  - facet: updateDataSource is REPLACE-not-MERGE — a partial PUT body silently wipes omitted fields
    observed: |-
      DataSourceUpdateFormData has exactly 3 OPTIONAL fields (description,
      name, namespace_name) with no `required` block (components.yaml:1317-1325).
      DataSourceServiceImpl.update (lines 68-83) applies the form to the
      existing pojo via DataSourceMapper.applyToPojo — a MapStruct
      @MappingTarget method (DataSourceMapper.java:49-56). MapperConfig
      (MapperConfig.java:7-11) sets componentModel / unmappedTargetPolicy /
      injectionStrategy but NO nullValuePropertyMappingStrategy; MapStruct's
      default for an unspecified strategy is SET_TO_NULL. An omitted JSON
      field deserialises to a null Java field and is written as null onto
      the existing row. The namespace overload (DataSourceMapper.java:51-56)
      explicitly sets namespace_id to null when namespace == null. An
      operator (or an API consumer, or a UI bug) sending a partial body to
      change one field silently nulls the other two — editing only `name`
      wipes `description` AND detaches the `namespace`. There is no MERGE
      option on this endpoint.
    expected: |-
      Either (a) MERGE semantics — a global MapStruct
      nullValuePropertyMappingStrategy = IGNORE so an omitted field
      preserves the existing column value; OR (b) explicit doc-side
      statement that update is a full-form REPLACE and callers must
      resend every field they want to keep. The endpoint name `update`
      does not signal REPLACE; the live management doc page (WebFetch
      2026-05-21, status 200) is silent on whether edits replace or merge.
    drift_class: replace_not_merge_silent_field_wipe
    provenance: |-
      STATIC — primary-source in updateDataSource sidecar (batch ZB)
      bugs_limitations_corner_cases[0] + implicit_adrs[0] +
      DataSourceMapper.java:49-56 + MapperConfig.java:7-11 +
      components.yaml:1317-1325. Pinned by probe P-043. Severity: MEDIUM.
      Structural analog to the F-020 Collector
      `update_full_form_replace_silently_nulls_unsubmitted_fields` facet
      (batch W) — same MapStruct @MappingTarget pattern, same
      operator-surprise potential.
  - facet: registerDataSource opens a permission side-door — namespace_name mints a namespace bypassing NAMESPACE_CREATE
    observed: |-
      DataSourceServiceImpl.create (lines 56-57) reads form.getNamespaceName()
      and, if non-empty, calls namespaceService.getOrCreate —
      NamespaceServiceImpl.getOrCreate (lines 37-40) is
      `getByName(name).switchIfEmpty(createByName(name))`, which CREATES a
      namespace if absent. The register endpoint is gated only by
      DATA_SOURCE_CREATE (SecurityConstants.java:116-117); the explicit
      POST /api/namespaces is gated by NAMESPACE_CREATE. A principal
      scoped to only DATA_SOURCE_CREATE (without NAMESPACE_CREATE) mints
      brand-new namespaces through the namespace_name field — escalation
      by side effect. updateDataSource has the SAME side-door
      (DataSourceServiceImpl.java:74-76). No Activity Event records the
      namespace creation.
    expected: |-
      Either (a) the register / update paths consult NAMESPACE_CREATE
      before get-or-create can mint a namespace; OR (b) a DataSourceFormData
      `namespace_id` field so the caller SELECTS an existing namespace
      without the create-on-miss risk; OR (c) the live doc page warns that
      registering / editing a data source with an unknown namespace_name
      creates that namespace. None exists.
    drift_class: permission_side_door
    provenance: |-
      STATIC — primary-source in registerDataSource sidecar (batch ZB)
      bugs_limitations_corner_cases[0] + security.known_security_gaps[0]
      + request_inputs[namespace_name] DRIFT_INPUT_NAME_VS_IMPLEMENTATION
      + DataSourceServiceImpl.java:56-57 + NamespaceServiceImpl.java:37-40
      + SecurityConstants.java:116-117. Pinned by probe P-039. Severity:
      MEDIUM. The same side-door is one of the 8 call sites catalogued in
      F-028 (Namespace Lifecycle) primary drift
      `namespace_create_side_door_bypass_via_four_sister_services`
      (DataSourceServiceImpl.java:57, 75) — cross-link.
  - facet: 200-not-201 status drift — register AND update return HTTP 200 where OpenAPI declares 201
    observed: |-
      registerDataSource (DataSourceController.java:35, `.map(ResponseEntity::ok)`)
      returns HTTP 200; openapi.yaml:453-455 declares `'201': The resource
      has been successfully created` for operationId registerDataSource.
      updateDataSource (DataSourceController.java:44) returns HTTP 200;
      openapi.yaml:481-487 declares `'201': The resource has been
      successfully updated`. A client generated from the published
      OpenAPI spec asserts status == 201 and treats a correct
      registration / edit as a failure; manual API consumers see 200
      where the spec says 201. Separately: DataSourceFormData marks only
      `name` required (components.yaml:1314-1315) but the code rejects an
      empty `oddrn` at runtime with HTTP 400 — `oddrn` is de-facto
      required, the contract understates it (own facet
      oddrn_required_at_runtime_optional_in_openapi_contract).
    expected: |-
      Either the controller returns 201 for register + update (aligning
      with the published spec and REST convention) OR the OpenAPI spec is
      corrected to declare 200. The class-wide 200-vs-201 drift is shared
      with F-019 (Owner), F-020 (Collector), F-028 (Namespace), and the
      Term controllers — a single platform-wide OpenAPI consistency fix.
    drift_class: spec_says_X_impl_does_Y
    provenance: |-
      STATIC — primary-source in registerDataSource sidecar (batch ZB)
      bugs_limitations_corner_cases[1] + updateDataSource sidecar
      bugs_limitations_corner_cases[4] + DataSourceController.java:35,44
      + openapi.yaml:453-455,481-487. Pinned by probe P-038. Severity:
      LOW-MEDIUM.
  - facet: deleteDataSource orphans the token row, leaves the FTS vector uncleared, and blocks on live children
    observed: |-
      deleteDataSource is a guarded SOFT-delete. (1) ORPHAN TOKEN —
      data_source.token_id is a FK to the token table
      (V0_0_28__add_token.sql:13); the soft-delete sets only
      data_source.deleted_at (ReactiveAbstractSoftDeleteCRUDRepository.java:106-110),
      never deletes the token row, and the token table has NO deleted_at
      column (V0_0_28__add_token.sql:1-9) so it cannot even be
      soft-deleted. No code path GCs orphan tokens. Each register-then-delete
      cycle leaks one token row carrying a stale 40-char plaintext
      secret. (2) FTS UNCLEARED — DataSourceServiceImpl.delete (lines
      85-96) calls no searchEntrypointRepository method, unlike update
      (lines 127-136); whether the soft-deleted source still appears in
      catalog search depends on the search query's deleted_at predicate.
      (3) CASCADE-BLOCK — the delete 400s with CascadeDeleteException
      whenever a live data_entity child exists
      (existsNonDeletedByDataSourceId). data_entity rows are
      collector-created and re-created on the next ingest tick, so an
      actively-ingested source is effectively undeletable — the
      delete-children-then-delete-source sequence races the collector;
      the only reliable path is to stop the collector first, which no
      doc page mentions.
    expected: |-
      Either (a) the delete cascades or soft-deletes the token row (and a
      housekeeping job GCs orphan tokens); (b) the delete clears the FTS
      vector like update does; (c) the live doc page documents the
      400-on-live-children precondition and the stop-the-collector-first
      workaround. The token table's missing deleted_at column makes (a)
      a schema change. The orphan-token pattern is identical to the one
      F-020 (Collector) batch-R confirmed for Collector delete.
    drift_class: orphan_row_on_delete
    provenance: |-
      STATIC — primary-source in deleteDataSource sidecar (batch ZB)
      bugs_limitations_corner_cases[0,2,1] + downstream_side_effects +
      DataSourceServiceImpl.java:85-96 + ReactiveAbstractSoftDeleteCRUDRepository.java:106-110
      + V0_0_28__add_token.sql:1-13 + DataSourceServiceImpl.java:127-136
      (update FTS, contrast) + ReactiveDataEntityRepositoryImpl.java:158-163.
      Pinned by probes P-046 (orphan token), P-047 (cascade block/allow),
      P-048 (FTS uncleared). Severity: MEDIUM. Cross-link to F-010
      (Housekeeping) — the orphan-token GAP has no housekeeping job; and
      to F-020 batch-R orphan-token finding for the identical Collector
      shape.
  - facet: under auth.type=DISABLED all four mutating verbs are anonymously reachable
    observed: |-
      Under auth.type=DISABLED the platform's DisabledSecurityConfiguration
      sets all paths .permitAll() and binds no principal; the
      SecurityConstants.SECURITY_RULES rules for DATA_SOURCE_CREATE /
      DATA_SOURCE_UPDATE / DATA_SOURCE_DELETE / DATA_SOURCE_TOKEN_REGENERATE
      (lines 116-126) are not enforced. Any caller able to reach the
      platform can register / edit / delete a data source AND rotate any
      data source's ingestion token, receiving the new plaintext
      credential in the response. For regenerateDataSourceToken this is a
      credential-rotation-hijack surface — an attacker on a DISABLED
      deployment can break ingestion platform-wide and harvest the new
      tokens. TokenGeneratorImpl falls back to a null `updated_by`/`created_by`
      when no principal exists, so the destructive action succeeds with
      no actor attribution.
    expected: |-
      Either (a) the SecurityRule entries are honoured even under
      DISABLED for the four destructive verbs; OR (b) the live
      enable-security doc page warns that auth.type=DISABLED leaves every
      data-source mutation (including token rotation) anonymously
      reachable on a network-exposed deployment. DISABLED is doc-marked
      dev-only; operators running it in production have no namespace,
      data-source, or token protection.
    drift_class: disabled_mode_bypass
    provenance: |-
      STATIC — primary-source in all 5 batch-ZB sidecars' security blocks
      + the batch-W class sidecar DISABLED-mode analysis +
      SecurityConstants.java:116-126. Pinned by probes P-044
      (update auth matrix) + P-052 (regenerate-token auth matrix).
      Severity: HIGH under a misconfigured production DISABLED
      deployment. Member of the REFACTOR-185 DISABLED-mode-bypass cluster
      (batch-W confirmed DataSourceController among the surfaces).
      Cross-link to DOC-GAP-082 (the 29-sidecar DISABLED-bypass
      meta-finding).
  - facet: regenerateDataSourceToken is a destructive rotation with no grace period
    observed: |-
      Rotation is a destructive in-place UPDATE of the single token row
      (ReactiveTokenRepositoryImpl.updateToken — `UPDATE token SET
      value=<new> WHERE id=:id`). There is NO old/new overlap, NO
      previous_token / valid_until column anywhere in the schema, NO
      separate revoke step. A collector / push-client still presenting
      the old token starts failing POST /ingestion/entities with 401
      `Token is not correct` the instant the UPDATE commits
      (IngestionDataEntitiesFilter.java:56-57 does a literal plaintext
      .equals). An operator rotating a data-source token during active
      ingestion locks out ingestion until the collector picks up the new
      token (a config-file change + restart). No warning is logged, no
      notification fires, the docs do not document it. The PUT is also
      non-idempotent — a UI double-submit or network retry rotates the
      token twice, invalidating the value the operator copied from the
      first response before they can use it.
    expected: |-
      Either (a) a grace window — a previous_token column accepted by the
      ingestion filter for a bounded period; OR (b) the UI / API surface
      warns at rotation time that the old token is invalidated
      immediately and the collector must be redeployed; OR (c) an
      enable-security `Token rotation` operational doc section. None
      exists. Note: the rotation also has NO security effect at all on
      the default deployment, because auth.ingestion.filter.enabled
      defaults to false — the filter that validates the token is not
      even registered.
    drift_class: destructive_rotation_no_grace_period
    provenance: |-
      STATIC — primary-source in regenerateDataSourceToken sidecar
      (batch ZB) bugs_limitations_corner_cases[1] + downstream_side_effects
      (external-call) + ReactiveTokenRepositoryImpl.java:30-39 +
      IngestionDataEntitiesFilter.java:43-58. Pinned by probe P-051
      (binary cutover) + P-050 (concurrent rotation). Severity: HIGH.
      Structurally IDENTICAL to the F-020 Collector
      `token_rotation_no_grace_period_old_token_401s_immediately`
      facet — the two rotation paths share TokenGeneratorImpl +
      ReactiveTokenRepositoryImpl; a grace-period fix applies to both.
  - facet: GET /api/datasources is ungated and leaks the real last 6 chars of every token
    observed: |-
      GET /api/datasources has NO entry in SecurityConstants.SECURITY_RULES
      (Grep-confirmed lines 116-126 hold only POST/PUT/DELETE rules) —
      any authenticated user lists the full catalog (id, name, oddrn,
      description, namespace, token) with no MANAGEMENT permission and no
      owner scope; read-collaborative posture. The list token field
      renders the MASKED form via TokenMapper.mapValue — but the mask is
      `"******" + the real last 6 plaintext characters of the token`
      (TokenMapper.java:15-18), not a placeholder. A read-only user reads
      genuine token material for every data source. Additionally: the
      list is ordered data_source.id ASC (creation order, undocumented —
      newly-registered sources appear LAST); the `query` parameter uses
      startsWithIgnoreCase on the page but containsIgnoreCase on the
      empty-page count, producing a phantom `total` ("0 of 1") when a
      query matches by substring-not-prefix (REFACTOR-425 family); and
      `size` has no upper bound at any layer.
    expected: |-
      Either (a) a SecurityRule on GET /api/datasources scoping the list
      to a permission; OR (b) explicit doc-side framing of the
      read-collaborative posture; AND the mask should not expose real
      token characters (or the doc should state that "partially-redacted"
      means real trailing characters). The list ordering, the
      query-predicate divergence, and the unbounded size are all
      undocumented.
    drift_class: ungated_list_read_no_security_rule
    provenance: |-
      STATIC — primary-source in getDataSourceList sidecar (batch ZB)
      bugs_limitations_corner_cases (all entries) + security blocks +
      implicit_adrs[1] + SecurityConstants.java:116-126 +
      TokenMapper.java:15-18 + ReactiveDataSourceRepositoryImpl.java:62,151-160,167.
      Pinned by probes P-034 (id-ASC ordering), P-035 (masked token
      form / real last 6), P-036 (query page-vs-count divergence),
      P-037 (unbounded size). Severity: MEDIUM (read-collaborative
      posture) / LOW (the 6-of-40-char leak). Sibling facets
      list_token_leaks_real_last_six_chars, list_ordering_id_asc_undocumented,
      list_query_page_vs_count_predicate_divergence,
      unbounded_pagination_size_no_cap roll up here.
  - facet: register and regenerate-token responses carry the 40-char token in plaintext with no Cache-Control
    observed: |-
      registerDataSource (showToken=true via the 2-arg TokenDto on create,
      ReactiveTokenRepositoryImpl.java:26) and regenerateDataSourceToken
      (showToken=true on updateToken, ReactiveTokenRepositoryImpl.java:38)
      both return the DataSource with `token.value` carrying the
      unredacted 40-char secret. The controller sets no response header
      marking the body sensitive — DataSourceController.java:33-35 and
      53-58 are bare `.map(ResponseEntity::ok)` with no
      `Cache-Control: no-store`. Any reverse-proxy, API-gateway, browser
      response cache, server-side response-body logger, or APM tool on
      those paths records a live ingestion credential in cleartext. The
      token is also stored plaintext in the token table (no hashing /
      encryption-at-rest — confirmed by IngestionDataEntitiesFilter doing
      a literal .equals). Token entropy uses
      RandomStringUtils.randomAlphanumeric(40), NOT a
      cryptographically-secure RNG by default.
    expected: |-
      Either (a) `Cache-Control: no-store` on the register + regenerate
      responses; (b) a one-shot token-reveal model where the plaintext is
      shown once and never re-served; (c) hash-at-rest for stored tokens;
      (d) SecureRandom for token generation. The plaintext-everywhere
      posture is an implicit ADR (collector tokens as deployment-internal
      shared secrets) but is not defended in any comment or doc.
    drift_class: plaintext_token_in_register_and_rotate_response_no_cache_control
    provenance: |-
      STATIC — primary-source in registerDataSource sidecar (batch ZB)
      bugs_limitations_corner_cases[2] + regenerateDataSourceToken sidecar
      bugs_limitations_corner_cases[4,5] + security.known_security_gaps
      + ReactiveTokenRepositoryImpl.java:26,38 + TokenMapper.java:15-18 +
      TokenGeneratorImpl.java:49 + DataSourceController.java:33-35,53-58.
      Pinned by probe P-040. Severity: MEDIUM (plaintext-in-response) /
      HIGH (RandomStringUtils not SecureRandom). The data-source
      token-handling posture is structurally identical to the F-020
      Collector token posture — TokenGeneratorImpl + ReactiveTokenRepositoryImpl
      are shared; a SecureRandom + hash-at-rest fix applies to both.
  - facet: the entire data-source lifecycle is invisible to the Activity Feed (audit silence)
    observed: |-
      DataSourceServiceImpl emits NO Activity Event for any of the five
      verbs — the class imports no ActivityEvent emitter (verified in the
      batch-W class sidecar). register, update, delete, and
      regenerate-token all complete with no Activity Feed row. There is
      also no log.info / log.warn on any path (DataSourceController /
      DataSourceServiceImpl / TokenGeneratorImpl / ReactiveTokenRepositoryImpl
      carry no log call). An operator auditing "who registered / edited /
      deleted this data source, or who rotated its token, and when" has
      no audit trail — the only signals are the row's deleted_at /
      updated_at timestamps and token.updated_by, all actor-thin or
      single-state (overwritten on the next mutation). A security review
      of "who rotated data-source token X before the last rotation"
      cannot be answered from production data.
    expected: |-
      Either (a) @ActivityLog on the four mutating service methods; OR
      (b) a separate platform_event audit surface. ActivityEventTypeDto
      has no DATA_SOURCE_* enum constant — the same enum-rooted
      audit-silence the platform-wide 9-sidecar pattern catalogues
      (F-006 RBAC / F-019 Owner / F-020 Collector / F-028 Namespace all
      carry it). A separate platform_event audit surface would cover
      data-source lifecycle + collector lifecycle + namespace lifecycle +
      RBAC + Owner CRUD as one architectural addition.
    drift_class: audit_silence_no_activity_log_no_logging_any_layer
    provenance: |-
      STATIC — primary-source in all 5 batch-ZB sidecars
      (downstream_side_effects NO-Activity-Event entries +
      bugs_limitations_corner_cases) + DataSourceServiceImpl.java:38-106
      (no emitter, no log). Severity: MEDIUM. Member of the platform-wide
      audit-silence cluster — cross-link to F-006, F-019, F-020, F-028
      and the system-mission.md "Audit-log Presence Asymmetry"
      canonicalisation candidate.
  - facet: regenerateDataSourceToken is not @ReactiveTransactional — code-shape inconsistency vs the 3 annotated siblings
    observed: |-
      DataSourceServiceImpl.regenerateDataSourceToken (line 99) is NOT
      annotated @ReactiveTransactional, whereas the sibling create
      (line 52), update (line 69), and delete (line 86) ALL carry the
      annotation — primary-source confirmed by reading
      DataSourceServiceImpl.java end-to-end this batch. The missing
      annotation does NOT currently produce a partial-write bug because
      the only DB write (tokenRepository.updateToken) is a single jOOQ
      UPDATE statement (atomic at the DB level) and
      tokenGenerator.regenerateToken is a purely in-memory mutation —
      there is no old-invalidated-but-new-not-persisted window. The risk
      is latent: a future change adding a second write to this method
      (an audit-log insert, a notification dispatch, an FTS refresh)
      would NOT be wrapped in a transaction and could half-commit.
    expected: |-
      Consistent transactional posture across all four mutating
      DataSourceServiceImpl methods — regenerateDataSourceToken annotated
      @ReactiveTransactional like its siblings, so a future second write
      is atomic.
    drift_class: regenerate_token_not_reactive_transactional_inconsistent_with_siblings
    provenance: |-
      STATIC — primary-source in regenerateDataSourceToken sidecar
      (batch ZB) bugs_limitations_corner_cases[0] +
      DataSourceServiceImpl.java:99 (no annotation) vs lines 52,69,86
      (annotated). Severity: LOW (latent code-smell, not an active
      atomicity bug). This is the
      `regenerate_datasource_token_not_reactive_transactional` finding
      F-008 batch-W surfaced via the DataSourceController class sidecar —
      now PRIMARY-SOURCE confirmed at the method tier and homed on F-031.
