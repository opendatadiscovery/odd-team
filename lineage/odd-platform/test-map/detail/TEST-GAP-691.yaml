behaviour: |-
  **REFACTOR-024 family CRITICAL — `AlertServiceImpl.handleExternalAlerts` PRIMARY-SOURCE confirms the F-007 `no_idempotency_no_audit` facet at the service tier: the AlertManager webhook SKIPS `AlertActionResolver`.** Lines 151-191 (`handleExternalAlerts`) construct `AlertPojo` from the webhook payload and forward to `createAlerts` (line 190), which is a bulk INSERT with no ON CONFLICT. Two POSTs of the same payload (Prometheus retry on transient network error) produce TWO duplicate ALERT rows. The in-platform ingestion path (`applyAlertActions` lines 202-231) AVOIDS this by routing through `AlertActionResolver` (which loads the open-alerts snapshot first), but `handleExternalAlerts` DELIBERATELY skips the resolver — `implicit_adrs[3]` captures the rationale: the AlertManager webhook is a thin adapter with no state context, so it cannot economically de-duplicate at the service layer. The audit-side companion finding (no `log.info` at WEBHOOK INGRESS, no `@Timed`, no correlation-id capture) lives at the `AlertManagerController` controller-method tier (batch P) — but the consequence visible at THIS service tier is that the only post-hoc signal of a webhook arrival is the alert rows themselves. The asymmetry between the in-platform path (de-dupes via AlertActionResolver) and the webhook path (no de-dup) is the EXACT shape of the F-007 facet — service-tier PRIMARY-SOURCE.
