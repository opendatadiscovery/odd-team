description: |-
  NEW OPERATION, batch 2026-05-19M (SearchController.facets sidecar — covers
  both getSearchFacetList at GET /api/search/{search_id} and
  getFiltersForFacet at GET /api/search/{search_id}/facet/{facet_type}) —
  the facet-count surface that powers the seven-facet UI sidebar on the
  Catalog tab. **getSearchFacetList**: returns the seven-facet aggregate
  counts + the total catalog count + the optional myObjectsCount for the
  current owner. Issues FOUR parallel-via-Mono.zip DB calls at
  SearchServiceImpl.java:122-155: (a) entity-class facet aggregator
  (ReactiveSearchFacetRepositoryImpl.java:163-249 — runs
  unnest(DATA_ENTITY.ENTITY_CLASS_IDS) + count(DATA_ENTITY.ID) GROUP BY
  entity class), (b) catalog-wide total via
  reactiveDataEntityRepository.countByState(state), (c) owner-scoped
  myObjectsCount via countByState(state, owner) — runs UNCONDITIONALLY even
  when my_objects=false, (d) the UPDATE-RETURNING fetch of the session row
  for last_accessed_at side-effect.
  **getFiltersForFacet**: returns paginated CountableSearchFilter[] for a
  single facet type (TAGS / OWNERS / TYPES / GROUPS / STATUSES per
  MultipleFacetType). Issues TWO DB calls: (a) the UPDATE-RETURNING session
  fetch, (b) the facet-type-specific aggregator (owner facet at
  :339-372 runs OWNER LEFT JOIN OWNERSHIP LEFT JOIN SEARCH_ENTRYPOINT
  LEFT JOIN DATA_ENTITY with countDistinct(SEARCH_ENTRYPOINT.DATA_ENTITY_ID)
  ORDER BY count DESC LIMIT/OFFSET; tag/group/type/status facets follow
  the same shape).
  **Five load-bearing structural findings**:
    (a) **Catalog-wide computation by design** — every aggregator applies
        only getDataEntityDefaultConditions (HOLLOW=false, STATUS != DELETED,
        EXCLUDE_FROM_SEARCH NULL-or-false); NO OWNERSHIP join, NO
        principal-derived predicate. The myObjects toggle controls which
        entities the user SEES in the RESULT list (SearchServiceImpl.java:105-111),
        NOT the facet counts;
    (b) **FTS query reaches every aggregator** — every facet applies
        ftsCondition(SEARCH_ENTRYPOINT.SEARCH_VECTOR, state.getQuery()) when
        the persisted session query is non-empty; the to_tsquery operator-
        injection vector reaches FIVE distinct aggregator invocation sites
        (see tsquery operator-injection via persisted state invariant);
    (c) **Side-effect UPDATE on every read** — fetchFacetState
        (ReactiveSearchFacetRepositoryImpl.java:99-106) issues
        UPDATE search_facets SET last_accessed_at WHERE id = ? on every
        GET — every facet GET is a WRITE; the last_accessed_at field is
        never read by any housekeeping job;
    (d) **Unbounded pagination at every layer** — controller params
        Integer page, Integer size carry no validation annotations;
        components.yaml:4213-4229 PageParam/SizeParam have no minimum/maximum;
        the repository computes OFFSET = (page - 1) * size with no clamping;
    (e) **No upper bound on session UUID validity** — get(id) is a raw
        UUID-keyed lookup with no per-user owner predicate (search_facets
        schema has no owner_id column); any authenticated user with any
        UUID can drive the operation.
  **Severity**: HIGH (cross-owner cardinality enumeration via owner facet;
  catalog-cardinality discovery via tag/group/namespace/status facets;
  bearer-token-shaped session reach).
