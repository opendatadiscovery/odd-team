pillar_anchored_feature_name: RBAC Frontend Affordance — WithPermissions HOC Context-vs-Gate
feature_name: |-
  RBAC frontend affordance pattern — WithPermissions + WithPermissionsProvider
  HOCs that HIDE-not-disable forbidden controls. The pair is the
  cross-cutting UI surface where the methodology's LSN-023 trap lives:
  these HOCs are CONTEXT (UX shape of permission propagation) NOT GATE
  (backend authorization is enforced server-side); confident
  `permission_side_door`-class drift readings against the UI alone would
  recapitulate the LSN-023 false-positive class.
