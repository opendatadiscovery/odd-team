name: |-
  Top Tags UI Label vs Implementation Drift (operator-visible — LSN-019 manifested at the UI surface)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-01
  - P-08
description: |-
  NEW CANONICALISATION CANDIDATE, batch VAL-LSN-019 (2026-05-20) —
  audience-facing surface where the LSN-019 listMostPopular drift
  manifests visibly to the operator. The UI label "Top Tags" promises
  popularity-ranked tag selection; the SQL truth is oldest-by-id pre-
  selection then count-DESC re-ordering within the pre-truncated window.

  WHY THIS NEEDS ITS OWN CONCEPT ENTRY:

    The LSN-019 invariant
    (`lsn-019-listmostpopular-name-vs-behavior-drift-pagination-precedes-ranking`)
    captures the BEHAVIORAL drift at the code layer. This concept
    captures the AUDIENCE-FACING SURFACE where the drift becomes
    operator-visible. The two are distinct in the concept catalog:
      - The invariant is a finding about the code.
      - This is a finding about the UI label / doc text that the
        operator reads and trusts.

    The audience-facing surface is what determines DOC-NNN scope
    and the FIX-vs-RELABEL trade-off. The invariant is what
    determines REGRESSION-TEST + CODE-FIX scope.

  THE UI SURFACES THAT CARRY THE "Top Tags" / "Popular Tags" LABEL:

    Surface 1 — Catalog Overview Top-tags chip strip:
      The Discovery → Overview surface renders the response from
      GET /api/tags?page=1&size=30 (default) as a chip-strip labeled
      "Top Tags" (UI inheritance from previous batch-W sidecar
      analysis; the React component is referenced as the
      OwnerEntitiesList variant per batch J UI-axis-name-drift).
      This is the highest-traffic operator-visible surface.

    Surface 2 — Tag-search facet dropdown:
      The Catalog search uses the same endpoint with a `query`
      substring filter. The dropdown labels the suggestions as the
      "Top matching tags". For a substring search like `query=post`,
      the response is the OLDEST tags matching `name LIKE '%post%'`
      re-ordered by count DESC — NOT the most-popular tags matching.

    Surface 3 — Management → Tags tab listing:
      The Management → Tags tab renders the full directory page-by-
      page. Operators using this surface to audit the tag vocabulary
      see the OLDEST tags first regardless of usage.

    Surface 4 — Data-entity detail tag-dropdown:
      The per-entity tag picker (used when an operator with
      DATA_ENTITY_TAGS_UPDATE applies tags) fetches the directory via
      the same endpoint. The dropdown suggestions are OLDEST tags
      first — operators picking from the dropdown surface OLDER tags
      preferentially, perpetuating the bias.

  THE OPERATOR-FACING IMPACT:

    A data steward using "Top Tags" to find prevalent vocabulary makes
    decisions based on TAGS THAT ARE OLD, not tags that are most used.
    Recently-introduced tags that ARE genuinely popular (e.g., a new
    "pii_classification" tag applied to thousands of entities last week)
    are INVISIBLE on the operator's primary surface. The operator
    plans vocabulary work using the wrong signal.

    A platform operator wiring an RBAC policy that says "users in role X
    can apply tags from the Top Tags list" effectively limits role X to
    the OLDEST tags — a wholly accidental policy that nobody intended.

    A new operator onboarding the platform forms a MENTAL MODEL of the
    tag vocabulary from the "Top Tags" surface. They believe the
    vocabulary is small and old; they don't realize most of the
    actually-used tags are hidden behind the LIMIT.

  THE DOC-PAGE-SILENCE:

    Live docs page `/features/data-discovery/tagging` (WebFetched
    2026-05-20, status 200, inherited from batch-W TagController
    sidecar) describes the "Top Tags" UI surface but provides NO
    description of ordering semantics. The doc DOES NOT say "most
    used" or "oldest"; it just says "tags from the catalog".
    Operators reading the doc + observing the UI are unable to
    infer the actual behavior.

  THE THREE RESOLUTION PATHS:

    Path A (preferred) — Fix the implementation. The
    `lsn-019-listmostpopular-name-vs-behavior-drift-pagination-precedes-ranking`
    invariant carries the recommended code fix (move the ORDER BY
    count DESC inside the paginate window). Once landed, this UI
    label becomes truthful again. The UI label "Top Tags" is correct;
    only the implementation needs work.

    Path B (cheap) — Relabel the UI surface. Rename "Top Tags" to
    "Oldest Tags" or "Catalog Vocabulary" or similar. The UI no longer
    lies; the implementation stays as-is. Cost: operators lose the
    affordance of seeing genuinely popular tags; the platform must
    provide a separate "Most Used Tags" surface (which doesn't exist).

    Path C (compromise) — Add a doc admonition. Keep the UI label
    + implementation as-is; add an admonition on the doc page
    explaining the actual behavior. Cost: operators who don't read
    the doc still get misled; the responsibility for the bug shifts
    to the operator.

    Recommended: Path A (fix the implementation). The UI label is
    correct as an operator's-eye name for what the surface SHOULD do.
    The implementation is the only thing that needs to change.

