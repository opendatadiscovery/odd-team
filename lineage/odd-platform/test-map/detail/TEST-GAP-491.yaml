proposed_action: |-
  Three-test bundle. (1) `testActivityAspect_isAbsentUnderIntegrationTestProfile`: Spring context test asserting that `ApplicationContext.getBean(ActivityAspect.class)` THROWS NoSuchBeanDefinitionException under `@ActiveProfiles("integration-test")`. LOCKS the trap as a known design choice. (2) `testActivityAspect_isPresentUnderDefaultProfile`: same test, no profile activation, asserts the bean IS present. LOCKS the inverse. (3) Sidecar a registry-level note in `playbooks/activity-log-testing.md` documenting that any future test asserting an activity-table row must use either a Mockito unit test on the service method OR a Spring test outside the integration-test profile. THIS test bundle is the META lever — it makes the trap loud and prevents new tests from silently passing under the false assumption that @ActivityLog wiring is observed. Promote to a backlog item with cross-pillar consequence flagged: P-07 audit surface, P-09 security audit, P-01+P-06 entity mutations.
