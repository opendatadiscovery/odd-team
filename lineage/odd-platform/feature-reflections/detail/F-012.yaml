- id: H-006
  hypothesis: |-
    An operator granted the capability to "manage DEG membership" can both add and remove
    entities from groups.
  derivation: |-
    The operator mental model of a single "curate membership" capability; the two permissions
    DATA_ENTITY_ADD_TO_GROUP / DATA_ENTITY_DELETE_FROM_GROUP at PolicyPermissionDto.java:22-23.
  seed_source: pillar
  validation:
    verdict: partial
    actual_behavior: |-
      There is no single "manage membership" capability — add and remove are TWO independently-grantable
      permissions. SecurityConstants.java:228-236 registers DATA_ENTITY_ADD_TO_GROUP for POST and
      DATA_ENTITY_DELETE_FROM_GROUP for DELETE as separate rules; PolicyPermissionDto.java:22-23 declares
      both as distinct DATA_ENTITY-scoped enum values. A Policy granting only ADD lets the holder add but
      not remove; only DELETE, the reverse. The UI reflects this: the "Add to group" button is gated on
      DATA_ENTITY_ADD_TO_GROUP (OverviewGroups.tsx:32,91) and the X chip on DATA_ENTITY_DELETE_FROM_GROUP
      (GroupItem.tsx:37). The hypothesis is TRUE only when the operator was granted BOTH; the live
      permissions doc does not flag "manage DEG membership" as a compound capability. (Already tracked:
      PLT-024 / DOC-188; the permissions-page cross-link is a DOC-188 acceptance criterion, done.)
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__deleteDataEntityFromDataEntityGroup.md
        section: understanding (headline finding 1) + tests_coverage_semantic.uncovered_behaviours
        cite: "SecurityConstants.java:228-236 + PolicyPermissionDto.java:22-23"
        note: "two independent permissions; a Policy with only ADD cannot DELETE and vice versa."
    operator_visible_failure: |-
      An operator who intends to delegate "let this steward curate the Finance Domain's membership" and
      grants only one of the two permissions creates a half-capability: the steward can add but is blocked
      on remove (403) or vice versa, with no up-front signal of why. The asymmetry is operator-surprising
      and is not surfaced as a compound capability in the permissions UI. Low severity (UX/policy-authoring),
      not a data-integrity defect.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: cross-actor
    coverage: unverified
    test_ref: ""

- id: H-007
  hypothesis: |-
    When a user removes an entity that is not actually in the group (e.g. a double-click on the
    X, or a stale UI), the platform responds consistently with how it handles the duplicate-add
    case — the user gets a coherent signal about whether anything changed.
  derivation: |-
    Idempotence symmetry between ADD and DELETE; ADD raises 400 on duplicate (H-003), so the
    symmetric expectation is a coherent DELETE-no-op signal.
  seed_source: endpoint-shape
  validation:
    verdict: contradicted
    actual_behavior: |-
      DELETE is silently idempotent while ADD is not. deleteDataEntityFromDEG issues
      deleteRelationsReturning(...).collectList() with NO .switchIfEmpty — an empty result flows
      through ignoreElements().thenReturn(noContent()) returning 204 IDENTICAL to a real removal
      (DataEntityServiceImpl.java:421-426). ADD raises 400 on duplicate (H-003). The UI compounds this:
      GroupItem.handleDelete fires the DELETE with NO confirmation dialog and on success shows the toast
      "Data entity successfully deleted from group." (dataentities.thunks.ts:253) — so a no-op DELETE shows
      a SUCCESS message even though nothing was deleted. Combined with the forensic silence (H-005), neither
      the HTTP response, the toast, nor the activity feed tells the caller whether anything actually changed.
      (Already tracked: PLT-024 Defect 3 / DOC-188 Facet 4.)
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__deleteDataEntityFromDataEntityGroup.md
        section: understanding (headline finding 2) + concepts.invariants[3]
        cite: "DataEntityServiceImpl.java:421-426"
        note: "no switchIfEmpty on DELETE; empty Flux → 204; ADD raises 400 on duplicate."
      - sidecar: "(Rule-8 source read — UI sidecar absent)"
        section: GroupItem.tsx:21-26 + dataentities.thunks.ts:251-254
        cite: "odd-platform-ui/src/components/DataEntityDetails/Overview/OverviewGroups/GroupItem/GroupItem.tsx:21-26"
        note: "delete fires immediately, no confirm; success toast shows even on a 204 no-op. source_read_for_validation: true."
    operator_visible_failure: |-
      (1) A user double-clicking the X (or removing an already-removed chip in a stale tab) sees
      "Data entity successfully deleted from group." for a no-op — a false-positive success. (2) A
      reconciliation script that ADD-then-DELETEs faces two different idempotence contracts (400 vs 204)
      for write-symmetric operations and must special-case them. (3) With no confirmation dialog on the X,
      an accidental click silently HARD-deletes the membership (unrecoverable except by re-add — see H-009).
      (4) The caller cannot distinguish "removed" from "was already absent" from HTTP, toast, or audit.
    severity: LOW
    confidence: HIGH
    routes_to_finding: caveat-candidate
    use_case_kind: edit-reconcile
    coverage: unverified
    test_ref: ""

