behaviour: |-
  **MEDIUM (compound when paired with the case-sensitivity trap TEST-GAP-775) — `NotificationConfiguration.java:61-69` populates JavaMail's Properties bag with `mail.transport.protocol`, `mail.smtp.auth`, `mail.smtp.starttls.enable` ONLY. NONE of `mail.smtp.connectiontimeout`, `mail.smtp.timeout`, `mail.smtp.writetimeout` is set. JavaMail's defaults are INFINITE. A hung SMTP relay blocks the notification-subscriber thread indefinitely, stalling delivery on ALL channels (Slack + webhook + email — they share the single-threaded WAL subscriber).**

  **STRENGTHENS existing TEST-GAP-178 + TEST-GAP-202** with the config-class-tier primary source. Prior batches surfaced this from the EmailSenderProperties tier (TEST-GAP-178) and a sibling tier (TEST-GAP-202). This sidecar is the config-class primary source confirming the EXACT lines of the missing keys.

  **Cross-channel impact** (a deeper finding from this sidecar): the notification subscriber is SINGLE-THREADED per `NotificationSubscriber.java` (sibling sidecar). The shared `HttpClient` at L31-34 is also single per JVM. So a hung SMTP relay blocks the THREAD, which in turn blocks the Slack + webhook senders that depend on the same thread's continuation. The TIMEOUT-UNSET issue is not just an email-channel problem — it's a notification-subsystem-wide single point of failure.

  **Live doc evidence** (WebFetched 2026-05-20 from `/configuration-and-deployment/odd-platform`): the SMTP timeout warning IS in the docs ("an unreachable SMTP server will hang notification delivery"). Doc-side remediation is in place. Code-side remediation is unimplemented.

  **Test gap shape**: integration test with a stub SMTP server that NEVER responds (Testcontainers GenericContainer running `nc -l 25` or a slow-resolver mock); send an alert; assert the platform's `JavaMailSenderImpl.send(...)` blocks INDEFINITELY (or until JVM-test-timeout fires, e.g., 30s). PINS the current behaviour. The fix (REFACTOR-NNN) adds three `mail.smtp.connectiontimeout=5000` etc. lines to NotificationConfiguration.java:61-69.
