observed_vs_expected:
  facets:
  - facet: slice-then-sort sorts only the truncated window — not the full list
    observed: |-
      OverviewTags.tsx:54 — `.slice(0, visibleLimit).sort(tagsCompare)`.
      JavaScript Array.prototype methods evaluate left-to-right; .slice
      runs first and returns a new array of the first 20 elements; .sort
      then orders THOSE 20 elements. For a 25-element tags array, the
      top-20 visible are tags at indices 0-19 (insertion / database
      order) — re-arranged among themselves by importance. Tags at
      indices 20-24 are completely absent from the first-paint view
      regardless of their importance flag. The same shape recurs at
      OverviewTags.tsx:69-83 (the Collapse content — sorts the SECOND
      window after slicing tags.slice(visibleLimit)). Each window is
      independently sorted; the merged sorted-by-importance global
      order is never assembled.
    expected: |-
      The standard pattern is `.sort(comparator).slice(0, visibleLimit)`
      — sort the full array first, THEN truncate to top-N. The sort
      THEN slice flip is a one-line fix that materially changes
      operator-visible behaviour.
    drift_class: slice_then_sort_sorts_only_truncated_window_not_full_list
    evidence:
    - 'OverviewTags.tsx:54-58 — tags.slice(0, visibleLimit).sort(tagsCompare).map(...)'
    - 'OverviewTags.tsx:69-83 — tags.slice(visibleLimit).sort(tagsCompare).map(...) (Collapse contents)'
    - 'OverviewTerms.tsx:48-58 — terms.slice(0, visibleLimit).sort().map(...)'
    - 'OverviewTerms.tsx:62-72 — terms.slice(visibleLimit).sort().map(...) (Collapse contents)'
    - 'OverviewGroups.tsx:49-54 — dataEntityGroups.slice(0, visibleLimit).sort().map(...)'
    - 'OverviewGroups.tsx:59-68 — dataEntityGroups.slice(visibleLimit).sort().map(...) (Collapse contents)'
    provenance: STATIC — primary-source verification at the line anchors above.
    severity: MEDIUM
  - facet: Tags importance ordering lost when list exceeds twenty — important tags invisible below cut
    observed: |-
      Combined consequence of the slice-then-sort facet: the
      `tagsCompare` comparator at OverviewTags.tsx:27-32 explicitly
      promises "important tags first, then alphabetic." But because
      the slice runs first, this promise only holds WITHIN the
      first-20 window of the array. An entity with 25 tags where
      the important ones sit at indices 22, 23, 24 (e.g. tags added
      LAST by the operator who carefully marked them important) sees
      NONE of them in the visible top-20. The operator opens the
      entity, scans the tags strip, sees no important tag — and
      assumes the entity has no important tags. The "View All (25)"
      button is the only signal more tags exist.
    expected: |-
      Sort BEFORE slice so important tags always surface in the
      visible window regardless of insertion order. Cross-link
      F-018's existing taxonomy of tag-surface drift.
    drift_class: tags_importance_ordering_lost_when_list_exceeds_twenty_important_invisible_below_cut
    evidence:
    - 'OverviewTags.tsx:27-32 — tagsCompare comparator declares important-first intent'
    - 'OverviewTags.tsx:54-58 — slice-then-sort breaks the intent'
    provenance: STATIC.
    severity: MEDIUM
  - facet: top-N window for Tags and Terms — array position order not importance order
    observed: |-
      Identical to the previous facet but framed as the panel-level
      observable: the visible top-N (twenty for Tags/Terms, ten for
      Groups) reflects whatever order the backend returned them in.
      For F-018 — the backend tag-list is in tag_to_data_entity
      insertion order (per ReactiveDataEntityRepositoryImpl join
      semantics — no explicit ORDER BY on the relation join). For
      F-002 (Term linkage) — same shape. The operator sees a
      seemingly-random ordering of tags in the visible window.
    expected: |-
      Server-side ORDER BY important DESC, name ASC, OR the
      sort-before-slice fix at the UI layer.
    drift_class: top_n_window_for_tags_and_terms_is_array_position_order_not_importance_order
    evidence:
    - 'OverviewTags.tsx:54-58, OverviewTerms.tsx:48-58 — same slice-then-sort'
    provenance: STATIC.
    severity: MEDIUM
  - facet: Groups default sort() call with no comparator — undefined ordering behaviour
    observed: |-
      OverviewGroups.tsx:49-54 — `dataEntityGroups.slice(0, visibleLimit).sort()`.
      Bare `.sort()` on an array of DataEntityRef objects. Per
      ECMAScript: when comparator is omitted, elements are converted
      to UTF-16 code units via String() (toString). For objects without
      a toString override (DataEntityRef is a plain DTO), this yields
      `"[object Object]"` for every element — all elements compare
      equal, ordering is stable-or-undefined per engine. V8 (Chrome's
      engine) uses TimSort, which is stable, so the order is the
      pre-slice array position. NET effect: same as no sort at all.
      The sort call is dead code that misleads readers into thinking
      ordering happens.
    expected: |-
      Either remove the `.sort()` (it does nothing meaningful) and
      acknowledge the surface displays insertion order, OR supply a
      comparator (e.g. by group.internalName / externalName).
    drift_class: groups_default_sort_call_with_no_comparator_undefined_behaviour
    evidence:
    - 'OverviewGroups.tsx:49-54 — bare sort() on DataEntityRef[]'
    provenance: STATIC.
    severity: LOW
  - facet: View-All button text includes full count — revealing truncation only after click
    observed: |-
      OverviewTags.tsx:85 — `text={viewAll ? t('Hide') : `${t('View All')} (${tags?.length})`}`.
      The button label shows the FULL count (e.g. "View All (25)") only
      when overflow exists. An operator scanning the visible window sees
      20 items; the "(25)" suffix is the only signal there are 5 more.
      A user who doesn't notice the suffix concludes the entity has 20
      tags rather than 25. Identical shape on OverviewTerms.tsx:76 and
      OverviewGroups.tsx:72.
    expected: |-
      Either (a) explicit "Showing 20 of 25 tags. View all..." text, OR
      (b) auto-expand on hover, OR (c) a different visual signal of
      truncation (fade-to-edge, "+5 more" tile in the strip).
    drift_class: view_all_button_text_includes_full_count_revealing_truncation_only_after_click
    evidence:
    - 'OverviewTags.tsx:85'
    - 'OverviewTerms.tsx:76'
    - 'OverviewGroups.tsx:72'
    provenance: STATIC.
    severity: LOW
  - facet: View-All Collapse unmountOnExit — loses user scroll position on collapse
    observed: |-
      OverviewTags.tsx:68 — `<Collapse in={viewAll} timeout='auto'
      unmountOnExit>`. The unmountOnExit prop tears down the DOM nodes
      on collapse. A user expanded the list, scrolled mid-way, clicked
      Hide → all DOM is unmounted; next expansion re-mounts at the top.
      Scroll-position preservation across expand/collapse cycles is
      lost. Same shape on OverviewTerms.tsx:61 and OverviewGroups.tsx:57.
    expected: |-
      Either (a) remove unmountOnExit to keep DOM (memory-vs-UX
      tradeoff), OR (b) preserve scroll position across the toggle.
    drift_class: view_all_collapse_unmountonexit_loses_user_scroll_position
    evidence:
    - 'OverviewTags.tsx:68'
    - 'OverviewTerms.tsx:61'
    - 'OverviewGroups.tsx:57'
    provenance: STATIC.
    severity: LOW
