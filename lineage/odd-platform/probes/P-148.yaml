      VALUES (51001, '//probe-source/p148/dataset-c', 'p148_c', 1, 1)
  - kind: sql
    query: |
      -- Note inverted timestamps: version 3 is OLDER than version 2.
      INSERT INTO dataset_version (id, dataset_oddrn, version, version_hash, created_at)
      VALUES (51101, '//probe-source/p148/dataset-c', 1, 'hash-c-v1', NOW() - INTERVAL '3 hours'),
