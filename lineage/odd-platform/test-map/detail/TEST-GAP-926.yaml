behaviour: |-
  **LOW — every filter autocomplete (Namespace / Datasource / Owner / Title / Tag, 10 instances) hard-codes `{ page: 1, size: 30 }` (`hooks/index.ts:13-16`) with NO pagination, NO infinite-scroll, NO "load more". For catalogs with > 30 entries per dimension where the desired option does not appear in the server's first 30 for a given search prefix, the option is UNREACHABLE via that prefix. The operator sees only 30 options per prefix with no indication this is a truncation.**

  **The pagination contract** (statically certain):
  - `useFilter` (the shared hook in `DataQualityFilters/hooks/index.ts`): `useHook({ page: 1, size: 30, query: searchText })` — page and size are literals.
  - The server query DOES receive the `query` text, so server-side name-prefix search narrows the 30.
  - `MultipleFilterItemAutocomplete` ALSO re-filters client-side via `getFilterOptions` (`MultipleFilterItemAutocomplete.tsx:75-89`) — redundant on the server's already-filtered 30.
  - No UI element (`MultipleFilterItemAutocomplete.tsx:146-178`) renders "showing 30 of N" or "load more" — the operator cannot distinguish a truncated list from a complete one.

  **What the operator sees**:
  - Catalog with 200 owners, operator types "a" → server returns first 30 owner names starting with "a" → 30 chips appear in the autocomplete dropdown → desired owner is the 47th in alphabetical order → operator types more characters to narrow → eventually finds it.
  - Operator's mental model: "the autocomplete shows me everything matching my prefix" → wrong; correct model is "shows me the first 30 the server returns for this prefix".
  - Worst case: an owner whose name is preceded alphabetically by 30 other owners with the same prefix never appears even with a fully-specified prefix shorter than the owner's full name.

  **Why LOW**: degraded UX, not wrong behaviour; sidecar self-rates MEDIUM but the workaround (type more characters) is discoverable; downgraded to LOW in line with the contract's emphasis on operator-facing severity (an experienced operator works around it; a new operator may not realise they are missing options).

  **Test gap shape**: integration test mocking the list-API to return 30 specific options for any short prefix; asserting (a) all 30 render, (b) NO "load more" or "showing X of N" element appears, (c) typing a more-specific prefix shows different 30. Pair with a FIX-REQUIRED comment requesting pagination OR an indicator.
