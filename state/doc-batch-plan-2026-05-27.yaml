# ─────────────────────────────────────────────────────────────────────────────
# Driver protocol — one /loop iteration = one batch
#
# The /loop prompt body MUST be self-contained and idempotent. Recipe:
#
# 1. Read state/doc-batch-plan-2026-05-27.yaml.
# 2. Find the FIRST batch with status: pending. If none → fast-forward
#    documentation/main is NOT done (per user's PR-not-direct-to-main
#    instruction); instead push origin/{branch} + output the PR-creation URL
#    + emit "SWEEP COMPLETE" + stop the loop (omit ScheduleWakeup).
# 3. Fire /implement with the batch's `items` list inlined as the starter
#    set. The /implement skill will hold the Quality Bar per item.
# 4. On success (all items flipped pending → review-ready in their backlog
#    frontmatter, two-plus thematic commits on feature/{branch}), update the
#    batch's status to "done" in this YAML + commit the YAML update on
#    odd-team/main with message "[doc-sweep] batch {N} done — {item count}".
# 5. Return — /loop will re-invoke the same prompt next iteration.
#
# Consecutive-failure halt: walk the YAML's batch_history (when present).
# If the last 2 batches both have status: blocked → ABORT loop and surface
# to maintainer.
#
# Branch hygiene: every /implement iteration runs `git fetch origin && git
# checkout {branch}` in the documentation repo as its pre-flight — no PR
# merge expected mid-sweep; the branch only grows commits.
# ─────────────────────────────────────────────────────────────────────────────
