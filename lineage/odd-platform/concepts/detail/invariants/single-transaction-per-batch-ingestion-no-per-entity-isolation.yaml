name: Single-transaction-per-batch ingestion — no per-entity isolation
canonical_in_docs: false
canonical_candidate: true
description: '**NEW INVARIANT, batch 2026-05-19I (IngestionService sidecar)** —
  the entire ingestion pipeline runs inside one `@ReactiveTransactional` (`IngestionServiceImpl.java:66`)
  spanning: datasource lookup + entity bulkUpdate + entity restore + entity bulkCreate
  + the 14-processor chain (across all 3 phases INITIAL / MAIN / FINALIZING) +
  OTLP metric export. One failure ANYWHERE rolls back EVERYTHING. There is NO per-entity
  isolation, NO DLQ, NO partial-success response shape, NO per-entity error reporting.
  A single failing processor (constraint violation on `dataset_version`, OOM in
  metadata processing, deadlock against another concurrent ingestion, OTLP backend
  unreachable causing the metric extraction to fail) ROLLS BACK ALL of the above
  — the entire batch is lost. The HTTP response is binary: 200 OK (all writes
  committed) or 5xx (everything rolled back, no body detail). For a 1000-entity
  payload where entity 500 has a constraint violation, the other 999 are also
  rolled back; the operator''s only signal is the application log. The collector
  receives no payload-level error report indicating WHICH entity failed. The
  decision is intentional (the `@ReactiveTransactional` annotation IS the artefact
  of intent; the maintainer chose a custom annotation to make the boundary visible)
  — alternative shapes (per-entity transactions, async DLQ) would require restructuring
  the processor chain. The operator-facing trade-off: ATOMICITY at the cost of
  PARTIAL-SUCCESS DEBUGGABILITY. The `IngestionController.postDataEntityList` controller
  returns `Mono<ResponseEntity<Void>>` — void body, no error detail surface (controller
  sidecar batch F). Combined with the silent replace-not-merge semantics (`silent-data-loss-via-replace-not-merge-ingestion-semantics`),
  the ingestion contract has TWO uncovered-in-docs surprises for collector authors:
  (1) per-entity isolation is NOT provided; (2) omission deletes. A collector reading
  the OpenAPI contract would see `POST /ingestion/entities` accepts a list and
  reasonably assume per-entity success/failure isolation — both assumptions are
  WRONG, neither is signposted.'
