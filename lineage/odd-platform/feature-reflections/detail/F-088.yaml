        section: "observed_vs_expected.facets[0] + docs_cross_referenced"
        cite: "auth.s2s.enabled property name + live /authentication/s2s page"
        note: "No UI; comprehension = property name + docs page; name reads ingestion-shaped, scope is global admin."
    operator_visible_failure: |
      (a) The operator's only signpost at configuration time is the word "S2S" in
