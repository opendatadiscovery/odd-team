- id: H-012
  hypothesis: |-
    "If GET /api/links fails (network error, 401, 5xx) when the user opens the menu, the user sees a
    clear indication that the additional-links section could not load — not a silently-reduced menu."
  derivation: |-
    Product-owner UX seed (Rule 9 — "Does the user understand what is happening?"): a good UI tells the
