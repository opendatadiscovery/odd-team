act:
  - kind: dom-probe
    note: |
      Playwright. Navigate to /management/datasources. Find the row
      'p076-original-name' and click its edit control to open the
      "Edit datasource" modal. Assert the modal title reads "Edit datasource",
      assert the Description input is PRE-FILLED with 'p076 original description
