name: |-
  DataSource delete is an incomplete soft-delete — orphans the token row and leaves the FTS search_entrypoint vector uncleared
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-08
description: |-
  NEW MEDIUM-SEVERITY INVARIANT, batch 2026-05-21ZB — surfaced at
  primary source by the deleteDataSource method-level sidecar. The
  UI-admin delete endpoint DELETE /api/datasources/{data_source_id}
  is a guarded soft-delete that does NOT cascade and does NOT clean
  up adjacent rows. A "successful" delete leaves the catalogue with
  orphaned and stale rows.

  THE DELETE'S ACTUAL SCOPE — what soft-delete touches and what it
  leaves:

    DataSourceServiceImpl.delete (DataSourceServiceImpl.java:85-96,
    @ReactiveTransactional) runs a cascade-guard then an inherited
    soft-delete. The soft-delete (ReactiveAbstractSoftDeleteCRUDRepository.java:50-58
    + getDeleteChangedFields:106-110) sets ONLY `data_source.deleted_at
    = NOW()`. It DOES NOT touch:

      (1) THE TOKEN ROW — orphaned on every delete.
          `data_source.token_id` is a FK to the `token` table
          (V0_0_28__add_token.sql:13). The soft-delete never deletes
          the token row, and the `token` table has NO `deleted_at`
          column (V0_0_28__add_token.sql:1-9) so it cannot even BE
          soft-deleted. No code path GCs orphan tokens — no scheduled
          job, no Flyway migration (Grep-confirmed in the sidecar).
          Each register-then-delete cycle LEAKS one `token` row. This
          is the SAME orphan-token pattern batch W confirmed for the
          Collector delete path. Pinned by probe P-046.

      (2) THE FTS SEARCH VECTOR — left uncleared on delete.
          DataSourceServiceImpl.delete calls NO searchEntrypointRepository
          method — UNLIKE DataSourceServiceImpl.update (lines 127-136)
          which explicitly refreshes the FTS vectors. Whether a
          soft-deleted data source still appears in catalog search
          depends entirely on whether the search query JOINs
          `data_source` with a `deleted_at IS NULL` predicate; if it
          does not, the soft-deleted source remains searchable.
          Pinned by probe P-048.

      (3) HISTORICAL CHILD ENTITIES — left FK-attached to a
          soft-deleted parent. `data_entity_fk_data_source`
          (V0_0_1__init.sql:82) has NO `ON DELETE` clause (Postgres
          default NO ACTION). Once the operator soft-deletes the child
          entities (the prerequisite for the source delete to succeed)
          and then deletes the source, those soft-deleted `data_entity`
          rows still carry `data_source_id` pointing at the
          soft-deleted `data_source`.

  THE TWO SECURITY-RELEVANT CONSEQUENCES:

    (a) STALE-SECRET-AT-REST: the orphan `token` row is a 40-char
        plaintext credential (`token.value varchar(40)`,
        V0_0_28__add_token.sql:4) that persists in the `token` table
        unreferenced after the data source is deleted. A DB-level
        reader, backup, or replica carries a credential that no
        longer maps to any live data source. (deleteDataSource.md
        security.known_security_gaps — orphan plaintext token
        persists.)

    (b) UNBOUNDED TABLE GROWTH: `token` rows accumulate without bound
        across register/delete cycles — a slow table-growth leak.

  WHY THIS IS A DISTINCT INVARIANT (not folded into the soft-delete
  catalogue or the 5-vertex triangulation):

    The platform's `three-soft-delete-mechanisms-across-the-repository-layer`
    invariant catalogues WHICH mechanism each table uses; it confirms
    `data_source` uses `deleted_at`. The
    `datasource-ui-admin-disjoint-from-s2s-five-vertex-triangulation`
    invariant catalogues the cascade-guard. NEITHER names the
    INCOMPLETE-CLEANUP fact — that the delete leaves an orphan token
    and a stale FTS vector. This invariant is the file-local
    cleanup-completeness finding: a "delete" whose name promises
    "remove the data source and its footprint" leaves three classes
    of residue. It pairs with the soft-delete catalogue but is a
    separate concern.

  SEVERITY MEDIUM — the orphan-token stale-secret-at-rest + the
  unbounded `token`-table growth are the load-bearing concerns; the
  uncleared FTS vector is a probe-pending potential stale-search
  surface; the FK-orphaned historical children are a long-term
  schema-hygiene concern (soft-deleted rows are invisible to reads).
