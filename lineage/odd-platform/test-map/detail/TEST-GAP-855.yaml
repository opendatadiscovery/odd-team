proposed_action: |-
  Add `TagRepositoryImplLSN019Test extends BaseIntegrationTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/repository/`. Five test methods that implement the P-010 probe shape as CI-runnable assertions:

  1. **`listMostPopular_directoryExceedsSize_equalUsageCounts_returnsOldestSizeByTagIdAscNotMostPopular_pinsLSN019Drift`** (the headline):
     - Arrange: create 35 tags via `reactiveTagRepository.bulkCreate(35 TagPojos with names 'tag-001'..'tag-035')`; capture their IDs (will be serial → tag-001 has lowest, tag-035 has highest).
     - Create 1 data_entity. For each of the 35 tags, insert a `tag_to_data_entity` row (`external=false`) — every tag has usage_count=1.
     - Act: `reactiveTagRepository.listMostPopular(null, List.of(), 1, 30).block()`.
     - Assert: `page.getData()` has exactly 30 elements. Extract tag IDs. Assert `extractedIds.equals(IDs 1..30 in ascending order)` — i.e. the OLDEST 30, NOT a random 30, NOT the youngest 5 + first 25 oldest. PIN the LSN-019 drift.
     - Add inline comment: "PINS LSN-019 — if a future refactor pushes ORDER BY count INSIDE the paginate window, this test FAILS and forces an explicit coordinated change to spec + docs + UI."

  2. **`listMostPopular_directoryExceedsSize_unevenUsageCounts_returnsOldestSizeReorderedByCountDesc_pinsInnerSelectionOuterSort`**:
     - Arrange: 35 tags created in id-order tag-001..tag-035. The OLDEST 5 (IDs 1-5) get 1 tag_to_data_entity row each (count=1). The OLDEST 25 next (IDs 6-30) get 10 rows each (count=10). The 5 YOUNGEST (IDs 31-35) get 100 rows each (count=100). Total in directory = 35.
     - Act: `listMostPopular(null, List.of(), 1, 30)`.
     - Assert: `page.getData()` has exactly 30 elements. Extract IDs. Assert the response contains IDs 1..30 (the OLDEST 30), NOT 31..35. Then assert the WITHIN-PAGE order is count DESC: tags 6..30 (count=10) come before tags 1..5 (count=1). PIN: the inner-selection-by-id semantics + outer-sort-by-count behavior.

  3. **`listMostPopular_directoryUnderSize_orderByCountDescApplied_pinsHappyPath`**:
     - Arrange: 5 tags created tag-001..tag-005; usage counts 1, 5, 3, 4, 2 respectively.
     - Act: `listMostPopular(null, List.of(), 1, 30)`.
     - Assert: `page.getData()` has 5 elements in count-DESC order: [tag-002, tag-004, tag-003, tag-005, tag-001]. PIN: under directory size ≤ size, the outer ORDER BY count DESC IS effective (the drift only manifests when N > size).

  4. **`listMostPopular_paginatePageTwo_returnsNextSizeWindowByIdAsc_pinsPaginationStrideAcrossLimit`**:
     - Arrange: 60 tags equal-counts.
     - Act: `listMostPopular(null, List.of(), 2, 30)`.
     - Assert: response contains IDs 31..60 in tag.id ASC order. PIN: pagination IS by tag.id ASC across both pages.

  5. **`listMostPopular_withQuerySubstring_appliesNameContainsBeforePagination_pinsListConditionShape`**:
     - Arrange: 20 tags with names "alpha-1..alpha-10" + "beta-1..beta-10".
     - Act: `listMostPopular("alpha", List.of(), 1, 30).block()`.
     - Assert: response contains only alpha-* tags (10 tags), ranked by count DESC since under size. PIN: the listCondition substring filter applies BEFORE the LSN-019 paginate, so the pool of candidates filtered to alpha-* is the entire alpha-* set.

  After landing the test: pair with REFACTOR-NNN (push ORDER BY count INSIDE the paginate window OR update spec + name to match actual semantics) AND DOC-NNN (surface the drift / actual semantics on the Tagging doc + API Reference page).

  **Note for future maintainer**: when REFACTOR-NNN lands and the implementation actually orders by count DESC across the full directory, tests #1, #2, #4 INVERT — the assertion changes from "oldest 30 by id" to "highest-count 30 by count". The test comment makes this inversion the EXPLICIT coordinated-change-required signal.
