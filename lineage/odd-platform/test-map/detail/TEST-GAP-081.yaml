behaviour: '`type=DOWNSTREAM`/`UPSTREAM` paths walk lineage graph WITHOUT any caller-ownership
  filter — anyone authenticated can ask ''what changed upstream of X'' regardless
  of whether they own X. Combined with the global feed cross-owner exposure (TEST-GAP-083),
  the lineage-scoped path is itself a cross-owner audit-trail oracle.'
