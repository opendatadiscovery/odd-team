proposed_action: |-
  Add parametrised test `WithPermissions_hides_create_edit_delete_when_permission_absent` to `OwnersList.test.tsx`. Render with `usePermissions.hasAccessTo` stub: (a) all three return true → assert all three buttons present; (b) only OWNER_CREATE true → assert Create present, Edit + Delete absent on every row; (c) only OWNER_UPDATE → only Edit per row; (d) only OWNER_DELETE → only Delete per row; (e) ALL false → assert ZERO buttons, list rows still render. Pair with `WithPermissions_returns_null_not_disabled_button` assertion (no element with `aria-disabled=true` or `<button disabled>` exists).
