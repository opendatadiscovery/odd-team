- |-
  AppInfoController (class).md:implicit_adrs.[1] (REPORTER not REACTOR — @Value
  vs @ConditionalOnProperty; the controller's job is to REPORT which mode is
  active, not to behave differently)
- |-
  AppInfoController (class).md:implicit_adrs.[2] (expose-mode-hide-provider
  contract — NEW invariant captured at the controller-class layer; AppInfo
  + Identity together form the deliberate 'expose mode, hide provider' design)
- |-
  AppInfoController (class).md:security.known_security_gaps.[0] (REFACTOR-185
  19th sidecar — DISABLED-mode bypass surface enumeration extended to the
