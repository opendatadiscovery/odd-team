proposed_action: |-
  Add `AlertServiceImplActivityAOPTest.updateStatus_emitsActivityEventViaAOP_outsideIntegrationTestProfile_pinsAOPWiring` as a SpringBootTest WITHOUT the `integration-test` profile activated. (a) Inject `ActivityAspect` (the aspect must be active under the non-integration-test profile). (b) Seed an OPEN alert id=A. (c) Authenticate as user U. (d) Invoke `alertService.updateStatus(A, AlertStatus.RESOLVED)`. (e) Assert the activity table contains an `ALERT_STATUS_UPDATED` event with `created_by=U` and `dataEntityId=A.dataEntityId`. (f) Add a `// REGRESSION-PIN — @ActivityLog AOP fires updateStatus's activity event under the default profile but NOT under integration-test (ActivityAspect.java:24 — @Profile(\"!integration-test\")). End-to-end tests under integration-test profile would miss any regression that drops @ActivityLog from updateStatus. This UNIT-LEVEL test under the default profile catches such regressions deliberately. Pair with documentation: warn that integration tests cannot rely on @ActivityLog emission for this AOP-guarded method.` comment block.
