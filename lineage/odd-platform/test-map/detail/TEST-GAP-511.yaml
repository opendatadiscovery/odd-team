behaviour: |-
  Hard-delete race window 500 regression-pin (LOW — P-05). Between `getDEGEntitiesOddrns` (`LineageServiceImpl.java:61`) and `getDataEntityWithDatasourceMap` (`LineageServiceImpl.java:65`), a DEG member entity could be hard-deleted (rare — typically entities are soft-deleted via `DataEntityInternalStateServiceImpl`). If this race fires, the `Optional.orElseThrow` at `LineageServiceImpl.java:169-173` throws `RuntimeException("Entity with oddrn %s wasn't fetched")` with no error-code mapping → generic 500. The race window for hard-deletes is small but the failure mode is unrecoverable for the caller — the operator sees a 500 with no actionable error message. A test pinning the current 500 behaviour exposes the gap; a future refactor adding `.switchIfEmpty(Mono.empty())` to gracefully skip race-deleted entities (treating them as if they had never existed in the snapshot) would flip this test. NO test exists.
