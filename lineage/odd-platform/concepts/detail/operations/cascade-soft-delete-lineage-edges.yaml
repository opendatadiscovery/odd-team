notes: 'NEW operation captured in batch H. Sibling to:

    - the DataEntity STATUS state-machine cascade (DataEntityInternalStateServiceImpl)
  — entity-side soft-delete

    - the ownership hard-delete (ReactiveOwnershipRepositoryImpl) — edge-side hard-delete


  Together these three form the "entity DELETED state propagation" picture: when
  an entity transitions to DELETED, the DataEntity STATUS is flipped, the incident
  lineage edges are soft-deleted, and the ownership edges (if any) are physically
  deleted. The three mechanisms cooperate via the activity-feed audit trail.


  Recommended fixes:


    (1) MEDIUM-leverage: add a partial index on (child_oddrn, is_deleted) WHERE is_deleted
  = false to support the OR-predicate on either-endpoint at lines 95, 105. Closes
  the sequential-scan hazard for soft-delete cascades involving many entity oddrns.


    (2) LOW-leverage: document the soft-delete cascade semantics explicitly on the
  Data Entity Status / Lifecycle live page so operators understand what happens to
  lineage when they delete an entity (and what happens to lineage when they restore
  one).


  Doc-gap candidate: extend the Data Entity Lifecycle live page with a "Cascade behaviours
  on DELETED" subsection covering lineage soft-delete + ownership hard-delete + activity-feed
  emission.

  '
