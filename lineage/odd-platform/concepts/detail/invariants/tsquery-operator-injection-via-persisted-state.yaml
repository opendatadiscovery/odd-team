name: |-
  tsquery operator-injection via persisted state (DoS via every facet aggregator)
canonical_in_docs: false
canonical_candidate: true
pillar_affinity:
  - P-09
  - P-01
description: |-
  NEW INVARIANT, batch 2026-05-19M — JooqFTSHelper.tsQuery at JooqFTSHelper.java:164-168
  does not escape Postgres tsquery operators in user-supplied search query text
  before passing the result to to_tsquery(?) at JooqFTSHelper.java:100-105. The
  function is a per-word splitter:
  Arrays.stream(plainQuery.split(" ")).map(q -> q + ":*").collect(Collectors.joining("&"))
  — every word becomes a "prefix-match" token AND-joined. But if the user-supplied
  query contains tsquery metacharacters that to_tsquery treats as syntax
  (!, (, ), :, <->, &, |, single-quote, backslash), those characters are NOT
  escaped before reaching the Postgres parser. **Two attack surfaces on the
  persisted query_string in search_facets**: (a) **SQL parser DoS via persistent
  corruption** — a caller POSTs a search with query = "foo )( bar"; the row is
  persisted with that query verbatim; every SUBSEQUENT facet aggregator that
  joins to SEARCH_ENTRYPOINT applying ftsCondition(SEARCH_ENTRYPOINT.SEARCH_VECTOR,
  state.getQuery()) fails at to_tsquery parse time with Postgres 42601 syntax
  error in tsquery — the session is permanently broken (the row is reachable
  but every facet read 500s); (b) **silent semantic re-interpretation** — a
  balanced tsquery expression that happens to parse (e.g. "foo & bar | baz")
  re-interprets at to_tsquery time with completely different match semantics
  than the user expected — the response is "wrong but not failing". **Reached
  from FIVE distinct invocation sites** in the facet aggregator suite at
  ReactiveSearchFacetRepositoryImpl.java:182 (entity-class), :267 (type),
  :339-407 owner aggregator ftsCondition site, :469 (group), :582 — every
  facet GET triggers the same parse path. The injection is bounded by Postgres
  tsquery semantics (the parser does not eval SQL — it raises 42601), but it
  IS a denial-of-service surface AND it is the SAME code path that batch H
  flagged on getHighlightedResult. The facet endpoints are SECOND, THIRD, FOURTH,
  FIFTH, SIXTH invocation sites for the same bug. **Severity**: HIGH.

  ## STRENGTHENED batch ZE (2026-05-25) — SearchController class-level

  Batch ZE adds the SearchController class-level confirmation that
  brings the picture to a SEVENTH and EIGHTH invocation site:
    (g) ReactiveDataEntityRepositoryImpl.findByState:651-727 (the
        getSearchResults SQL — applies ftsCondition on every paginated
        result page when state.getQuery() is non-empty);
    (h) ReactiveDataEntityRepositoryImpl.getQuerySuggestions:470-513
        (the getSearchSuggestions autocomplete — applies ftsCondition
        on every 500ms-debounced keystroke).

  The class-level controller surface confirms the persisted-query
  semantic at the controller tier: search-session creation
  (SearchController.search) persists the raw user-typed query
  WITHOUT validation; the persisted query is then
  reached by every subsequent endpoint:
    - getSearchResults (per-page paginated list);
    - getSearchFacetList (aggregate counts);
    - updateSearchFacets (merge + recompute);
    - getFiltersForFacet (facet-option drill);
    - highlightDataEntity (TRUE SQL injection via .formatted
      compounding the tsquery DoS path — see
      get-highlighted-result-formatted-sql-injection).

  The ONE missing validation site (controller-tier 400 rejection)
  would close all 8+ invocation surfaces at the source.

  ## STRENGTHENED — batch ZL (2026-05-26) — Search.tsx UI ENTRY SURFACE confirmed

  Batch ZL adds the Search.tsx primary-source sidecar
  (odd-platform__ts__react-component__component__Search.md)
  confirming the user-typed search-query text reaches the
  injection chain UNSANITISED at the UI layer. Search.tsx is
  the FIRST entry surface where the bug is operator-reachable.

  Search.md:bugs_limitations_corner_cases.[8] — "FTS-injection:
  typed search-query text passes UNESCAPED through to to_tsquery(?)
  — REFACTOR-229 user-controlled query text — NO client-side
  sanitisation here. MainSearchInput.tsx:43-44 builds
  searchFormData = {query, pageSize:30, filters:{}} and dispatches
  verbatim. Server-side JooqFTSHelper.tsQuery at
  JooqFTSHelper.java:164-168 performs ... NO escaping of tsquery
  metacharacters (!, (, ), :, <->, &, |, ', \\). A typed query
  of `foo ) | (bar` reaches to_tsquery(?) and Postgres raises
  42601 syntax error in tsquery. The session UUID is then
  permanently poisoned... The UI offers ZERO mitigation — no
  max-length, no metacharacter filter, no client-side to_tsquery
  validation." Severity HIGH.

  Search.md:security.known_security_gaps describes the
  Search.tsx UI sidecar as the UI HALF of the REFACTOR-229
  security finding — combined with REFACTOR-344 (no user
  binding on search_facets) the poisoned UUID can be shared as
  a DoS vector.

  P-188 probe emitted (Search.tsx) for end-to-end confirmation
  of the session-poisoning chain.

  POST-BATCH-ZL INVOCATION SITES: still 8 (no new sites added by
  batch ZL — Search.tsx is the operator-facing entry point, not
  a new aggregator). But the FIX is now both UI + backend:
    - Backend (server-side tsquery escape at JooqFTSHelper.tsQuery)
      remains the architectural fix point.
    - UI (client-side max-length + warning at MainSearchInput) is
      a defence-in-depth complement.


