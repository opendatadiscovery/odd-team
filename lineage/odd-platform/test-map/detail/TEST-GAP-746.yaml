behaviour: |-
  **LOW — `OwnerAssociationRequestController` has ZERO controller-tier HTTP test coverage across all 7 endpoints — a SecurityConstants editing error or an OpenAPI path-slug change would silently break the authorization wiring with no test catching it.** Primary-source confirmed in the batch-V OwnerAssociationRequestController sidecar:

  **The 7 untested endpoints**:
  - `createOwnerAssociationRequest` (POST `/api/owner_association_request`) — NO SecurityRule
  - `listOwnerAssociationRequests` (GET `/api/owner_association_request`) — OWNER_ASSOCIATION_MANAGE
  - `getOwnerAssociationRequestActivityList` (GET `/api/owner_association_request/activity`) — NO SecurityRule (per TEST-GAP-736)
  - `updateOwnerAssociationRequest` (PUT `/api/owner_association_request/{id}`) — OWNER_ASSOCIATION_MANAGE
  - `createUserOwnerMapping` (POST `/api/owners/mapping`) — OWNER_RELATION_MANAGE
  - `deleteActiveUserOwnerMapping` (DELETE `/api/owners/mapping/{id}`) — OWNER_RELATION_MANAGE
  - `getAuthProviders` (GET `/api/owners/providers`) — NO SecurityRule

  **The 5 distinct regression classes the missing test surface fails to catch**:
  1. A SecurityConstants editing error removing one of the 4 entries → endpoint silently de-authorized → any authenticated user can call.
  2. An OpenAPI spec change flipping `owner_association_request` (snake_case) to `ownerAssociationRequest` (camelCase) breaking the path-pattern matcher → the path becomes unauthenticated by default → endpoint silently de-authorized.
  3. A path renamed in the spec but not in SecurityConstants → similar silent de-authorization.
  4. A new endpoint added to the OpenAPI spec but not added to SecurityConstants → no gate at all.
  5. DIRECT_OWNER_SYNC auto-approve branch (per TEST-GAP-729) untested → a refactor at OwnerAssociationRequestServiceImpl.java:64-67 could silently change the auto-approve semantics.

  **Why LOW not MEDIUM**: the controller-tier HTTP-floor gap is a generic "test-coverage shape" finding; the SPECIFIC vulnerabilities the missing tests would catch are covered separately by TEST-GAP-729 + TEST-GAP-736 + TEST-GAP-737. THIS gap is the cumulative HTTP-tier-floor finding (5 endpoints have specific gaps + 2 endpoints have only the generic floor gap). LOW because the higher-severity vulnerabilities are tracked in dedicated gap entries; this entry consolidates the HTTP-floor pattern.

  **Test gap shape**: `@WebFluxTest(OwnerAssociationRequestController.class)` covering all 7 endpoints + the SecurityConstants path-pattern wiring assertion (a separate test that enumerates the canonical 5 path-pattern entries and asserts they resolve to the canonical 5 permission keys).
