mitigations_unimplemented:
- |-
  Coordinated multi-layer fix: introduce token hashing across ALL
  FIVE layers in a single migration window:
    (1) V0_NNN migration adding `token.value_hash varchar(64)`
        column; backfill from existing rows using BCrypt or
        Argon2id; eventually drop `token.value` after migration
        cycles
    (2) TokenGeneratorImpl: write the HASH, return the PLAINTEXT
        to the UI for one-shot display
    (3) ReactiveTokenRepositoryImpl: persist the hash + the
        plaintext-display flag with TTL
    (4) ReactiveCollectorRepositoryImpl.getByToken: hash the
        inbound token at the SQL level (use `digest()` Postgres
        extension OR perform the hash in Java before the WHERE
        match)
    (5) IngestionDataEntitiesFilter: hash inbound before .equals
    (6) CollectorMapper: continue masking the response
  HIGH-scope migration; touches every layer of the auth path; tests
  must cover the cross-layer behaviour to catch the
  test-fixture-uses-UUID-randomString assumption.
- |-
  Lower-scope intermediate fix: add a UNIQUE constraint on
  `token.value` to defend against the cross-collector token-sharing
  race. Even with plaintext storage, the UNIQUE constraint
  guarantees `getByToken(token)` returns at most one row.
- |-
  Add an index on `token.value` to make `getByToken` cheap. Today
  the JOIN condition is index-supported (token.id is PK; the
  TOKEN.VALUE.eq predicate falls back to sequential scan). For
  small deployments this is negligible; for 10K+ collector
  deployments the lookup becomes O(N).
- |-
  Use a CSPRNG: replace `RandomStringUtils.randomAlphanumeric(40)`
  with `RandomStringUtils.secure().nextAlphanumeric(40)`. Single-line
  change; eliminates the ThreadLocalRandom dependency; tokens
  become cryptographically random.
- |-
  Add a housekeeping job removing orphan TOKEN rows (rows where
  `id NOT IN (SELECT token_id FROM collector WHERE deleted_at IS
  NULL)`). Bounds the credential exposure surface to live
  collectors only.
- |-
  Add `@ActivityLog` on `CollectorServiceImpl.regenerateToken` +
  introduce a `COLLECTOR_TOKEN_REGENERATED` event in
  `ActivityEventTypeDto` (requires the F-006-audit-silence
  schema-rooted invariant to be resolved FIRST — adding the event
  type won't help if the activity table FK precludes the row).
- |-
  Document the plaintext-everywhere posture and the operator-side
  mitigations (encrypt-at-rest at the disk/volume layer; restrict
  pg_dump access; restrict replica access; ensure TLS between
  platform and collector) on the
  `/configuration-and-deployment/enable-security/authentication/server-to-server`
  live page. Today the page is silent on the storage shape —
  operators cannot infer the threat model from the doc alone.
- |-
  UI-side defence: replace the direct `<Token>{collector.token.value}</Token>`
  render with `<input type='password' readOnly />` AND a Reveal
  button (one-shot, dismissible). Even if the backend cannot be
  changed, the UI-tier defence reduces the browser-cache /
  screen-reader / screenshot exposure significantly.
notes: |-
  This invariant captures the FIRST end-to-end exposure chain for
  the bearer-token authentication model — combining the SQL tier
  (batch R), the controller tier (batch B), the filter tier (batch
  O), the UI tier (batch Q), and the schema tier (V0_0_28 + V0_0_33)
  into a single architectural picture. The triangulation across
  FOUR PRIOR SIDECARS + the new batch R primary source surfaces
  ONE LOAD-BEARING DECISION (the plaintext-everywhere assumption
  per ReactiveCollectorRepositoryImpl batch R implicit_adrs.[0])
  that REQUIRES coordinated multi-layer remediation.

  **This is also the FIRST documented instance of a SECURITY
  INVARIANT that spans SQL → UI tiers via SHARED PLAINTEXT
  representation** (other security invariants in the catalog —
  e.g. provider-null-cross-mode-bleed — span service → repository
  layers but stop at the persistence boundary). The token model
  uniquely traverses the UI tier as plaintext.

  Cross-cutting connections:
    - Pairs with the plaintext-equality-shared-secret-token-model
      invariant — that invariant captures the WRITE/VERIFY pair
      across regenerateToken + IngestionDataEntitiesFilter; this
      invariant ADDS the SQL-tier primary source + the UI-tier
      DOM-render finding + the orphan-TOKEN finding to map the
      complete chain
    - Pairs with the plaintext-token-rendered-into-dom-fragile-substring-prefix-sniff-masking
      invariant — that invariant captures the UI-tier hazards in
      isolation; this invariant connects them to the SQL-tier
      substrate
    - Pairs with the F-006 audit-silence schema-rooted invariant —
      both are HIGH-severity security findings on the Collector
      surface; neither can be remediated by single-layer fixes
    - Pairs with the two-ingestion-filters-asymmetric-auth invariant
      — the IngestionDataSourceFilter is ALWAYS-ON; the SQL bridge
      via getByToken IS this filter's auth check; documenting the
      filter without documenting the SQL-tier plaintext storage
      leaves operators with incomplete threat-model awareness

  Five DOC-NNN candidates flow from this invariant:
    (a) Document the token-storage shape (plaintext varchar(40),
        no UNIQUE, no hashing) on the operator-facing
        configuration-and-deployment/enable-security page —
        operators need to know the threat model
    (b) Document the always-on IngestionDataSourceFilter
        asymmetry (filter-class-vs-config-key relationship — the
        SECURITY FILTER ON DATASOURCE REGISTRATION IS ALWAYS-ON
        irrespective of auth.ingestion.filter.enabled)
    (c) Document the rotation contract (in-place UPDATE, no
        overlap window, no audit) on the Collectors tab
        operator-facing docs — operators planning rotations
        need to know the no-grace-period semantic
    (d) Document the orphan-TOKEN cleanup task as an operator
        playbook (`DELETE FROM token WHERE id NOT IN (SELECT
        token_id FROM collector WHERE deleted_at IS NULL)`) —
        long-running deployments accumulate orphaned credentials
    (e) Document the proposed multi-layer hashing migration in an
        ADR (the maintainer should decide: accept the plaintext
        model as deliberate trade-off with explicit ADR, OR
        commit to the migration path with concrete dates)
