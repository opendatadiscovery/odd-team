behaviour: Two-branch dispatch refactor risk — `type=null` (`if (type == null)`) and
  `type=ALL` (`case ALL`) both lead to `fetchAllActivities`; a future refactor that
  adds owner-scoping to the ALL enum case without also handling the null case would
  silently bypass the new gate (ActivityServiceImpl.java:103-115).
