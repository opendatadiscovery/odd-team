proposed_action: |-
  Add `FourSisterServiceNamespaceCreateSideDoorTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. SIX test methods (one per Term-side + four BATCH W sister sites):
  1. `createTerm_withNeverSeenNamespaceName_succeedsForUserHoldingTermCreateButNotNamespaceCreate` — authenticate as a user with TERM_CREATE on the target namespace BUT NO NAMESPACE_CREATE; POST `/api/terms` with `namespaceName: 'fresh-namespace-' + UUID.randomUUID()`; assert 200/201 AND assert `SELECT COUNT(*) FROM namespace WHERE name = ?` returns 1. PIN the Term-side bypass.
  2. `updateTerm_withNeverSeenNamespaceName_succeedsForUserHoldingTermUpdateButNotNamespaceCreate` — Term-side update path.
  3. `createTermTagsRelations_withNeverSeenTagNames_succeedsForUserHoldingTermTagsUpdateButNotTagCreate` — Term-side TAG_CREATE bypass.
  4. **BATCH W ADDITION — `registerDataSource_withNeverSeenNamespaceName_succeedsForUserHoldingDataSourceCreateButNotNamespaceCreate`** — file:line-anchored at DataSourceServiceImpl.java:57 per TEST-GAP-751. POST `/api/datasources` with `namespaceName: 'fresh-' + UUID`; assert namespace IS created.
  5. **BATCH W ADDITION — `registerCollector_withNeverSeenNamespaceName_succeedsForUserHoldingCollectorCreateButNotNamespaceCreate`** — file:line-anchored at CollectorServiceImpl.java:43.
  6. **BATCH W ADDITION — `createDataEntityGroup_withNeverSeenNamespaceName_succeedsForUserHoldingDataEntityGroupCreateButNotNamespaceCreate`** — file:line-anchored at DataEntityGroupServiceImpl.java:65.

  Pair with a follow-up backlog item proposing a SERVICE-LAYER fix: split `getOrCreate` into `get + create`, require the caller to hold the dedicated `*_CREATE` permission for the create branch. When the fix lands, tests #1-#6 invert to assert 403 unless the dedicated permissions are granted.

  Cross-pair with a documentation fix: surface the side-door in `documentation/docs/features/data-glossary/business-glossary.md`, `documentation/docs/features/management.md` (Datasources + Collectors + DEGs tabs), and `documentation/docs/configuration-and-deployment/enable-security/authorization` — operators authoring RBAC policies see the current ground truth across ALL 4 sister surfaces. Without the doc note, RBAC architects authoring policies cannot avoid the cliff.
