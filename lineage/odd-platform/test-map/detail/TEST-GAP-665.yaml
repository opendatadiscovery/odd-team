proposed_action: |-
  Testcontainers integration test. (a) Ingest a 10-column dataset via the IngestionService pipeline. (b) Ingest 5 successive ingestion calls each renaming ONE column (5 schema-version forks). (c) Query raw `SELECT COUNT(*) FROM dataset_field WHERE oddrn LIKE '%/test_dataset/%'`. (d) Assert row count = 15 (the original 10 + 5 new rows for the 5 renames; the OLD rows for the renamed columns are preserved). (e) Assert NO housekeeping job has touched the table: query `SELECT COUNT(*) FROM dataset_field WHERE id NOT IN (SELECT dataset_field_id FROM dataset_structure)` — assert 0 (the orphan-search yields no orphans because every dataset_field is still linked to at least one dataset_version). (f) Pin the architectural choice with a comment: `// REGRESSION-PIN — Schema evolution creates NEW dataset_field rows (DatasetFieldServiceImpl.buildDatasetFieldIngestionDto:375-396). The OLD rows are preserved indefinitely (no cleanup job, no soft-delete). REFACTOR-NNN will introduce DatasetFieldOrphanHousekeepingJob; this test will then flip to assert the cleanup behaviour.`
