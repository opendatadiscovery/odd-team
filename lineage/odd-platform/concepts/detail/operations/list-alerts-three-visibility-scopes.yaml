name: List Alerts (three visibility scopes)
canonical_in_docs: true
canonical_candidate: false
description: |-
  GET /api/alerts (All), GET /api/alerts/my (owner-scoped), GET /api/alerts/dependents
  (lineage-downstream-of-owned). Paged via Page+Size query params. Backed by AlertController.getAllAlerts
  / getAssociatedUserAlerts / getDependentEntitiesAlerts; specified by openapi-tag:alert;
  UI surfaces via alerts route's `all`/`my`/`dependents` sub-paths. getAllAlerts method-level
  sidecar confirms the All path is fall-through-authenticated() with no owner predicate
  at the repository — admin-path-without-admin-gate.

  ## STRENGTHENED — batch ZL (2026-05-26) — Alerts.tsx UI ORCHESTRATOR PRIMARY-SOURCE

  Batch ZL adds the Alerts.tsx page-component sidecar
  (odd-platform__ts__react-component__component__Alerts.md) —
  the UI ORCHESTRATOR primary source for this backend operation.
  Alerts.tsx is the operator-visible page-root that surfaces
  these three visibility scopes as the three tabs (All / My
  Objects / Dependents).

  THE UI-LAYER COMPLEMENT:
    - Alerts.tsx:15-17 — single useEffect dispatches
      fetchAlertsTotals at mount (Mono.zipDelayError of
      allCount + countByOwner + countDependent = three
      parallel COUNT queries).
    - AlertsRoutes.tsx:12-17 — three Routes mapping
      /all → AlertsList(fetchAllAlertList);
      /my → AlertsList(fetchMyAlertList);
      /dependents → AlertsList(fetchMyDependentsAlertList).
    - AlertsTabs.tsx:30-37 — My Objects + Dependents tabs
      HIDDEN when getOwnership returns falsy.
    - alerts.slice.ts:42-49 — three thunks share the SAME
      state.alerts.items slot via updateAlerts reducer.
    - AlertsTabs.tsx:44-46 — tab navigation dispatches
      changeAlertsFilterAction (CLEAR items=[]) before the
      new tab's fetch fires.

  UI-LAYER FINDINGS THAT THIS BACKEND OPERATION INHERITS:
    - `invariant:alerts-all-tab-name-vs-implementation-drift-open-only`
      — HIGH severity Category B drift (docs promise
      open+resolved; SQL filters OPEN only).
    - `invariant:alerts-resolve-button-rendered-before-permission-check-ux-leak`
      — MEDIUM severity UX leak (Resolve button visible to
      users who cannot resolve).
    - `invariant:alerts-tab-badge-totals-stale-mount-fetch-only`
      — MEDIUM severity UX (badges fetched once, never refreshed).

  CROSS-OPERATION RELATIONSHIPS:
    - Pairs with `operation:mount-alerts-page-shell-three-tab-shared-state-slot`
      (the UI orchestrator operation — new in batch ZL).
    - Pairs with `entitie:alerts-page-root-three-tab-shell`
      (the canonical UI entity — new in batch ZL).
    - Pairs with `entitie:alert` (the canonical Alert entity).


