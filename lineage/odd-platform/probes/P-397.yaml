expected_outcome: |
  Stress question (Category A, the `'DISABLED'` magic string; Category E, the react-query cache):
  the shared-bucket disclosure — the `(shared)` label AND the inline-help sentence that carries the
  CONSEQUENCE ("anyone on this instance can see and remove these stars") — is gated on
  `appInfo?.authType === 'DISABLED'` (FavoritesFilter.tsx:36-37). `appInfo` comes from
  `useAppInfo()`, a react-query `useQuery(['appInfo'])` (lib/hooks/api/appInfo.ts:4-9) on a client
  configured with `retry: false` and NO `staleTime` / `initialData`
  (index.tsx:30-48). So `data` is `undefined` (a) on every cold mount until `GET /api/info`
  resolves, and (b) FOREVER if that single attempt fails.

  In both windows `isShared` evaluates to `false`, which is the SAME value a properly authenticated
  instance produces. The disclosure therefore fails OPEN: the absence of the warning is
  indistinguishable from "auth is on, your favorites are private".

  Two hypotheses, one probe:
    H1 (transient) — a cold hard-load of /search under AUTH_TYPE=DISABLED first paints
       "Favorites only" with no info icon, then flips to "Favorites (shared) only" + icon once
       /api/info resolves.
    H2 (fail-open, the load-bearing one) — when /api/info fails, the control renders
       "Favorites only" with NO info icon and NO error, on an instance where every caller shares
       one favorites bucket. The operator is told nothing.

  R10 of the approved spec (contributor/CTRIB-061.md section 4) is explicitly about not losing the
  retired tab's warning banner in the move to a filter. This probe measures whether the replacement
  actually survives an /api/info outage — the one condition under which the banner it replaced,
  being static page copy, could not have failed.
