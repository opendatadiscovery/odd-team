behaviour: |-
  **`SchedulingConfiguration.java:22` explicitly calls `.usingDbTime()` on the `JdbcTemplateLockProvider` builder** — without this call the provider uses JVM-side `Instant.now()` for `lock_until` / `locked_at` timestamps, which means two replicas with skewed clocks would write different lock_until values and the lock semantics would be vulnerable to clock drift. The explicit call IS the multi-replica safety mechanism for clock-skew tolerance.

  The contract is invisible to operators reading the docs page; the live config-and-deployment page does not mention `.usingDbTime()` or its clock-skew implications. A refactor that swapped the LockProvider implementation (e.g. JDBC → Redis) or that re-wrote the JdbcTemplateLockProvider construction would silently lose `.usingDbTime()` without any test catching the regression. Subsequent multi-replica deployments would become vulnerable to split-brain lock decisions under clock skew between JVMs.

  Test gap shape: integration test querying the `shedlock` table mid-cycle and asserting `lock_until` is close to PG's `current_timestamp + lockAtMostFor`, NOT close to the JVM's `Instant.now() + lockAtMostFor`. The difference is only observable if the JVM clock is artificially skewed — but the pin can be done indirectly by:

  1. Verifying the LockProvider bean is exactly `JdbcTemplateLockProvider` and not a custom subclass.
  2. Running a `@SchedulerLock(name = "test", lockAtMostFor = "10s")` test, sleeping 1 second after acquisition, then asserting `SELECT EXTRACT(EPOCH FROM (lock_until - NOW())) FROM shedlock WHERE name = 'test'` returns ~9 seconds (lock_until is anchored to PG-time at acquisition, not relative to JVM's slightly-later current time).
