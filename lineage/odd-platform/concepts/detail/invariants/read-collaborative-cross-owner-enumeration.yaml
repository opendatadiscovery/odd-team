description: |-
  **STRENGTHENED INVARIANT, batch 2026-05-13G — 5-sidecar; ADR-CANDIDATE-003
  RESOLVED as DELIBERATE; batch 2026-05-19H — 8-sidecar with two repository-layer
  SQL primary-source confirmations; batch 2026-05-19I — 11-SIDECAR with FOUR
  service-layer service-tier confirmations; batch 2026-05-19J — 14-SIDECAR with
  THREE UI-LAYER REALISATION-POINT CONFIRMATIONS** — Repository-wide read-side
  posture: GET / read-shaped endpoints fall through to `pathMatchers('/**').authenticated()`
  and return data across owners with no owner predicate. **FOURTEEN corroborating
  surfaces** all share the same admin-path-without-admin-gate failure mode:
  (a) `getAllAlerts`; (b) `getActivity`; (c) `search`; (d) `getDataEntityDownstreamLineage`;
  (e) `getDataEntityDetails` (CENTERPIECE READ); (f) `ReactiveAlertRepositoryImpl.listAllWithStatusOpen`
  (REFACTOR-024 SQL); (g) `ReactiveLineageRepositoryImpl.getLineageRelations`
  (REFACTOR-203 SQL — graph-shaped enumeration sink); (h) `ReactiveDataEntityRepositoryImpl`
  (every list-shape method lacks principal/owner parameter); (i) `DataEntityServiceImpl`
  (10 of 22 public methods owner-unaware); (j) `AlertServiceImpl` (listAll +
  getTotals.total + getDataEntityAlerts BYPASSES); (k) `LineageServiceImpl`
  (NEGATIVE-CASE SIBLING — no anchor-set defence-in-depth); **(l) `DataEntityDetails`
  React component (batch J — UI REALISATION POINT)** — dispatches `fetchDataEntityDetails`
  for any `dataEntityId` without client-side authorization; no UI affordance
  surfaces that the user is reading another owner's entity (no banner, no
  permission-aware redirect, no soft-gate prompt); the component is the front-end
  embodiment of the read-collaborative posture; **(m) `fetchDataEntityDetails`
  redux-thunk (batch J — UI REALISATION POINT)** — passes only `{ dataEntityId }`
  to the API, no client-side owner / namespace / role filter; the cross-confirmation
  thunk of the platform's read-collaborative posture; **(n) `LineageGraph` React
  component family (batch J — UI REALISATION POINT)** — fetches via the
  NEGATIVE-case lineage endpoints (`/lineage/downstream` + `/upstream`), NOT the
  owner-scoped `/my` variants; the user-observable consequence of REFACTOR-203
  is realised at this canvas; any authenticated user can click the Lineage tab on
  any entity and enumerate the full reachable subgraph. **Live docs do not warn
  about this posture on any of the surfaces**. The pattern is the platform's
  deliberate stance (ADR-CANDIDATE-003 — read-collaborative tradeoff: ODD's
  catalog is intentionally cross-owner-readable to facilitate cross-team
  collaboration). Batches F/H/I confirmed the posture is uniform end-to-end
  (HTTP → service → SQL). **Batch J confirms the posture is uniform UI → API →
  service → SQL** — the UI provides no compensating defence, no permission-aware
  UI, no owner-scoping toggle.
