mitigations_unimplemented:
  - |-
    Fix the TermSearch instance — apply remediation option (a), (b),
    or (c) from the description. Recommended: option (b) useMemo with
    stable deps + read facet state at dispatch time. Closes the bug
    AND preserves the leading-edge UX intent.
  - |-
    Pin the fix with a Vitest + react-testing-library test asserting
    'rapidly clicking 5 facets in 2 seconds dispatches updateTermSearch
    EXACTLY ONCE (or twice with leading-edge intent)'. Fails today
    (5 dispatches); pins the fix as regression.
  - |-
    Promote the live LSN-017 probe shape (per the LSN-017 measurement-truth
    principle) to count PUT /api/termsearch/searchId requests per N
    facet clicks in M seconds. Empirically pin the buggy count, then
    re-run after the fix to confirm the flip. Stronger evidence than
    the static-reading-only inference.
  - |-
    Audit batch follow-up — enumerate every useDebouncedCallback +
    debounce call across odd-platform-ui/src. Verify the deps array
    discipline at each site. Candidates: Search.tsx, PolicyList,
    RolesList, OwnersList, CollectorsList, DataQuality dashboard,
    etc. Each likely-buggy site warrants its own invariant entry if
    the pattern is reproduced.
  - |-
    Add a custom ESLint rule (extension of react-hooks/exhaustive-deps)
    that flags useCallback wrapping useDebouncedCallback when the
    useCallback deps include any value that flips on the debounced
    handler's downstream state. Prevents recurrence.
  - |-
    Document the safe useDebouncedCallback pattern in
    /odd-platform-ui/src/lib/README.md or sibling. Define the
    convention: use useDebouncedCallback ONLY with stable deps
    (refs OR memoised constants); read non-stable state inside the
    handler body via getState or ref.
notes: |-
  NEW invariant captured in batch 2026-05-20U from the TermSearch
  sidecar's primary-source examination of the debouncer wiring.
  The pattern is a known React anti-pattern but THIS is the first
  primary-source instance the substrate has surfaced — making it a
  good seed for a platform-wide audit follow-up.

  Cross-cutting connections:
    - Pairs with the LSN-018 retrospective on per-node-scan limitations
      — the debouncer bug is visible within ONE component but its
      cumulative cost depends on dispatch frequency that NO per-node
      scan would measure
    - Pairs with cross-component-fetch-duplication-shell-plus-tab-double-fire-hot-path
      (batch U sibling invariant) — both invariants capture per-action
      backend-cost multipliers, different shapes
    - Pairs with the LSN-017 measurement-truth principle — a live
      probe is the right tool to pin the buggy count and verify the
      fix

  Three DOC-NNN candidates flow from this invariant:
    (a) Code fix — TermSearch.tsx debouncer (one component, one PR)
    (b) Platform audit follow-up — enumerate other debouncer sites;
        each likely buggy site warrants verification
    (c) Convention doc + lint rule — prevent recurrence of the
        useCallback-wrapping-useDebouncedCallback pattern

  ## Cross-batch coherence (post-batch-ZL):
    - Two primary instances confirmed (TermSearch batch U + Search
      batch ZL). The audit is COMPLETE for the data-entity-catalog
      and term-catalog search-session-orchestrator pair.
    - LookupTables.tsx PROBE-NEEDED — its search uses SearchInput
      onSearch (shared infra) rather than useDebouncedCallback
      inline; verification requires inspecting SearchInput
      component.
    - Management list debouncers (PolicyList / RolesList /
      OwnersList / CollectorsList) NOT yet primary-source
      verified for this specific pattern.
