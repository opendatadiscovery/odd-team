proposed_action: |-
  Author SearchControllerHighlightSqlInjectionIntegrationTest as a
  @SpringBootTest + WebTestClient harness that:
  (a) POSTs /api/search with a body containing a crafted query [exploit
  payload withheld from this public workspace - private advisory GHSA-rjp9-9vgm-q94c] and captures the returned searchId;
  (b) GETs /api/search/{searchId}/data_entities/{any_de_id}/highlights;
  (c) asserts that no out-of-band SQL effect occurred (no pg_sleep delay,
  no DDL artifact, no row mutation) AND that the response is either a
  clean 4xx or a 200 with safely-escaped highlight markup.
  Add a sibling test for a maliciously-named data entity (e.g. ingested
  with `external_name = "X', NULL); --"`) that flows into the `text`
  argument. The test is RED today — it serves as regression-pin until
  the .formatted() call is replaced per TEST-GAP-316.proposed_action.
