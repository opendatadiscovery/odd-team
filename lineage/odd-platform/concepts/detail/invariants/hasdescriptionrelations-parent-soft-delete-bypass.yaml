mitigations_unimplemented:
- |-
  Decide on the corner-case semantic explicitly. Two options:
    (Option A) Strict guard — change line 415 + 425 to NOT filter
      STATUS != DELETED. Result: a Term mentioned only in soft-deleted
      entities CANNOT be renamed/deleted until the entities are
      hard-deleted (a permission that today operators don't have via
      the UI — hard-delete is housekeeping-driven via TTL). This
      prevents the dangling-reference-on-restore case but blocks
      catalog cleanup until housekeeping fires.
    (Option B) Cleanup workflow — keep the current filter but add a
      post-restore reconciliation step that rewrites any
      [[ns:renamed-term]] references AND surfaces a UI warning to
      operators restoring entities whose descriptions contain known-
      missing terms. Higher scope; preserves the catalog-cleanup UX.
- |-
  Document the corner case on the business-glossary doc page —
  operators need to know that renaming or deleting a Term while it is
  mentioned only in soft-deleted entities is silently permitted, and
  that restoring the entity later produces dangling references.
- |-
  Add a regression test pinning the corner case:
    (a) Create a Term;
    (b) Create a Data Entity, set description to "[[ns:term]] is
        mentioned here";
    (c) Soft-delete the Data Entity (STATUS → DELETED);
    (d) Call hasDescriptionRelations(termId) — assert FALSE (current
        behaviour);
    (e) Delete the Term — assert it succeeds;
    (f) Restore the Data Entity (STATUS → DRAFT);
    (g) Read the description — assert the `[[ns:term]]` text is
        present but unlinked.
- |-
  Add a UI warning on the entity-restore action when any of the
  entity's descriptions contain unresolvable [[ns:term]] mentions.
- |-
  Add an audit-script for operators that lists all Terms whose mentions
  exist only in soft-deleted entities — gives the operator visibility
  into the "safe to delete?" question.
notes: |-
  NEW MEDIUM-severity invariant captured in batch 2026-05-19N. The bug
  is a deliberate-by-design corner case — the maintainer chose to
  permit Term-catalog cleanup after entity-deletion waves, accepting
  the dangling-reference-on-restore consequence. The gap is in the
  documentation, not the code.

  The asymmetric semantic (STATUS for data-entity branches, deleted_at
  for term-to-term branch) reflects the platform's broader three-soft-
  delete-mechanisms architectural inconsistency — different soft-delete
  shapes lead to different read-time semantic decisions.

  Cross-cutting connections:
    - Pairs with term-to-term-deleted-at-schema-drift-v0_0_76-vs-v0_0_91
      (batch N) — both findings stem from the same repository file
      and the same architectural-class hygiene gap
    - Pairs with three-soft-delete-mechanisms-across-the-repository-layer
      (batch H — strengthened batches L + N) — the different mechanisms
      lead to the corner-case asymmetry
    - Pairs with Term Linkage entity — the
      `hasDescriptionRelations` guard is a load-bearing component of
      the term-linkage feature; its corner case affects the linkage's
      rename/delete protection
    - Cross-references TermServiceImpl batch K which already records
      the broader update-without-rename bypass; this batch-N finding
      surfaces a DIFFERENT bypass class (parent-soft-delete) on the
      same guard

  Two DOC-NNN candidates flow from this invariant:
    (a) Document the corner case on business-glossary OR fix the
        guard (Option A)
    (b) Add the regression test pinning the corner case
