    verdict: confirmed
    actual_behavior: |-
      GoogleLogoutSuccessHandler.java:43-54 POSTs to https://oauth2.googleapis.com/revoke;
      GithubLogoutSuccessHandler.java:51-63 issues DELETE /applications/{client_id}/grant
      (revokes ALL tokens for the user+app pair). Both perform genuine server-side
      revocation in addition to local WebSession invalidation. The live doc now states
      this verbatim ("GitHub … DELETE /applications/{client_id}/grant"; "Google … POSTs
      to oauth2.googleapis.com/revoke").
