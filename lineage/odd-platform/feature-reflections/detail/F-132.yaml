- id: H-011
  hypothesis: "When a snippet's linkages change on another page (e.g. a colleague detaches a dataset on the data-entity page) while this details page is open, the Linked Entities tab and its count badge update to reflect the change without a full page reload."
  derivation: "Negative-space + multi-user collaboration — the page fetches once at mount and never re-fetches on tab switch; a product owner asks whether the view goes stale when the underlying linkages mutate elsewhere."
  seed_source: negative-space
  validation:
    verdict: probe-needed
    actual_behavior: |-
      Static trace: the details payload is fetched ONCE at container mount and tab switches are zero-fetch
      re-renders (feature-flow amplification_factor STATIC=1; cardinality_per_call: 0 fetches per tab
      switch). The hint badges are derived from that same cached payload. So a linkage change made on the
      data-entity page or term page AFTER this details page mounted would NOT be reflected on the open
      details page (tab, table, and badge all read the stale cached payload) until a full re-fetch — which
      the static evidence says does not happen on tab switch. The EXACT staleness window (does react-query's
      default cache invalidation or a window-focus refetch re-pull the details on tab focus / window refocus?)
      depends on the useGetQueryExampleDetails react-query options (staleTime / refetchOnWindowFocus), which
      are NOT captured in any sidecar (no enriched UI sidecar exists). Requires a runtime probe to confirm
      whether the view self-heals on refocus or stays stale until manual reload.
    evidence:
      - sidecar: "(feature-flow primary-source) F-132 terminal_side_effect + amplification_factor_provenance"
        section: "terminal_side_effect (0 fetches per tab switch) + amplification_factor_provenance (single fetch at mount)"
        cite: "QueryExampleDetailsContainer.tsx:74-94 + QueryExampleDetailsTabs.tsx:15-33"
        note: "single fetch at mount; badges from cached payload; tab switch is zero-fetch"
    operator_visible_failure: |-
      If the view does not self-heal: two users editing a snippet's linkages collaboratively can see
      divergent states — user A detaches a dataset on the data-entity page, user B (with the details page
      open) continues to see the dataset in the Linked Entities table and a stale count badge, and may make
      decisions on stale data. Bounded by how often the details page is left open across a concurrent edit;
      the staleness is invisible (no 'data may be stale' indicator). Needs a probe to confirm the exact
      refetch behaviour.
    severity: LOW
    confidence: MEDIUM
    probe_id: PENDING-F-132-2
    routes_to_finding: functional-test-demand
    use_case_kind: resolve-later
    coverage: unverified
    coverage_note: |-
      No test exercises concurrent linkage mutation against an open details page. Probe first (observe
      refetch-on-focus behaviour), then a characterization test pinning the staleness contract.

