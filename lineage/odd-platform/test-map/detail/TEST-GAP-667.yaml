behaviour: |-
  **HIGH forensic-integrity bug: every Activity-Feed read path joins `USER_OWNER_MAPPING ON OIDC_USERNAME = ACTIVITY.CREATED_BY AND DELETED_AT IS NULL` (lines 157-158, 178-179, 199-200, 221-222) WITHOUT a provider qualifier.** Activity rows written by a LOGIN_FORM 'alice' resolve to the SAME OwnerPojo as activity rows written by an LDAP 'alice' on every cross-mode deployment — even though they may be different people in the operator's identity directory. This is the READ-SIDE mirror of the `provider-null-cross-mode-bleed` mechanism the batch-N `ReactiveUserOwnerMappingRepositoryImpl` sidecar surfaced; the resolution-side primary is THAT sidecar; this one is the NEW primary for the READ-side. The activity-side write (`ActivityServiceImpl.createActivityEvent` line 47-49) records the username string only (`UserDto::username`), with no provider qualifier — so the data is structurally permissive of the bleed. Forensic incident response over an audit feed is misled: a reviewer reading 'who deleted this dataset on 2026-04-15 at 09:33' may see "alice (Owner #42)" without being able to distinguish whether it was LOGIN_FORM alice or LDAP alice. The bleed is symmetric: write-side records only username; read-side joins by username only. STRENGTHENS the existing read-side pin (no exact prior TEST-GAP exists for this REPOSITORY layer — TEST-GAP-7116 from index covers the resolution side at user-owner-mapping).
