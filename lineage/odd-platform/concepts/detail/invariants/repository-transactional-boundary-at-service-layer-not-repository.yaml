notes: "Cross-batch architectural convention surfaced by triangulating the 5 batch-H\n\
  repository sidecars together. Every Reactive*Repository is a thin SQL surface;\n\
  atomicity is the caller's responsibility. The convention is uniform; the gap is\n\
  the lack of defensive signalling at the repository signature (no @Transactional\n\
  -required annotation, no NPE on missing context, no compile-time guard).\n\nThe\
  \ batch-H ReactivePolicyRepositoryImpl finding identifies a CONCRETE LOST-UPDATE\n\
  race on PolicyServiceImpl.update: read-then-write outside any @ReactiveTransactional;\n\
  client A reads policy v1, client B reads v1, A writes v2, B writes v3 BASED ON v1\n\
  (success, but A's v2 was clobbered). The update_at column moves monotonically so\n\
  no exception is raised. Service-level fix: wrap PolicyServiceImpl.update in @ReactiveTransactional\n\
  with isolation = SERIALIZABLE, or introduce an optimistic-concurrency token (a `version`\n\
  field on PolicyPojo).\n\nThe batch-H ReactiveAlertRepositoryImpl finding identifies\
  \ a DELIBERATE absence on\nAlertServiceImpl.updateStatus — the platform tolerates\
  \ the read-then-write race on\nuser-driven status changes; the reopen-conflict guard\
  \ catches the data-integrity case\nat the application level. This is a different\
  \ shape: explicit choice not to wrap.\n\nSTRENGTHENED batch 2026-05-19I via 5 service-layer sidecars —\n\
  the convention is now confirmed END-TO-END (repository-side + service-side). The\n\
  CANONICAL site is DataEntityServiceImpl (8 occurrences across the file).\nThe INTENTIONAL\
  \ exception is AlertServiceImpl.updateStatus (compensating AOP).\nThe EXTREME variant\
  \ is IngestionServiceImpl.ingest (entire batch in one TX).\nThe OUTLIER is PolicyServiceImpl.{create,update,delete}\
  \ (zero annotation — lost-update\n+ orphan-binding races, both CONCRETE).\n\nRecommended\
  \ cleanup paths:\n\n  - Audit every service-layer method that calls a Reactive*Repository\
  \ to confirm\n    @ReactiveTransactional is present on read-then-write paths.\n\n\
  \  - Introduce a project-internal `@RequiresTransaction` annotation on repository\n\
  \    methods that callers MUST wrap (e.g. `update`, `delete`, `replaceLineagePaths`).\n\
  \    Verify at build time via Spring AOP or custom Checkstyle rule.\n\n  - Document\
  \ the convention in a top-level repository conventions doc (internal\n    /architecture\
  \ page) so future maintainers reading any Reactive*Repository class\n    can infer\
  \ the atomicity contract from a single canonical location.\n\nFour DOC-NNN candidates\
  \ flow from this invariant:\n  (a) Internal Architecture doc: 'Persistence layer\
  \ conventions' — name the\n      service-layer transaction convention; list the\
  \ @ReactiveTransactional sites\n      across the codebase.\n  (b) Public Roles/Policies/Owners\
  \ doc pages: note the lost-update race possibility\n      on Policy update (PolicyServiceImpl.update\
  \ is currently un-transactional)\n      so operators can plan for it; alternatively,\
  \ fix the bug at the service layer.\n  (c) Public Alerts doc page: note the deliberate\
  \ read-then-write tolerance on\n      changeAlertStatus + the reopen-conflict guard\
  \ at the application layer.\n  (d) Public Ingestion page: note the single-transaction-per-batch\
  \ contract (no\n      per-entity isolation, no DLQ).\n\nCompanion invariants:\n\
  \  - `service-tier-transactional-asymmetry-between-sibling-services` (the batch-I\n\
  \    headline observation — PolicyServiceImpl vs RoleServiceImpl asymmetry).\n\
  \  - `single-transaction-per-batch-ingestion-no-per-entity-isolation` (the\n   \
  \ extreme variant on IngestionServiceImpl.ingest).\n  - `reopen-conflict-server-enforced-application-logic-not-db-constraint`\
  \ (the\n    compensating mechanism for AlertServiceImpl.updateStatus's deliberate\
  \ omission).\n"
