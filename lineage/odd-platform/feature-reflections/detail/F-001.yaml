- id: H-002
  hypothesis: "When a user opens an entity's detail page once, the catalog records exactly one view for that entity (so the Popular ranking reflects one human read per page-open)."
  derivation: "A 'view count' a product owner demos is one-read-one-count by definition; the home-page Popular strip is sold as 'most-viewed', which presumes the counter tracks reads faithfully."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      Opening a detail page once registers as +2, not +1. `DataEntityDetails.tsx:56-64` has a useEffect
      whose dependency array includes the response-derived value `details.status?.status`: the effect
      fires once on mount (status undefined → dispatch → +1), the fulfilled response flips status from
      undefined to a concrete enum, the dep-array changes, the effect re-fires (→ second dispatch → +1),
      and the cycle quiesces at +2 because the second response carries the same status. This is the
      LSN-017 canonical bug, empirically pinned by probe P-004 (xhr_count=2 + DB delta=2, regex-filtered
      exact path). The hop-1 useEffect is the SOLE source of the doubling; every other hop in the chain
      has multiplicity=1. The fix is one line (remove line 63 from the dep array). The live doc now
      openly documents the bug ("opening a detail page registers as +2, not +1"), which makes it an
      honest-but-shipped defect rather than a hidden one.
    evidence:
      - sidecar: odd-platform__ts__react-component__component__DataEntityDetails.md
        section: bugs_limitations_corner_cases
        cite: "DataEntityDetails.tsx:56-64"
        note: "5th dep-array entry details.status?.status is response-derived → self-feeding refire."
      - sidecar: odd-platform__ts__react-component__component__DataEntityDetails.md
        section: downstream_side_effects
        cite: "lineage/odd-platform/probe-runs/2026-05-19-P-004.yaml"
        note: "Empirical pin: xhr_count=2 + view_count delta=2 per single page-open."
    operator_visible_failure: |
      (1) The Popular ranking double-counts every UI-driven page-open relative to a direct API read —
      the home page over-weights entities people reach by clicking versus entities reached by scripts or
      deep links. (2) The doubling makes UI-driven inflation exactly 2x cheaper than API-driven inflation
      (one page-render = +2 votes vs one curl = +1), compounding the inflatability surface in H-003.
      (3) Every legitimate re-fetch (a DEG-membership change, a status edit) also fires twice, doubling
      hot-row write contention on data_entity.view_count and flickering the page chrome twice. (4) An
      operator reading the Popular strip to decide what to deprecate / promote is reasoning over a signal
      that is silently 2x-skewed toward click-reachable entities.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-003
  hypothesis: "The Popular ranking reflects organic interest — a single user cannot trivially promote an entity of their choosing to the top of the home-page strip."
  derivation: "A 'most-popular' surface that is the platform's first impression carries an implicit anti-abuse requirement: an operator of a catalog like this expects the ranking to resist gaming, the way DataHub/Amundsen 'popular'/'frequently-used' surfaces aggregate distinct-user or query-frequency signals rather than a single forgeable counter."
  seed_source: negative-space
  sme_consultation_recommended: true
  sme_consultation_question: "How do industry data catalogs (DataHub 'usage', Amundsen 'popular tables', OpenMetadata) define and harden their popularity/usage signal — is a single cumulative read-counter with no distinct-viewer dimension considered acceptable, or is distinct-user / query-frequency the canonical baseline?"
  sme_consultation_archetype: comparative
  validation:
    verdict: contradicted
    actual_behavior: |
      The ranking is trivially pumpable by any single caller. The producer (`incrementViewCount`) has no
      rate-limit, no idempotency key, no per-user/per-session view cap, no time-decay; the consumer
      (`listPopular`) orders exclusively by the resulting counter; neither endpoint carries an
      authorization gate beyond `.authenticated()`, and under `auth.type=DISABLED` (a shipped config)
      neither requires authentication at all. A scripted loop of `GET /api/dataentities/{id}` from one
      caller pushes that entity to position 0 of the home-page strip with no resistance — confirmed from
      primary source in getPopular.md and empirically demonstrated for the DISABLED-mode anonymous case
      by probe P-002 (10 anon GETs → +10 view_count). The signal has exactly one dimension (cumulative
      reads); there is no distinct-viewer count, no recency weighting, no human-curated override.
    evidence:
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: bugs_limitations_corner_cases
        cite: "ReactiveDataEntityRepositoryImpl.java:173-180 + :633"
        note: "Unconditional +1 increment (no throttle) + sole orderBy on the same column = pumpable loop."
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveDataEntityRepositoryImpl.md
        section: security.known_security_gaps
        cite: "ReactiveDataEntityRepositoryImpl.java:173-180, 630-649"
        note: "view_count inflation surface is structural — method-only increment, no per-caller throttle."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: tests_coverage_semantic
        cite: "lineage/odd-platform/probe-runs/2026-05-19-P-002.yaml"
        note: "DISABLED-mode anonymous inflation empirically confirmed (10 anon GETs → +10)."
    operator_visible_failure: |
      (1) A malicious or merely-curious caller can promote ANY entity — including a deceptively-named one
      ("production-database-credentials") — to the top of every user's home page, turning the platform's
      first impression into an attacker-controlled surface. (2) Under the DEFAULT auth.type=DISABLED, the
      attacker needs no credentials at all. (3) Even absent malice, the ranking conflates legitimate
      interest with bot traffic, hot-link traffic, and the H-002 doubling, so an operator trusting Popular
      to surface "what the team values" is misled by "what got fetched most, by anyone, including
      non-humans." (4) There is no operator lever (no curated-override, no per-tenant scope) to correct it.
    severity: HIGH
    confidence: HIGH
    routes_to_finding: bug-candidate

- id: H-004
  hypothesis: "When an operator marks an entity 'exclude from search' (to hide an internal / staging / scratch entity), that entity does not appear in the home-page Popular strip."
  derivation: "Request-input / column-name alignment (Category-F shape): the column EXCLUDE_FROM_SEARCH names a hide-from-discovery intent; a user setting it reasonably expects the entity hidden from all discovery list surfaces, and 9 of the codebase's list-shapes honour it — so the Popular strip (also a discovery list) should too."
  seed_source: negative-space
  validation:
    verdict: contradicted
    actual_behavior: |
      The Popular strip surfaces exclude-from-search entities. The shared CTE-builder `cteDataEntitySelect`
      (lines 909-939), which `listPopular` consumes, applies `HOLLOW.isFalse()` and the soft-delete filter
      but NOT `EXCLUDE_FROM_SEARCH` — confirmed from primary source. Every other list-shaped surface in the
      codebase respects the flag (countByState, findByState via JooqFTSHelper, the 9 search/facet/statistics
      locations); Popular (along with by-owner, by-term, by-DEG, and single-entity details) is the one
      discovery list that ignores it. If an internal entity has accumulated view_count (operator-team reads,
      or inflation), it bubbles to the public home page despite the operator's hide-from-discovery intent.
      The live doc now documents this explicitly ("exclude_from_search is a full-text-search signal only —
      it does not hide entities from the Recommended panel"), which converts a silent contradiction into a
      documented caveat — but the behaviour still contradicts the natural reading of the column name.
    evidence:
      - sidecar: odd-platform__java__repository_reactive__repository__ReactiveDataEntityRepositoryImpl.md
        section: invariants
        cite: "ReactiveDataEntityRepositoryImpl.java:909-939 vs :448, :974"
        note: "cteDataEntitySelect omits EXCLUDE_FROM_SEARCH; getDataEntityDefaultConditions applies it."
      - sidecar: odd-platform__java__DataEntityController__controller-method__getPopular.md
        section: bugs_limitations_corner_cases
        cite: "ReactiveDataEntityRepositoryImpl.java:909-939"
        note: "Popular is the sole list-shape that ignores the flag respected in 9 other locations."
    operator_visible_failure: |
      (1) An operator who marks a sensitive / internal / scratch entity exclude-from-search to keep it off
      discovery surfaces finds it can still appear on the home page's Popular strip, visible to every
      signed-in user (and anonymously under DISABLED). (2) For a regulated-data deployment this is a
      potential disclosure path — the operator's mental model ("hidden from discovery") is violated on the
      single most prominent discovery surface. (3) Because the column is named for a search-hiding intent,
      the operator has no signal that Popular is exempt unless they read the (now-updated) doc caveat.
    severity: MEDIUM
    confidence: HIGH
    routes_to_finding: caveat-candidate

