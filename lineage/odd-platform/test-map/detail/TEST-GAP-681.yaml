  - "OwnerServiceImpl.md says (gaps): 'The cascade-block leg independence test is the second-highest priority: a maintainer refactor that accidentally flipped one of the three OR conjuncts to AND would silently allow deletion of Owners with active bindings, producing the orphan-row scenarios that REFACTOR-430 + REFACTOR-427 enumerate.'"
