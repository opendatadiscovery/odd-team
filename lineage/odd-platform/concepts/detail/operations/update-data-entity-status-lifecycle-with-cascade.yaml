  \ with batch D's\nHousekeepingTTLProperties to break the 30-day data-entity-delete\
  \ TTL\n— see cross-cutting invariant \"TTL retention broken by\nstatusUpdatedAt\
  \ nullification\". Recommended cleanup: 3-line fix\nin applyStatus + regression\
  \ test.\n"
