proposed_action: |-
  WebTestClient integration test. (a) Create Owner X with user uX owning 3 entities; Owner Y with user uY owning 5 entities. (b) Authenticate uX. (c) POST /api/search with empty query to create a search session for uX. (d) GET /api/search/{session_id}/facet/OWNERS?page=1&size=100. (e) Assert response contains BOTH Owner X AND Owner Y in the CountableSearchFilter list (the cross-owner enumeration), with their respective counts (3 and 5). (f) Assert response also contains other owners' names + counts (catalog-wide). (g) Test comment 'LOCKS the cross-owner facet-count enumeration contract as of 2026-05-19 (REFACTOR-024/340 sibling on facets surface). When owner-scoping is added to facet aggregators, this test FLIPS to expect ONLY Owner X (and possibly Owner-X-co-owned-entities-counts) in the response.' Pair with DISABLED-mode anonymous test asserting unauthenticated callers receive the same payload. This is regression-pin + vulnerability-proof.
