  Tag-name length / charset / pattern — no test exercises empty strings, whitespace-only strings, very long names (no DB column constraint per migrations grep), or control-character names. The corresponding service-layer concern is REFACTOR-223's bounded-DoS angle. An operator with `DATA_ENTITY_TAGS_UPDATE` can mint Tag rows with names of arbitrary length (per `TextDataType`-bound size), with newline / control characters, or whitespace-only. The popular-tags query returns these to every other user.
