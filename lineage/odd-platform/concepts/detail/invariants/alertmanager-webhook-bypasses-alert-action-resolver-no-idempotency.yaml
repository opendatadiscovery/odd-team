notes: |
  Cross-batch architectural-hygiene observation. The divergence is INTENTIONAL
  (the implicit ADR is named) but the operator-facing doc-gap is concrete: the
  AlertManager-integration page describes the unauthenticated posture and the
  entity_oddrn orphan case, but does NOT name the idempotency gap.

  Combined with the entity_oddrn payload-trust surface (see companion invariant
  `entity-oddrn-trust-from-alertmanager-webhook`), the AlertManager path has
  THREE compounding gaps:

    (1) Unauthenticated by design (operator-delegated network controls).
    (2) entity_oddrn label trusted verbatim — spoof + orphan + XSS surfaces.
    (3) No idempotency — Prometheus retries produce duplicate alerts.

  Recommended cleanup paths:

    (a) Doc: extend `/configuration-and-deployment/odd-platform#prometheus-alertmanager-integration`
        with an 'Idempotency' subsection: "AlertManager retries (on transient
        network errors) produce duplicate alerts. Configure AlertManager's
        `repeat_interval` and `group_wait` accordingly."

    (b) Code: add a DB-level partial unique index on (data_entity_oddrn, type,
        labels_hash) WHERE status = 'OPEN' AND deleted_at IS NULL — closes
        the gap at the persistence layer; cheaper than re-routing the webhook
        path through AlertActionResolver.

    (c) Code: route handleExternalAlerts through AlertActionResolver — closes
        the gap at the service layer but adds the snapshot-read cost to every
        AlertManager webhook call. Likely-acceptable trade-off given low
        webhook frequency.

  Cross-references:
    - Companion: `entity-oddrn-trust-from-alertmanager-webhook` (the second
      AlertManager-path gap; both surfaced by the AlertServiceImpl batch-I sidecar).
    - Existing concept: `alertmanager-webhook-receiver` (the entity covering
      the webhook surface; this invariant adds the de-duplication semantic).
