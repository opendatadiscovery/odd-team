mitigations_unimplemented:
  - |-
    Add a new config shape notifications.receivers.webhook.routes (List
    of {url, predicate-on-namespace, predicate-on-owner}) — operators
    configure multiple receivers with routing predicates. Implement at
    NotificationConfiguration as a List of WebhookNotificationSender
    beans + a routing-aware AlertNotificationMessageProcessor that
    filters before fan-out.
  - |-
    OR (smaller scope): add per-channel owner-allowlist config knob —
    notifications.receivers.webhook.owners-allowlist (a List of owner
    names). The webhook sender consults dataEntity.owners[] and
    short-circuits if no owner matches. Single fix-point at
    WebhookNotificationSender.send; no schema change.
  - |-
    Document the one-URL-per-deployment constraint on the live
    notifications page with operator-facing mitigation guidance —
    deploy a routing relay (Lambda / nginx-lua) that parses the payload
    and forwards to the correct downstream.
  - |-
    Cross-cutting case-law: surface "unconditional broadcast across
    owners" as a P-07 PILLAR-LEVEL design constraint in the system
    mission; doc-side operators reading active-platform-features should
    know the platform's posture before deploying notifications.
notes: |-
  NEW HIGH-severity invariant captured in batch 2026-05-20Y from the
  WebhookNotificationSender sidecar's primary-source evidence. The
  cross-tenant-exposure pattern is a P-07 FEATURE-LEVEL constraint that
  applies to all three channels (Slack, Webhook, Email), but is most
  consequential at the webhook channel where the payload is the full
  JSON DTO with the broadest PII surface.

  Cross-cutting connections:
    - Pairs with the webhook-no-hmac-no-signature invariant (also batch Y)
      — the URL is BOTH a routing key AND a credential; leaking it
      reveals BOTH the cross-tenant audience AND the forgery vector
    - Pairs with the slack-mrkdwn-injection invariant (also batch Y) —
      the broadcast blast radius is set by the single channel membership
      across owners
    - Pairs with the cross-channel-runtimeexception-abort invariant
      (also batch Y) — all four batch-Y findings stem from the
      architectural simplicity of "one fan-out loop, no per-recipient
      logic"
    - Extends the unconditional-broadcast / pii-passthrough drift class
      with primary-source evidence at the webhook channel

  Two DOC-NNN candidates flow from this invariant:
    (a) Document the one-URL-per-deployment constraint on the live
        notifications page; surface as a P-07 PILLAR posture, not just
        a webhook-channel detail
    (b) Cross-link from the P-09 Security & Access Control pillar to the
        outbound-delivery posture — multi-tenant deployments need to
        know the posture before relying on the platform for alert
        delivery
