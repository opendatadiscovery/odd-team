behaviour: |-
  SearchFacetsHousekeepingJob (the TTL eviction job for `search_facets`) has ZERO test coverage. The class is one of the 5 housekeeping jobs F-010 enumerates (`P-08:F-002 Housekeeping TTL Enforcement`); it deletes rows where `LAST_ACCESSED_AT <= now() - housekeepingTTLProperties.getSearchFacetsDays()` (default 30 days per application.yml:169). No unit test pins the delete predicate; no integration test asserts that the job prunes rows on a real Postgres after `last_accessed_at` ages past TTL; no test asserts that rows NEWER than TTL are PRESERVED. The class belongs to F-010 test_matrix.integration.uncovered (end-to-end 15-min cycle with seeded data including aged-out search_facets rows). Cross-pillar P-01 (search-session lifecycle) + P-08 (operational housekeeping). The original batch-M emission claimed "NO TTL eviction, V0_0_52 has no search_facets entry, TTL TODO never implemented" — all four sub-claims were FACTUALLY WRONG (verified 2026-05-19 against `SearchFacetsHousekeepingJob.java`, `V0_0_52__introduce_housekeeping.sql:1-7`, `application.yml:169`); see LSN-018 for the methodology miss.
