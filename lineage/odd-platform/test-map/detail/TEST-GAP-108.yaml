gap_id: TEST-GAP-108
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java AuthorizationManagerCondition config-key-consumer:auth.type@L11
surfaced_by:
- AuthorizationManagerCondition@L11.md:bugs_limitations_corner_cases.[2]
- AuthorizationManagerCondition@L11.md:security.known_security_gaps.[2]
behaviour: Under `auth.type=DISABLED` (the application.yml:34 default), `DisabledAuthSecurityConfiguration.java:13-18`
  configures `.anyExchange().permitAll()` — every endpoint, every method, every payload
  is permitted with no authentication and no authorization. The composite AuthorizationManagerCondition
  correctly returns FALSE for DISABLED, but no doc surface tells operators DISABLED
  is the DEFAULT nor that 'no auth + no authz' is the behaviour.
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/config/DisabledAuthDefaultPostureTest.java
  name: applicationYmlDefault_authTypeDISABLED_allEndpointsReachableAnonymously
evidence:
- 'AuthorizationManagerCondition@L11.md says: ''auth.type=DISABLED (the default per
  application.yml:34) bypasses authentication AND authorization ... every endpoint,
  every request method, every payload is permitted with no authentication and no authorization''
  (severity HIGH)'
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[0] (triangulated
  insecure default)
cross_references:
- concepts.yaml:entities[Auth Mode].security_aggregate.weaknesses.[0]
- retrospectives/LSN-001-attachment-ephemeral-default.md (default-insecure shape)
proposed_action: Add Spring context-startup test that LOADS application.yml unmodified;
  assert `DisabledAuthSecurityConfiguration` is wired (no override) and a representative
  selection of endpoints (`/api/dataentities/{id}`, `/api/alerts`, `/api/genai/ask`,
  `/api/collectors`) all return 200 anonymously. Locks the literal-default deployment's
  posture as the canonical insecure-default failure mode.
