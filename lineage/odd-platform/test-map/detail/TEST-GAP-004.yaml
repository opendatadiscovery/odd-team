gap_id: TEST-GAP-004
category: missing-security
criticality: CRITICAL
node_ids:
- odd-platform java org.opendatadiscovery.oddplatform.controller controller:AlertController
surfaced_by:
- AlertController.md:bugs_limitations_corner_cases.[1] (severity HIGH per sidecar)
behaviour: '`getAllAlerts` returns the entire platform''s alert stream to any authenticated
  user — there is no Permission / Role gate at the controller and no service-layer
  principal argument. Under `auth.type=DISABLED` this becomes anonymous read of every
  alert in the system. No test catches this.'
test_files_existing: []
test_files_proposed:
  path: odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/AlertAuthorizationTest.java
  name: getAllAlerts_authenticatedNonOwnerUser_returns200WithAllPlatformAlerts
evidence:
- 'AlertController.md says: ''`getAllAlerts` returns the entire platform''s alert
  stream to any authenticated user'' (severity HIGH)'
- 'concepts.yaml:entities[Alert].security_aggregate.weaknesses.[0] verbatim: ''`getAllAlerts`
  returns the entire platform''s alert stream to ANY authenticated user — no admin
  gate, no role check (severity HIGH per AlertController sidecar)'''
- 'Grep against `odd-platform-api/src/test` for `AlertController`: 0 matches'
cross_references:
- concepts.yaml:entities[Alert].security_aggregate.weaknesses.[0]
proposed_action: Add a `WebTestClient` test asserting current behaviour (any authenticated
  caller reads all alerts), then a complementary fail-case test for the intended-design
  assertion (admin-only gate). Locks in posture and prevents silent regressions.
