terminal_side_effect:
  side_effect_class: db-write
  description: |-
    UPSERT row in data_quality_test_severity (or equivalent) with new severity
    value. No audit-side write (no INSERT into activity); no notification
    fan-out; no Slack / webhook emission. The dataset's SLA colour
    (consumed by F-022 SLA badge BI integration) flips synchronously on the
    next read.
  evidence: 'ReactiveDataQualityRepositoryImpl.java:87-102 (the upsert) + DataQualityServiceImpl.java:62-81 (absence of ActivityEvent)'
  cardinality_per_call: 1
observed_vs_expected:
  facets:
    - facet_id: severity_mutation_no_activity_event
      drift_class: audit_silence_on_gated_mutation_blast_radius_via_sla_color
      severity: HIGH
      observed: |-
        Gated by DATASET_TEST_RUN_SET_SEVERITY permission but emits NO
        ActivityEvent row. No last_modified_by, no version increment, no
        Slack / webhook notification. The upsert is idempotent in OUTCOME but
        loses HISTORY: prior severity overwritten. A compliance reviewer
        auditing "who changed this dataset's SLA to Red on May 14?" cannot
        answer from the platform without DB inspection. An operator triaging
        a dashboard flip cannot tell whether (a) a test result changed or
        (b) someone reclassified a test's severity.
      expected: |-
        ActivityEvent.builder().eventType(DATA_QUALITY_TEST_SEVERITY_CHANGED)
        .oldState(...).newState(...).principal(...) emission inside the
        service. ActivityEventType enum gains DATA_QUALITY_TEST_SEVERITY_CHANGED;
        activity-event-payload schema gains a variant. F-021 (Activity Feed)
        is the canonical sink. Two-step service (read old → emit event →
        upsert) is the canonical fix; prior severity is read at upsert-time
        anyway via the existing-row check.
      evidence:
        - 'DataQualityServiceImpl.java:62-81 (no ActivityEvent)'
        - 'DataQualityController.java:51-61 (thin proxy)'
        - 'ReactiveDataQualityRepositoryImpl.java:87-102 (onDuplicateKeyUpdate — no last_modified_by)'
        - 'documentation/docs/data-quality/sla-statuses.md:44 (severity-drives-SLA-colour relationship; implicit ADR per DataQualityController sidecar)'
        - 'system-mission.md canonicalisation candidate 3 (audit-log presence asymmetry — this is a NEW invocation site of the pattern)'
      ui_unverified: false
    - facet_id: sla_blast_radius_amplification_via_bi_integration
      drift_class: gated_mutation_invisible_change_flows_to_bi_tools_cross_origin
      severity: MEDIUM
      observed: |-
        Severity changes feed the SLA colour exposed at /api/datasets/{id}/sla
        (the BI-embeddable PNG endpoint per F-022 + SHB-043). Operators in
        the regulated-data audience (financial, healthcare, government) see
        their downstream BI dashboards flip colour with NO platform-side
        signal of who triggered it. Blast radius is bigger than the F-019
        owner-lifecycle audit-silence case because the change is consumed
        OUTSIDE the platform UI (Confluence, Notion, Excel, Looker tiles).
      expected: |-
        Same as primary facet (activity-event emission) — once the audit
        event exists, BI consumers can subscribe to the event stream via
        F-009 WAL-driven notification delivery path (cross-feature linkage).
      evidence:
        - 'F-022 / SHB-043 SLA badge cross-origin embed observation'
        - 'SLACalculator.java:80-100 (the colour algorithm)'
      ui_unverified: false
    - facet_id: severity_lifecycle_history_unrecoverable
      drift_class: upsert_idempotent_in_outcome_loses_change_history
      severity: MEDIUM
      observed: |-
        ReactiveDataQualityRepositoryImpl.java:87-102 uses onDuplicateKeyUpdate
        on (DATA_QUALITY_TEST_ID, DATASET_ID) with no version column, no
        history table. A test's severity history is unrecoverable from
        platform storage. The same shape as F-013 silent UPDATE-not-UPSERT
        (custom metadata fields) — but applied to a permission-gated
        compliance-impactful surface.
      expected: |-
        Either (a) emit ActivityEvent (primary facet) which preserves history
        in the activity log, OR (b) add a versioned-row history table for
        severity changes specifically, OR (c) document the
        unrecoverable-history constraint operationally on the docs page.
      evidence:
        - 'ReactiveDataQualityRepositoryImpl.java:87-102'
        - 'F-013 (custom metadata field — sibling pattern)'
      ui_unverified: false
