mitigations_unimplemented:
- 'Refactor the LoadMore accumulator to live inside the Immer draft of the slice
  reducer — surfaces in DevTools timeline and supports snapshot-based debugging'
- 'Add unit tests that explicitly reset the module-level globals between cases
  (or extract the reset into a beforeEach helper) — surfaces the test-fragility
  concern'
- 'Document the pattern in a comment at the slice file — future contributors
  authoring a sibling slice should understand the trade-off explicitly'
notes: |-
  New invariant captured in batch 2026-05-19J. The module-level mutable globals
  pattern is intentional and load-bearing for the LoadMore performance — but it
  is a latent bug magnet for a maintainer extending the lineage subsystem.

  The maintainer should consider one of three paths:
    (a) Document the pattern and keep it (current state).
    (b) Refactor to live inside the Immer draft — small performance cost,
        significant observability benefit.
    (c) Migrate the entire lineage data model to RTK Query (which has native
        cache + invalidation primitives) — biggest refactor, biggest payoff.

  Path (a) is the cheapest. Path (b) is the maintainability win. Path (c) is the
  architectural cleanup.
