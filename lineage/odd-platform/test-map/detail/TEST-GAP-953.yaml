proposed_action: |-
  Author RelationshipControllerListEndpointTest as a @SpringBootTest +
  WebTestClient harness with seeded relationship-class data entities:
  three ERD-type rows and three GRAPH-type rows. Five cases:
  (a) type=ERD → assert items.size() == 3, all items.type == ENTITY_RELATIONSHIP;
  (b) type=GRAPH → assert items.size() == 3, all items.type == GRAPH_RELATIONSHIP;
  (c) type=ALL → assert items.size() == 6, mixed types;
  (d) query='foo' where one relationship's external_name contains 'foo' and
  one of its source entities is named 'foo' → assert ONLY the
  relationship-named match returns (pins the search-semantic scope);
  (e) happy-path shape: assert items[0].sourceDataEntity is populated,
  items[0].targetDataEntity is populated, items[0].dataSource ref exists.
