expected_outcome: |
  Stress questions for the AppInfoMenu UI surface — the terminal page-render
  site of F-035 (Operator-Configured Additional Links) AND the projectVersion
  disclosure surface paired with AppInfoController.

  This is the UI-side probe complementing the backend-only P-128 (LinksController).
  P-128 verified BACKEND auth-gate / ordering / boot-binding. P-173 verifies
  what gets RENDERED to a real browser:

  (1) REVERSE-TABNABBING (Category B / security — F-035 facet
      `reverse_tabnabbing_target_blank_without_rel_noopener_noreferrer`):
      AppInfoMenu.tsx:60-66 renders `<Link target='_blank'>` (and lines 41, 95,
      103, 112 for the hardcoded gitbook/slack/github/review links) WITHOUT
      `rel='noopener noreferrer'`. Hypothesis: the rendered <a> element in the
      DOM has `target="_blank"` and NO `rel` attribute, leaving `window.opener`
      reachable to any operator-configured destination. Verify by inspecting
      the rendered DOM of EACH link (the 4 hardcoded + the N operator-configured).

  (2) URL-SCHEME PASSTHROUGH (Category F — F-035 facet
      `url_scheme_not_validated_javascript_data_uris_passthrough`):
      AdditionalLinkProperties.java:8 has no @URL constraint; LinksController
      passes through verbatim; AppInfoMenu uses the operator-configured `link.url`
      as `to={link.url}` of `<Link>` (line 61). Hypothesis:
        (a) `javascript:alert(1)` — React 17+'s url sanitiser in react-router-dom
            v6 + react-dom should neutralise into a no-op href (or strip).
            Verify the rendered <a href> is sanitised AND verify clicking the
            link does NOT execute the alert.
        (b) `data:text/html,<script>alert(1)</script>` — React does NOT block
            data: URIs in <a href>; the link will be clickable. Browser
            handling varies — modern Chrome/Firefox refuse top-level data:
            navigation since ~2018 but may still leak via target='_blank'.
        (c) `vbscript:msgbox(1)` — only legacy IE-equivalent contexts care;
            assert the link is at minimum NOT executed in modern Chromium.

  (3) PROJECT VERSION ANONYMOUS DISCLOSURE (Category D — paired with AppInfoController
      F-009 surface): the projectVersion is rendered inline at lines 47-48 as
      `<Typography>{appInfo.projectVersion}</Typography>` followed by
      `ODD Platform version`. Hypothesis under auth.type=DISABLED + the SPA
      mounting at /: the AppToolbar renders without authentication; the
      AppInfoMenu fires GET /api/appInfo unauthenticated (DISABLED → permitAll);
      response includes projectVersion; the menu renders the version label to
      an anonymous viewer. Verify by loading the SPA root URL with NO session
      cookie and inspecting the toolbar's About menu DOM.

  (4) HOVER-ONLY ACTIVATION (Category E / UX): the menu opens on `onMouseEnter`
      (line 81), not on click. Hypothesis: touch-device users (no hover event)
      cannot open the menu. The `aria-haspopup='true'` (line 80) plus the
      `aria-controls={menuId}` suggest keyboard accessibility was intended but
      the keyboard activation handler (onClick / onKeyDown) is absent.
      Verify the menu is unreachable via keyboard tab+enter.

  (5) STALE FRAGMENT — the menu uses `keepMounted` (line 90), which means the
      AppInfoMenu's DOM stays mounted forever after first hover; subsequent
      hover events do not re-fire useAppLinks / useAppInfo. Combined with
      TanStack Query's default staleTime=0, the FIRST mount fires the requests,
      and the requests are then cached in React Query. Verify that operator
      config changes (after the FIRST mount) are NOT visible until full reload.
