  - "DataEntityServiceImpl.java:292-295 (only value extracted from form)"
  - "ReactiveMetadataFieldValueRepositoryImpl.java:95-104 (UPDATE sets the value text column without inspecting field type)"
  - "V0_0_1__init.sql:179 (value text — unbounded)"
  - "MetadataTypeEnum.java:3-12 (the 8-value enum that is declared but unenforced)"
  - "components.yaml:2077-2086 (the OpenAPI declaration)"
cross_references:
  - "TEST-GAP-492 / 494 / 495 / 496 (co-located gaps in upsertMetadataFieldValue)"
  - "DOC-NNN candidate: document the unvalidated-write-time semantics of MetadataFieldType"
  - "REFACTOR-NNN candidate: add server-side validation matching value to MetadataFieldType"
proposed_action: |-
  Testcontainers integration test parametrised by type. (a) For each of 4 types (INTEGER, FLOAT, BOOLEAN, JSON), pre-create metadata field F with that type. (b) Pre-create (X, F) value row. (c) PUT /api/dataentities/X/metadata/F with body {value: 'not a valid value for this type'}. (d) Assert HTTP 200. (e) Query the stored value returns the user-supplied invalid string verbatim. (f) Test comment 'LOCKS the no-type-validation contract as of 2026-05-19. When REFACTOR-NNN adds server-side type-check, this test FLIPS to expect 400 for each mismatched type.' Test bundles all 4 type-mismatch cases in one file to drive consistent enforcement when fix lands.
