proposed_action: |-
  Add `CreateEnumValueBulkReplaceTest` at `odd-platform-api/src/test/java/org/opendatadiscovery/oddplatform/api/`. Five test methods:
  1. `createEnumValue_partialBody_softDeletesOmittedItems_pinsBulkReplaceSemantics` — seed field F with 3 enum values [A, B, C]; POST body containing only item A (with its id); GET field's enum values; assert B and C are soft-deleted, only A remains. PIN the destruction.
  2. `createEnumValue_emptyItemsArray_softDeletesAllExistingItems_pinsAbsoluteWipe` — seed field F with 3 values; POST `items: []`; GET; assert ALL three are soft-deleted. PIN the wipe-via-empty-array shape.
  3. `createEnumValue_fullBody_preservesAllExistingItems_pinsHappyPathContract` — seed field F with [A, B, C]; POST full body with all three ids; GET; assert all three remain. Baseline non-regression.
  4. `createEnumValue_newItemWithoutId_bulkCreated_preExistingItems_softDeleted_pinsMixedPath` — seed [A]; POST body with new item D (no id) only; assert A is soft-deleted, D is created. PIN the new-item path doesn't preserve old ones unless explicitly included.
  5. `createEnumValue_responseShape_returnsNewStateNotDiff_pinsResponseContract` — execute the partial-body scenario; assert the response body includes only the surviving items (no soft-deleted ones). PIN that the API gives no destruction signal in the response.

  Pair with REFACTOR-NNN: split into two endpoints OR add explicit `replace_existing` flag. Pair with DOC-NNN: warn loudly in the OpenAPI description + live doc page that body = new state.
