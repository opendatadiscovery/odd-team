batch_origin_note: |-
  2026-05-20 batch W — NEW pillar-anchored feature minted from the
  NamespaceController controller-class sidecar. Per Rule 0 evaluation: the
  Namespace lifecycle is a USER-OBSERVABLE Management capability — operators
  CRUD the label-dimension scope for tags / terms / data sources / collectors
  via this surface. It is distinct from F-019 (Owner Lifecycle Management;
  the operator surface for identity-primitives) and from F-008 (Batch
  Ingestion; the receiving end of the producer ecosystem that USES
  namespaces). The pillar P-08 sub-feature seed names "Namespaces
  (label-dimension scoping for tags / terms)" as the FIRST sub-feature —
  this anchors F-028 as a coherent independent feature within the same
  pillar.

  The substitution from EXTEND-an-existing-feature to MINT-F-028 is
  justified because (a) the substrate evidence (the 5-endpoint controller
  surface + 4-cascade-block delete logic + 4-side-door bypass + dual-FTS
  vector update) is too rich to fold into any existing feature without
  losing the user-observable shape; (b) the side-door problem cuts
  ACROSS pillars (P-06 / P-08 / P-10) — catalogued here as THIS feature's
  primary drift gives the cross-pillar finding a stable home; (c) the
  operator-facing /features/management Namespaces row is itself a
  documented user-observable surface in the Management UI.

  Cross-references emit back-links to F-002 (term-namespace coupling),
  F-008 (ADR-CANDIDATE-143 counterfactual closure), F-018 (structurally
  identical tag-directory side-door pattern), F-019 (sibling P-08
  Management capability), F-006 (the central RBAC gate the side-doors
  bypass), F-020 (one of the 4 side-door services + Collector-driven
  namespace inheritance for S2S).
